u003chttps://www.better-auth.com/docs/plugins/oauth-provider\u003e\n- SSO: \u003chttps://www.better-auth.com/docs/plugins/sso\u003e\n- SCIM: \u003chttps://www.better-auth.com/docs/plugins/scim\u003e\n- Bearer: \u003chttps://www.better-auth.com/docs/plugins/bearer\u003e\n- Device Authorization: \u003chttps://www.better-auth.com/docs/plugins/device-authorization\u003e\n- Captcha: \u003chttps://www.better-auth.com/docs/plugins/captcha\u003e\n- Have I Been Pwned: \u003chttps://www.better-auth.com/docs/plugins/have-i-been-pwned\u003e\n- Last Login Method: \u003chttps://www.better-auth.com/docs/plugins/last-login-method\u003e\n- Multi-Session: \u003chttps://www.better-auth.com/docs/plugins/multi-session\u003e\n- OAuth Proxy: \u003chttps://www.better-auth.com/docs/plugins/oauth-proxy\u003e\n- One-Time Token: \u003chttps://www.better-auth.com/docs/plugins/one-time-token\u003e\n- OpenAPI: \u003chttps://www.better-auth.com/docs/plugins/open-api\u003e\n- JWT: \u003chttps://www.better-auth.com/docs/plugins/jwt\u003e\n- Stripe: \u003chttps://www.better-auth.com/docs/plugins/stripe\u003e\n- Polar: \u003chttps://www.better-auth.com/docs/plugins/polar\u003e\n- Dub: \u003chttps://www.better-auth.com/docs/plugins/dub\u003e\n- コミュニティプラグイン一覧: \u003chttps://www.better-auth.com/docs/plugins/community-plugins\u003e\n\n\n\n---\n\n\n# Integration — 対応フレームワーク網羅\n\n\u003e Better Auth は「特定フレームワークに縛られない」。コアが公開するのは Web 標準の `auth.handler: (req: Request) =\u003e Promise\u003cResponse\u003e` ただ一つで、各フレームワーク統合はこのハンドラへ catch-all ルートを流し込む薄いアダプタにすぎない。だから **バックエンドが TypeScript なら大体いける**。\n\n### 🎤 登壇メモ\n\n- **つかみ**: 「Better Auth、対応フレームワークいくつあると思います？」と問いかけ → 答えは「数の問題じゃない。**ハンドラを 1 個挿すだけ**」だと種明かしする。\n- **強調**: フレームワーク統合は“対応表”ではなく**薄いアダプタ**。本体は `auth.handler`（Web 標準 `Request` → `Response`）という 1 関数。ここだけは口で言い切る。\n- **10分なら**: 一覧表 3 枚はスライドに出して「全部いけます」と流す（読み上げない）。手を止めるのはコード 3 例（Next.js / Hono / Expo）だけ。差し込み口の構文が違うだけで中身が同じ、を見せて終わり。\n\n## 思想 — 「route handler を差し込むだけ」\n\nBetter Auth の本体は、サインイン・OAuth コールバック・セッション検証など全エンドポイントを 1 本の関数に集約している。\n\n- コアの正体は `auth.handler(request: Request): Promise\u003cResponse\u003e` という **Web Fetch API 標準**の関数。\n- フレームワーク統合がやることは原則ひとつだけ — **`/api/auth/*` のような catch-all ルートを 1 個切って、そこに `auth.handler` を渡す**。\n- だから Next.js だろうが Hono だろうが Express だろうが、差し込み口の書式が違うだけで中身は同じ。`Request` を渡して `Response` を返せる土台なら、Deno / Bun / Cloudflare Workers でも動く。\n- 公式ヘルパ（`toNextJsHandler`, `toNodeHandler` など）は、各ランタイムの req/res 型と Web 標準型の橋渡しをするだけの糖衣。無くても `auth.handler` を直接呼べば成立する。\n\n\u003e つまり「Better Auth に対応しているか」ではなく「そのフレームワークが Web 標準の Request/Response を扱えるか」が本質。TS バックエンドのほとんどが YES。\n\n`auth.handler` / API ハンドラがそもそも何を担うか（エンドポイント設計・ルーティングの基礎）は [§01 概念](01-concepts.html) を参照。\n\n---\n\n## カテゴリ別 対応一覧\n\n### フロント / フルスタック\n\n| フレームワーク | 区分 | 差し込み口（catch-all ルート） | ハンドラ |\n|---|---|---|---|\n| Next.js | 公式 (`better-auth/next-js`) | `app/api/auth/[...all]/route.ts` | `toNextJsHandler(auth)` |\n| Nuxt | 公式 | `server/api/auth/[...all].ts` | `auth.handler(toWebRequest(event))` |\n| SvelteKit | 公式 (`better-auth/svelte-kit`) | `src/hooks.server.ts` | `svelteKitHandler({ event, resolve, auth })` |\n| SolidStart | 公式 (`better-auth/solid-start`) | `routes/api/auth/*all.ts` | `toSolidStartHandler(auth)` |\n| Astro | 公式 | `pages/api/auth/[...all].ts` | `APIRoute` 内で `auth.handler(ctx.request)` |\n| React Router v7 | 公式 | `app/routes/api.auth.$.ts`（resource route） | `loader` / `action` で `auth.handler(request)` |\n| TanStack Start | 公式 | `src/routes/api/auth/$.ts`（API route） | `auth.handler(request)` |\n| Remix | 公式 | `app/routes/api.auth.$.ts`（resource route） | `loader` / `action` で `auth.handler(request)` |\n\n### バックエンド\n\n| フレームワーク | 区分 | 差し込み口（catch-all ルート） | ハンドラ |\n|---|---|---|---|\n| Hono | 公式 | `app.on([\"POST\",\"GET\"], \"/api/auth/*\", ...)` | `auth.handler(c.req.raw)` |\n| Fastify | 公式 | `/api/auth/*` の catch-all ルート | Node req → Web `Request` 変換後に `auth.handler` |\n| Express | 公式 (`better-auth/node`) | `app.all(\"/api/auth/*splat\", ...)` | `toNodeHandler(auth)` |\n| Elysia | 公式 | `/api/auth/*` を mount | `auth.handler` |\n| Nitro | 公式 | `server/routes/api/auth/[...all].ts` | `auth.handler(toWebRequest(event))` |\n| NestJS | コミュニティ (`@thallesp/nestjs-better-auth`) | AuthModule + catch-all | 内部で `auth.handler` |\n| Encore | コミュニティ | raw endpoint の catch-all | `auth.handler(request)` |\n| Convex | 公式コンポーネント (`@convex-dev/better-auth`) | Convex component 経由 | コンポーネントが内部で仲介 |\n\n### モバイル / デスクトップ\n\n| フレームワーク | 区分 | サーバ側 | クライアント側 |\n|---|---|---|---|\n| Expo | 公式 (`@better-auth/expo`) | `expo()` プラグイン + `trustedOrigins` | `expoClient({ scheme, storage })` |\n| Lynx | 公式 | 既存サーバの `auth.handler` を流用 | `createAuthClient`（ByteDance Lynx 用） |\n| Electron | コミュニティ | 既存サーバの `auth.handler` を流用 | renderer から `createAuthClient` |\n\n\u003e モバイル/デスクトップはサーバを新規に立てるのではなく、**既存の `auth.handler`（Next.js なり Hono なり）をそのまま叩く**のが基本。プラットフォーム差分は「クッキーをどこに保存するか」「どの scheme でディープリンクを受けるか」に集約される。\n\n---\n\n## 代表コード例\n\n### 例 1: Next.js（フルスタック）\n\n公式ヘルパ `toNextJsHandler` が `POST` / `GET` を生成する。App Router の catch-all セグメント `[...all]` に置くだけ。\n\n```ts\n// app/api/auth/[...all]/route.ts\nimport { auth } from \"@/lib/auth\";\nimport { toNextJsHandler } from \"better-auth/next-js\";\n\nexport const { POST, GET } = toNextJsHandler(auth);\n```\n\nサーバコンポーネントや Server Action ではセッションを直接取得できる。\n\n```ts\nimport { auth } from \"@/lib/auth\";\nimport { headers } from \"next/headers\";\n\nconst session = await auth.api.getSession({\n  headers: await headers(),\n});\n```\n\n`getSession` が返すセッション・サインイン/サインアップなど認証フロー本体の仕様は [§02 認証](02-authentication.html) を参照。\n\n### 例 2: Hono（バックエンド）\n\ncatch-all ルートを 1 本切り、`c.req.raw`（Web 標準の `Request`）を `auth.handler` へ渡すだけ。\n\n```ts\n// server.ts\nimport { Hono } from \"hono\";\nimport { serve } from \"@hono/node-server\";\nimport { auth } from \"./auth\";\n\nconst app = new Hono();\n\napp.on([\"POST\", \"GET\"], \"/api/auth/*\", (c) =\u003e {\n  return auth.handler(c.req.raw);\n});\n\nserve(app);\n```\n\n\u003e 別オリジンのクライアントから叩く場合、`cors` ミドルウェアは認証ルートより**前**に登録すること（プリフライトを認証エンドポイントに到達する前に処理させるため）。\n\n### 例 3: Expo（モバイル）\n\nモバイルは「サーバへ `expo()` プラグインを足す」「クライアントへ `expoClient()` を足す」の 2 ステップ。サーバの差し込み口は前述のフルスタック/バックエンド統合と同じものを流用する。\n\nサーバ側 — プラグインと `trustedOrigins`（アプリの URL scheme）を追加:\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\nimport { expo } from \"@better-auth/expo\";\n\nexport const auth = betterAuth({\n  plugins: [expo()],\n  trustedOrigins: [\"myapp://\"],\n});\n```\n\nクライアント側 — `expoClient` でセッション cookie を `SecureStore` に保存し、ディープリンク用 scheme を指定:\n\n```ts\n// lib/auth-client.ts\nimport { createAuthClient } from \"better-auth/react\";\nimport { expoClient } from \"@better-auth/expo/client\";\nimport * as SecureStore from \"expo-secure-store\";\n\nexport const authClient = createAuthClient({\n  baseURL: \"http://localhost:8081\",\n  plugins: [\n    expoClient({\n      scheme: \"myapp\",\n      storagePrefix: \"myapp\",\n      storage: SecureStore,\n    }),\n  ],\n});\n```\n\n---\n\n## まとめ\n\n- 3 例を見比べると、差し込み口の構文だけが違い、**渡しているのは常に `Request` → `auth.handler` → `Response`** という同一構造。\n- フロント/フルスタックは「catch-all ルートに公式ヘルパ」、バックエンドは「ワイルドカードルートに `auth.handler`」、モバイル/デスクトップは「既存サーバ + クライアントプラグイン」。\n- 新しいフレームワークが出ても、Web 標準の Request/Response を扱える限り統合は数行で済む — これが「縛られない」の実体。\n\n### 関連章\n\n- フレームワークを挿した後にどの DB へ書くか（同テーマの土台）→ [§05 Database](05-database.html)\n- `auth.handler` / ルーティングの基礎概念 → [§01 概念](01-concepts.html)\n- セッション・サインインなど認証フロー本体 → [§02 認証](02-authentication.html)\n\n---\n\n## 一次情報\n\n- Better Auth — Integrations（一覧）: \u003chttps://www.better-auth.com/docs/integrations\u003e\n- [Next.js integration](https://www.better-auth.com/docs/integrations/next)\n- [Hono integration](https://www.better-auth.com/docs/integrations/hono)\n- [Expo integration](https://www.better-auth.com/docs/integrations/expo)\n\n\n\n---\n\n\n# Database — 対応DB網羅 + アダプタ\n\n\u003e Better Auth は内部で **Kysely**（型安全な SQL クエリビルダ）を使うため、リレーショナル DB なら基本的にそのまま動く。RDB は組み込みアダプタで直結、ORM を使うなら Drizzle / Prisma アダプタ、NoSQL なら MongoDB アダプタを噛ませる。この章では各 DB / プロバイダを「種別・際立つ特徴・運用形態・認証ストアとしての向き不向き・いつ選ぶか」の観点で掘り下げ、アダプタの選び分け、`modelName` の意味、CLI の使い分け、そして最後に**選び方早見表**を置く。\n\n### 🎤 登壇メモ\n\n- **つかみ**: 「DB はどれに対応してる？」と聞かれたら一言で返す ——「**内部で Kysely を使ってるから、リレーショナル DB ならだいたい動く**」。対応表の暗記は要らない、という掴み。\n- **強調**: ① アダプタは実質4系統だけ（組み込み Kysely / Drizzle / Prisma / MongoDB）。② `modelName` は **DB のテーブル名ではなくアダプタのモデル名** —— ここだけは毎回ハマる。③ プラグインを足すたびに `migrate` / `generate` を再実行。\n- **10分なら**: 「Kysely 前提」の一言 → `pg.Pool` 直結のコード1枚 → 選び方早見表（サーバーレス / エッジ / エンプラ）→ `modelName` の落とし穴、で締める。詳細な DB 一覧は飛ばして早見表に逃がす。\n- **関連章**: 認証連携・OAuth など同テーマは [§04 Integration](04-integrations.html)、Database 概念・コアスキーマ・`modelName` の前提は [§01 Concepts](01-concepts.html)。\n\n---\n\n## 基本方針: 内部は Kysely\n\nBetter Auth は DB に接続して `user` / `session` / `account` / `verification` などのコアデータを保存する。プラグインを足すと、そのプラグイン専用テーブルも増える。\n\n最大のポイントは **内部実装が Kysely 依存** だということ。公式ドキュメントも次のように明言している。\n\n\u003e PostgreSQL is supported under the hood via the Kysely adapter, any database supported by Kysely would also be supported.\n\nつまり **Kysely がサポートする DB は Better Auth でもサポートされる**。RDB を選ぶ限り「対応しているか」で悩むことはほぼなく、接続インスタンス（`pg.Pool` など）を `database` に渡すだけで組み込み Kysely アダプタが面倒を見る。Kysely を経由することで得られるのは次の3点。\n\n- **方言（dialect）の差を吸収**: PostgreSQL / MySQL / SQLite / MS SQL の SQL 差異を Better Auth 側が意識しなくて済む。\n- **スキーマ生成・マイグレーション**: 組み込みアダプタなら CLI から DDL を直接生成・適用できる（後述）。\n- **ORM 非依存**: ORM を入れたくないプロジェクトでも、ドライバのプール一個で完結する。\n\n\u003e DB なしでも動く: ステートレスセッション（JWT ベース）を使えば DB を持たない構成も可能。詳細は session-management のドキュメントを参照。\n\n---\n\n## 各DB / プロバイダ詳細\n\n観点は各項目で統一する: **種別 / 際立つ特徴 / 運用形態 / 認証ストア適性 / いつ選ぶか**。\n\n### 直接接続 / RDB（組み込み Kysely）\n\nドライバのインスタンスを `database` に直接渡せる王道カテゴリ。CLI の `migrate` がそのまま使えるのもこの層の特権。\n\n#### PostgreSQL\n\n- **種別**: RDB（組み込み）\n- **際立つ特徴**: 高機能で堅牢な定番 OSS RDB。JSONB・全文検索・豊富な拡張・厳密なトランザクション。\n- **運用形態**: 自前ホスト / 各種マネージド（後述の Supabase・Neon・RDS など実体はこれ）。\n- **認証ストア適性**: ◎。Better Auth の事実上の第一候補で、ドキュメント・実績が最も厚い。\n- **いつ選ぶか**: 迷ったらこれ。将来プラグインで機能拡張する前提なら堅実。\n\n#### MySQL\n\n- **種別**: RDB（組み込み）\n- **際立つ特徴**: 世界的に普及した OSS RDB。エコシステム・ホスティング選択肢が広い。\n- **運用形態**: 自前 / マネージド（PlanetScale は MySQL 互換）。`mysql2/promise` の `createPool()` を渡す。\n- **認証ストア適性**: ◎。PostgreSQL に次ぐ定番。\n- **いつ選ぶか**: 既存スタックが MySQL、または MySQL マネージド（PlanetScale 等）に乗せたいとき。\n\n#### SQLite\n\n- **種別**: RDB（組み込み・単一ファイル）\n- **際立つ特徴**: サーバープロセス不要の組込み DB。単一ファイルで完結、セットアップゼロ。\n- **運用形態**: アプリと同居（`better-sqlite3` が推奨ドライバ。`node:sqlite` / `bun:sqlite` 等も選べる）。\n- **認証ストア適性**: ○（小〜中規模）。高並行な書き込みには不向きだが、個人〜小規模なら十分。\n- **いつ選ぶか**: ローカル開発・プロトタイプ・小規模アプリ・エッジ（libSQL/D1 系の素地）。\n\n#### MS SQL\n\n- **種別**: RDB（組み込み・Kysely `MssqlDialect`）\n- **際立つ特徴**: Microsoft のエンタープライズ RDB。堅牢なセキュリティ・スケーラビリティ・周辺ツール。\n- **運用形態**: `tedious`（ドライバ）+ `tarn`（プール）で Kysely の `MssqlDialect` を構成して渡す。\n- **認証ストア適性**: ○。動作はするが設定はやや重め（接続・型マッピングの調整が要る）。\n- **いつ選ぶか**: 既存資産が Microsoft / Windows エンタープライズ環境のとき。\n\n#### その他 RDB\n\n- **種別**: RDB（Kysely の任意 dialect）\n- **際立つ特徴**: Kysely が対応する dialect なら何でも繋がる。CLI でのスキーマ生成・マイグレーションも効く。\n- **運用形態**: 対応する Kysely dialect を自前で組み込む。\n- **認証ストア適性**: dialect の成熟度次第。\n- **いつ選ぶか**: 上記4種以外の RDB を使う必要があるとき。other-relational-databases ドキュメントを参照。\n\n### マネージド / サーバーレス\n\n実体は上記 RDB のホスティング形態。接続文字列・ドライバが違うだけで、Better Auth から見れば「PostgreSQL / MySQL / SQLite」として扱える。差は**運用特性**（スケール・接続管理・ブランチング）に出る。\n\n#### Supabase\n\n- **種別**: サーバーレス / BaaS（PostgreSQL ベース）\n- **際立つ特徴**: Postgres を核に Auth・Storage・Realtime・Edge Functions を同梱した BaaS。\n- **運用形態**: **Better Auth では「ただの Postgres」として使う**。Supabase 自身の Auth(GoTrue) は使わず、接続文字列を `pg.Pool` に渡す。サーバーレス環境では Supavisor/PgBouncer 系のプーラ用エンドポイントを使う。\n- **認証ストア適性**: ◎（Postgres そのもの）。\n- **いつ選ぶか**: Postgres マネージド + ストレージ/リアルタイム等も一緒に欲しいが、認証ロジックは Better Auth で握りたいとき。\n\n#### Neon\n\n- **種別**: サーバーレス（PostgreSQL）\n- **際立つ特徴**: ストレージとコンピュートを分離したサーバーレス Postgres。**DB ブランチング**（git のようにコピーオンライトで分岐）と **scale-to-zero**（無アクセス時に停止して課金抑制）。\n- **運用形態**: 通常の Postgres 接続に加え、エッジ向けの serverless ドライバ（HTTP/WebSocket）も提供。\n- **認証ストア適性**: ◎。サーバーレス関数からの大量接続にも強い。\n- **いつ選ぶか**: プレビュー環境ごとに DB を分岐したい / Lambda・サーバーレスで接続枯渇を避けたい / アイドル課金を抑えたいとき。\n\n#### Turso (libSQL)\n\n- **種別**: エッジ / 分散（SQLite 派生 = libSQL）\n- **際立つ特徴**: SQLite を fork した libSQL の分散版。**エッジレプリカ**で低レイテンシ読み取り、**多数の DB**（テナントごとに DB を分ける運用）が得意。\n- **運用形態**: `@libsql/client` 経由。組込みレプリカでローカル読み取りも可能。\n- **認証ストア適性**: ○。読み取りはエッジで速いが、SQLite 由来の書き込み特性は理解しておく。\n- **いつ選ぶか**: エッジ配信・マルチテナント（DB-per-tenant）・SQLite の手軽さを分散で活かしたいとき。\n\n#### PlanetScale\n\n- **種別**: サーバーレス（MySQL 互換、**Vitess** ベース）\n- **際立つ特徴**: YouTube 由来の Vitess による**水平スケール**。**ブランチング + 非ブロッキングなオンラインスキーマ変更**（deploy request ワークフロー）。\n- **運用形態**: MySQL 互換接続。スキーマ変更はブランチを切ってデプロイリクエストで本番へ。歴史的に外部キー制約の扱いに癖があるため、利用前に FK ポリシーを確認。\n- **認証ストア適性**: ◎（大規模 MySQL）。\n- **いつ選ぶか**: 大規模・高トラフィックの MySQL を無停止スキーマ変更で運用したいとき。\n\n#### Cloudflare D1\n\n- **種別**: エッジ（SQLite 互換）\n- **際立つ特徴**: Cloudflare のネットワーク上で動くエッジ SQLite。**Workers とネイティブ統合**。\n- **運用形態**: Workers の D1 バインディング（Kysely の D1 dialect 等）で接続。Workers ランタイム前提。\n- **認証ストア適性**: ○（Workers アプリ向け）。グローバル書き込み一貫性は SQLite 系の制約を踏まえる。\n- **いつ選ぶか**: アプリ全体を Cloudflare Workers で完結させているとき。\n\n#### Prisma Postgres\n\n- **種別**: サーバーレス（PostgreSQL、Prisma マネージド）\n- **際立つ特徴**: Prisma が提供するマネージド Postgres。Prisma エコシステム（Accelerate 等）と一体運用。\n- **運用形態**: **Prisma アダプタ**経由で接続するのが前提。\n- **認証ストア適性**: ◎（Postgres + Prisma 運用に最適化）。\n- **いつ選ぶか**: 既に Prisma を使っていて、DB ホスティングも Prisma に寄せたいとき。\n\n#### AWS RDS Data API\n\n- **種別**: サーバーレス（Aurora/RDS への HTTP アクセス）\n- **際立つ特徴**: HTTP 経由で RDS/Aurora を叩く。**永続コネクション不要 = コネクションプール不要**。\n- **運用形態**: Lambda 等のサーバーレスから、接続数枯渇問題を避けて利用。\n- **認証ストア適性**: ○。1リクエストあたりのオーバーヘッドは増えるが、サーバーレスの接続問題が消える。\n- **いつ選ぶか**: Lambda + Aurora 構成で、接続プールの枯渇を根本から避けたいとき。\n\n### エッジ / 組込みランタイム\n\nランタイム同梱・組込みの SQLite 実装。実体は SQLite なので扱いは SQLite に準ずるが、**どのランタイムで動かすか**で実装（ドライバ）が変わる。\n\n#### Deno SQLite\n\n- **種別**: エッジ / 組込み（SQLite）\n- **際立つ特徴**: Deno ランタイム向けの SQLite 実装。\n- **いつ選ぶか**: Deno でサーバーを書いていて、軽量に組込み DB を持ちたいとき。\n\n#### SQLite WASM\n\n- **種別**: エッジ / 組込み（WASM 版 SQLite）\n- **際立つ特徴**: SQLite を WebAssembly にコンパイルしたもの。ネイティブバインディング不要でブラウザ/エッジ/Workers でも動く。\n- **いつ選ぶか**: ネイティブモジュールが使えない実行環境（ブラウザ・一部エッジ）で SQLite を使いたいとき。\n\n#### Bun SQLite\n\n- **種別**: エッジ / 組込み（`bun:sqlite`）\n- **際立つ特徴**: Bun ランタイム標準の高速ネイティブ SQLite。追加依存なしで使える。\n- **いつ選ぶか**: Bun でアプリを書いていて、最速の組込み SQLite が欲しいとき。\n\n### 分析系（用途限定）\n\nOLAP（分析）DB。**認証ストアのメインには非典型・用途限定**で、本番の主データストアにはしない。理由を明記しておく。\n\n#### BigQuery\n\n- **種別**: 分析（サーバーレス OLAP データウェアハウス）\n- **なぜ認証ストアに向かないか**: 列指向・追記前提でクエリ単位課金。セッションのような**単一行の点参照・頻繁な更新/削除**が苦手で、レイテンシ・コスト面でトランザクショナルな認証に不向き。\n- **いつ使うか**: 認証イベントの**分析・集計**用途に限る。主ストアは別 RDB。\n\n#### ClickHouse\n\n- **種別**: 分析（列指向 OLAP）\n- **なぜ認証ストアに向かないか**: 集計は爆速だが、**単一行の更新/削除が弱い**。セッションの作成・失効・更新が頻発する認証ワークロードとは相性が悪い。\n- **いつ使うか**: ログイン履歴などの**分析基盤**として。認証本体のストアにはしない。\n\n---\n\n## アダプタの選び分け\n\nBetter Auth の `database` に渡すものは大きく4系統。**内部はどれも Kysely か、各 ORM/ドライバ越しに DB へ到達する**。\n\n| アダプタ | 性質 | スキーマ管理 | 向いているケース |\n|---|---|---|---|\n| 組み込み Kysely | ドライバ直結・最軽量 | CLI `migrate` で直接適用 | ORM を入れたくない |\n| Drizzle | 型安全・軽量・SQL 寄り | `generate` 後は自前(drizzle-kit) | 既に Drizzle 採用 |\n| Prisma | スキーマ駆動・ツール充実 | `generate` で Prisma スキーマ生成 | 既に Prisma 採用 / 広範な DB |\n| MongoDB | NoSQL ドキュメント | スキーマレス（生成不要） | ドキュメント指向 / 既存 Mongo |\n\n### 組み込み Kysely（ドライバ直結）\n\nORM を使わず、ドライバのインスタンスをそのまま渡す最短ルート。\n\n```ts\nimport { betterAuth } from \"better-auth\";\nimport { Pool } from \"pg\";\n\nexport const auth = betterAuth({\n  database: new Pool({\n    connectionString: \"postgres://user:password@localhost:5432/database\",\n  }),\n});\n```\n\nMySQL は `mysql2/promise` のプールを渡す。\n\n```ts\nimport { betterAuth } from \"better-auth\";\nimport { createPool } from \"mysql2/promise\";\n\nexport const auth = betterAuth({\n  database: createPool({\n    uri: \"mysql://user:password@localhost:3306/database\",\n  }),\n});\n```\n\nMS SQL は Kysely の `MssqlDialect` を `tedious` + `tarn` で組んで渡す。\n\n```ts\nimport { betterAuth } from \"better-auth\";\nimport { MssqlDialect } from \"kysely\";\nimport * as Tedious from \"tedious\";\nimport * as Tarn from \"tarn\";\n\nconst dialect = new MssqlDialect({\n  tarn: { ...Tarn, options: { min: 0, max: 10 } },\n  tedious: {\n    ...Tedious,\n    connectionFactory: () =\u003e\n      new Tedious.Connection({\n        authentication: {\n          options: { password: \"password\", userName: \"username\" },\n          type: \"default\",\n        },\n        options: { database: \"some_db\", port: 1433, trustServerCertificate: true },\n        server: \"localhost\",\n      }),\n  },\n});\n\nexport const auth = betterAuth({ database: { dialect, type: \"mssql\" } });\n```\n\n### Drizzle（型安全・軽量・SQL 寄り）\n\n型安全で軽量、生成される SQL が読みやすい。マイグレーションは drizzle-kit など**自前運用寄り**。`drizzleAdapter(db, ...)` に Drizzle インスタンスと `provider` を渡す。\n\n```ts\nimport { betterAuth } from \"better-auth\";\nimport { drizzleAdapter } from \"better-auth/adapters/drizzle\";\nimport { db } from \"./database\";\n\nexport const auth = betterAuth({\n  database: drizzleAdapter(db, {\n    provider: \"sqlite\", // \"pg\" / \"mysql\" も指定可\n  }),\n});\n```\n\nDrizzle アダプタは **スキーマのキー名がテーブル名と一致している前提**で動く。`user` テーブルを `users` という名で定義しているなら、明示的にマッピングする。\n\n```ts\nexport const auth = betterAuth({\n  database: drizzleAdapter(db, {\n    provider: \"sqlite\",\n    schema: {\n      ...schema,\n      user: schema.users,\n    },\n  }),\n});\n```\n\n複数形で統一しているなら `usePlural: true` でまとめて寄せられる。\n\n```ts\nexport const auth = betterAuth({\n  database: drizzleAdapter(db, {\n    provider: \"sqlite\",\n    usePlural: true,\n  }),\n});\n```\n\n### Prisma（スキーマ駆動・広範な DB・ツール充実）\n\nスキーマファースト。対応 DB が広く、Prisma Studio などツールが充実。クライアントは Drizzle より重め。`prismaAdapter(prisma, ...)` に `PrismaClient` と `provider` を渡す。\n\n```ts\nimport { betterAuth } from \"better-auth\";\nimport { prismaAdapter } from \"better-auth/adapters/prisma\";\nimport { PrismaClient } from \"@prisma/client\";\n\nconst prisma = new PrismaClient();\n\nexport const auth = betterAuth({\n  database: prismaAdapter(prisma, {\n    provider: \"sqlite\", // \"postgresql\" / \"mysql\" など\n  }),\n});\n```\n\n\u003e Prisma 7 以降は `schema.prisma` の `output` パスが必須。カスタム出力先（例: `output = \"../src/generated/prisma\"`）を設定しているなら、`@prisma/client` ではなくそのパスから client を import すること。\n\n### MongoDB（NoSQL ドキュメント）\n\n唯一の非リレーショナル公式アダプタ。RDB 前提の機能（join 等）とは挙動が異なる点に注意。`MongoClient` から取り出した `db` を `mongodbAdapter(db)` に渡す。\n\n```ts\nimport { betterAuth } from \"better-auth\";\nimport { MongoClient } from \"mongodb\";\nimport { mongodbAdapter } from \"better-auth/adapters/mongodb\";\n\nconst client = new MongoClient(\"mongodb://localhost:27017/database\");\nconst db = client.db();\n\nexport const auth = betterAuth({\n  database: mongodbAdapter(db),\n});\n```\n\n\u003e MongoDB はスキーマレスなので、後述の `migrate` / `generate` は不要（コレクションは自動で扱われる）。join はバージョン `1.4.0` 以降 `experimental.joins: true` でサポート。RDB を前提にしたプラグインの一部機能は挙動が異なりうるため、組み合わせは個別に確認する。\n\n### コミュニティアダプタ\n\n\u003e Better Auth connects to a database through adapters. Beyond the official adapters we maintain, the community has built many more to support additional databases.\n\n公式（Kysely 系・Drizzle・Prisma・MongoDB）以外にも、コミュニティ製アダプタで対応 DB を広げられる（分析系などコア外の DB を繋ぐケース）。標準アダプタで要件を満たせない場合の選択肢として community-adapters ドキュメントを参照する。\n\n---\n\n## 重要: modelName はテーブル名ではない\n\nハマりやすいので明示する。**`modelName` は「アダプタが認識するモデル名」であって、物理 DB のテーブル名ではない。**\n\n- 組み込み Kysely や Drizzle / Prisma などのアダプタは、それぞれの世界の「モデル名」で `user` などを参照する。\n- 物理テーブル名へのマッピングは ORM 側の責務（Prisma の `@@map`、Drizzle のテーブル定義名など）。\n\n例えば Prisma で `model User { ... }` と定義していても、Better Auth から見たモデル名は **`modelName: \"user\"`**（小文字・単数のデフォルト）になる。「Prisma のモデルは `User` なのに、なぜ設定は `user` なのか」という混乱はここから生まれる。\n\nコアスキーマのモデル名・カラム名を変えたい場合は `modelName` と `fields` で上書きする。\n\n```ts\nexport const auth = betterAuth({\n  user: {\n    modelName: \"users\",\n    fields: {\n      name: \"full_name\",\n      email: \"email_address\",\n    },\n  },\n  session: {\n    modelName: \"user_sessions\",\n    fields: {\n      userId: \"user_id\",\n    },\n  },\n});\n```\n\n\u003e ここで指定する `modelName` も「アダプタに対する論理名」。実テーブル名は最終的に ORM の設定が決める。\n\nコアスキーマ（`user` / `session` / `account` / `verification`）の構造と `modelName` の前提は [§01 Concepts](01-concepts.html) で詳説している。\n\n---\n\n## CLI: migrate と generate\n\nBetter Auth には DB スキーマを扱う CLI が付属する。**どちらを使うかはアダプタで決まる。**\n\n| コマンド | 対象 | 動作 |\n|---|---|---|\n| `npx auth migrate` | 組み込み Kysely アダプタのみ | スキーマを DB に直接適用 |\n| `npx auth generate` | Prisma / Drizzle など ORM | ORM 用スキーマ / SQL ファイルを生成 |\n\n- **`migrate`** は組み込み Kysely アダプタを使っているときだけ動く。DB に直接 DDL を流し込む。\n- **`generate`** は Prisma / Drizzle を使っているとき。ORM のスキーマ（`schema.prisma` など）を生成するので、その後は **ORM 標準のマイグレーションツール**で適用する。組み込み Kysely の場合は手動実行用の SQL ファイルを出す。\n\n```bash\n# 組み込み Kysely アダプタ: そのまま DB へ適用\nnpx auth migrate\n\n# Prisma / Drizzle: スキーマを生成 → 各 ORM のマイグレーションで適用\nnpx auth generate\n```\n\n\u003e **プラグインを足すたびに再実行する。** プラグインは独自テーブル / カラムを定義するため、追加・有効化のたびに `migrate` または `generate` をかけ直さないとスキーマが追いつかない。\n\n---\n\n## 選び方早見表\n\n要件（軸）から逆引きで候補を引く指針。第一候補に迷ったら一番下の行を見る。\n\n| 要件 / 軸 | おすすめ | 理由 |\n|---|---|---|\n| サーバーレスで接続枯渇を避けたい | Neon / AWS RDS Data API | scale-to-zero・サーバーレスドライバ / HTTP 接続でプール不要 |\n| エッジ（Workers 等）で動かす | Cloudflare D1 / Turso | ランタイム統合・エッジレプリカで低レイテンシ |\n| git ライクな DB ブランチ（プレビュー環境） | Neon / PlanetScale | コピーオンライトの分岐 / ブランチ + deploy request |\n| 大規模・水平スケールの MySQL | PlanetScale | Vitess による水平スケールと無停止スキーマ変更 |\n| エンタープライズ / Windows 資産 | MS SQL | Microsoft エコシステムとの統合 |\n| ローカル / 小規模 / 組込み | SQLite（better-sqlite3 / Bun SQLite） | サーバー不要・単一ファイルで完結 |\n| 既に ORM を使っている | その ORM のアダプタ（Drizzle / Prisma） | 既存スキーマ・マイグレ運用に合わせる |\n| ORM を入れたくない / 最軽量 | 組み込み Kysely（pg.Pool 等） | ドライバ一個で完結 |\n| ドキュメント指向 / 既存 Mongo | MongoDB | 唯一の公式 NoSQL アダプタ |\n| 認証イベントの分析・集計 | BigQuery / ClickHouse（主ストアとは別に） | OLAP は分析特化。認証本体は RDB に置く |\n| とりあえず堅実な第一候補 | PostgreSQL | 実績・ドキュメント・拡張性が最も厚い |\n\n---\n\n## 一次情報\n\n### Better Auth 公式\n\n- Database（コンセプト全体・コアスキーマ・CLI・セカンダリストレージ）: \u003chttps://www.better-auth.com/docs/concepts/database\u003e\n- PostgreSQL アダプタ: \u003chttps://www.better-auth.com/docs/adapters/postgresql\u003e\n- MySQL アダプタ: \u003chttps://www.better-auth.com/docs/adapters/mysql\u003e\n- SQLite アダプタ: \u003chttps://www.better-auth.com/docs/adapters/sqlite\u003e\n- MS SQL アダプタ: \u003chttps://www.better-auth.com/docs/adapters/mssql\u003e\n- その他のリレーショナル DB: \u003chttps://www.better-auth.com/docs/adapters/other-relational-databases\u003e\n- Drizzle ORM アダプタ: \u003chttps://www.better-auth.com/docs/adapters/drizzle\u003e\n- Prisma アダプタ: \u003chttps://www.better-auth.com/docs/adapters/prisma\u003e\n- MongoDB アダプタ: \u003chttps://www.better-auth.com/docs/adapters/mongo\u003e\n- コミュニティアダプタ: \u003chttps://www.better-auth.com/docs/adapters/community-adapters\u003e\n- CLI（migrate / generate）: \u003chttps://www.better-auth.com/docs/concepts/cli\u003e\n\n### 各プロバイダ公式\n\n- Kysely: \u003chttps://kysely.dev/\u003e\n- Supabase: \u003chttps://supabase.com/docs\u003e\n- Neon（ブランチング）: \u003chttps://neon.tech/docs/introduction/branching\u003e\n- Turso / libSQL: \u003chttps://docs.turso.tech/\u003e\n- PlanetScale（非ブロッキングスキーマ変更）: \u003chttps://planetscale.com/docs\u003e\n- Cloudflare D1: \u003chttps://developers.cloudflare.com/d1/\u003e\n- Prisma Postgres: \u003chttps://www.prisma.io/postgres\u003e\n- AWS RDS Data API: \u003chttps://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/data-api.html\u003e\n\n\n\n---\n\n\n# Infrastructure — 公式の有料運用レイヤー\n\n\u003e Better Auth 本体は OSS・無料のライブラリだ。だが本番運用では「管理 GUI・不正対策・メール配信・SSO/SCIM」といった、ライブラリだけでは埋まらない領域が必ず出てくる。それを公式のマネージドサービスが肩代わりするのが **Better Auth Infrastructure**。導入はプラグイン 1 行、コアは自前に持ったまま「運用知能」だけを買い足せる。\n\n### 🎤 登壇メモ\n\n- **つかみ**: 「認証ライブラリはタダ。じゃあ Better Auth は何で食ってるの?」——答えは**運用を売る**。コードは無料で配り、本番で誰もが詰まる管理・防御・配信を有料で肩代わりする。これが Infrastructure。\n- **強調**: ①導入は `plugins: [dash()]` の**1 行**。②課金対象は認証そのものではなく、ダッシュボード・不正検知・メール配信といった**運用知能**。③だから **Auth0/Clerk とは思想が逆**——「全部ホスト」ではなく「**コアは自前、運用知能だけ買う**」。\n- **10 分なら**: 「位置づけ（4 つの柱）」→「プラグイン 1 行のデモ」→「ビジネスモデル（Supabase 型）」の 3 点だけに絞る。各プラグインの設定オプション表は配布資料に逃がし、口頭では `dash()` / `sentinel()` が**何を肩代わりするか**だけ語る。\n\n---\n\n## 位置づけ — ライブラリが埋めない「運用」を肩代わりする\n\nBetter Auth のコア（`better-auth` 本体とプラグイン群）は OSS で無料、自前ホストが前提だ。サインイン・セッション・OAuth・組織管理といった**認証の機能**はこれで完結する。\n\nしかし実運用に乗せると、認証ロジックとは別レイヤーの仕事が立ち上がってくる。\n\n- ユーザー・組織・セッションを**眺めて操作する管理画面**が欲しい\n- クレデンシャルスタッフィングやボット、使い捨てメールを**検知・遮断**したい\n- 検証メール・パスワードリセット・招待メールを**確実に配信**したい\n- エンタープライズ向けに **SSO/SAML・ディレクトリ同期（SCIM）・ログドレイン**を提供したい\n\nこれらは「認証ライブラリ」の責務というより「**認証基盤の運用**」の責務だ。Better Auth Infrastructure は、この運用レイヤーを公式のマネージドサービスとして提供する有料プロダクトで、自分でダッシュボードや不正検知パイプラインやメール基盤を構築・運用せずに済ませられる。\n\nなお `dash()` / `sentinel()` も実体は **Better Auth のプラグイン**であり、[§03 プラグイン](03-plugins.html)で扱うプラグイン機構の上に載る。違いは「接続先が自分の DB ではなく公式のマネージドサービス（有料）である」点だけだ。\n\n\u003e Infrastructure は **4 つの柱**で構成される。Dashboard（管理 GUI と分析）・Security（不正対策＝`sentinel`）・Email & SMS（マネージド配信）・Enterprise（SSO/SAML・SCIM・ログドレイン・ロールベースのダッシュボードアクセス）。\n\n---\n\n## 導入はプラグイン 1 行\n\n### 前提\n\n1. 動作している [Better Auth](https://www.better-auth.com/docs/installation) のインストール\n2. [Better Auth Infrastructure ダッシュボード](https://www.better-auth.com/dashboard)でのアカウント作成と **API キー**の発行\n\n### インストール\n\n`@better-auth/infra` パッケージを追加する。\n\n```bash\nnpm install @better-auth/infra\n```\n\n### 環境変数\n\n発行した API キーを本番環境変数に設定する。`BETTER_AUTH_API_KEY` のみが必須で、`BETTER_AUTH_API_URL` と `BETTER_AUTH_KV_URL` は任意（自前エンドポイントを指す場合のみ）。\n\n```dotenv\n# 必須: Better Auth Infrastructure の API キー\nBETTER_AUTH_API_KEY=your_api_key_here\n# 任意\nBETTER_AUTH_API_URL=https://api.betterauth.com\nBETTER_AUTH_KV_URL=https://kv.better-auth.com\n```\n\n### サーバー設定（プラグインを足すだけ）\n\n基本は `dash()` をプラグイン配列に 1 行足すだけだ。\n\n```ts\nimport { betterAuth } from \"better-auth\";\nimport { dash } from \"@better-auth/infra\";\n\nexport const auth = betterAuth({\n  // ... 既存の Better Auth 設定\n  plugins: [\n    dash({\n      apiKey: process.env.BETTER_AUTH_API_KEY,\n    }),\n  ],\n});\n```\n\n**Pro プラン以上**なら、セキュリティ層 `sentinel()` も並べて有効化できる。\n\n```ts\nimport { betterAuth } from \"better-auth\";\nimport { dash, sentinel } from \"@better-auth/infra\";\n\nexport const auth = betterAuth({\n  plugins: [\n    dash({ /* ... */ }),\n    sentinel({\n      apiKey: process.env.BETTER_AUTH_API_KEY,\n    }),\n  ],\n});\n```\n\n### クライアント設定\n\nクライアント側にも対応プラグインを足す。`sentinelClient` はデバイスフィンガープリントと PoW チャレンジの自動解決を担う。\n\n```ts\nimport { createAuthClient } from \"better-auth/client\";\nimport { dashClient, sentinelClient } from \"@better-auth/infra/client\";\n\nexport const authClient = createAuthClient({\n  plugins: [\n    dashClient(),\n    sentinelClient({\n      autoSolveChallenge: true, // PoW チャレンジを自動で解く\n    }),\n  ],\n});\n```\n\n\u003e **Expo / React Native** の場合は `@better-auth/infra/client` ではなく `@better-auth/infra/native` から `dashClient` と `sentinelNativeClient` を import する。\n\n`dash()` と `sentinel()` は独立して使えるが、両方を入れて初めて Infrastructure の全機能が揃う。\n\n---\n\n## アーキテクチャとデータの流れ\n\nInfrastructure は「自分のアプリ（自前ホスト）」と「Better Auth Infra（マネージド）」の二者構成だ。**自分の DB とユーザーデータはあくまで自前**に残り、Infra 側が担うのは分析・検知・配信といった運用知能に限られる。\n\n- **イベント送信（dash）**: サインアップ等が起きると、`dash()` が Better Auth 内部のフックに乗ってイベントを捕捉し、`apiUrl`（Infra API）へ送る。`kvUrl`（KV ストア）はキャッシュに使う。API/KV にはそれぞれタイムアウト（既定 3000ms / 1000ms）が設定され、Infra 側が遅延・障害でも認証フロー本体を止めない設計になっている。\n- **リクエスト検査（sentinel）**: ログイン等のリクエスト時に、`sentinel()` が KV でレート制限カウンタやフィンガープリントを照合し、Infra API でクレデンシャルスタッフィング判定や HaveIBeenPwned 照合を行う。結果に応じて `log` / `challenge` / `block` のいずれかを適用する。\n- **クライアント連携**: クライアントプラグインがフィンガープリント（`X-Visitor-Id` ヘッダ）を付与し、サーバーが PoW チャレンジを返したら自動で解いて `X-PoW-Solution` ヘッダで再送する。\n- **管理 GUI**: Infra 側の Web ダッシュボードは、`dash()` が登録する `/dash/*` 管理エンドポイント群を叩いてユーザー・組織・セッションを操作する。\n- **監査ログ**: 捕捉されたイベントは Infra 側に蓄積され、`/events/*` や `authClient.dash.getAuditLogs()` から照会できる。\n\n\u003e 流れを一言でいえば「自分のアプリで認証を回し、その傍らで Infra に**観測・判定・配信**を委譲する」構図だ。コアの主権は手放さない。\n\n---\n\n## コンポーネント詳細\n\n### Dashboard プラグイン `dash()`\n\nBetter Auth インスタンスを Infrastructure に接続する中核プラグイン。**分析トラッキング・イベントログ・管理ダッシュボード API**を有効化する。\n\n```ts\nimport { betterAuth } from \"better-auth\";\nimport { dash } from \"@better-auth/infra\";\n\nexport const auth = betterAuth({\n  plugins: [\n    dash({\n      apiUrl: process.env.BETTER_AUTH_API_URL,\n      kvUrl: process.env.BETTER_AUTH_KV_URL,\n      apiKey: process.env.BETTER_AUTH_API_KEY,\n    }),\n  ],\n});\n```\n\n#### 設定オプション（DashOptions）\n\n| Option | Type | Description |\n|---|---|---|\n| `apiUrl` | `string` | Infrastructure API の URL |\n| `kvUrl` | `string` | キャッシュ用 KV ストアの URL |\n| `apiKey` | `string` | 認証用の API キー |\n| `apiTimeout` | `number` | Infra API への HTTP タイムアウト（ms）。既定 `3000` |\n| `kvTimeout` | `number` | KV への HTTP タイムアウト（ms）。既定 `1000` |\n| `activityTracking` | `object` | アクティビティトラッキング設定 |\n\n#### アクティビティトラッキング\n\n有効化するとユーザースキーマに `lastActiveAt` 列が追加され、ユーザー操作のたびに自動更新される。更新間隔は DB 書き込み量に直結するため、高トラフィックなアプリでは間隔を長めに取る。\n\n```ts\ndash({\n  apiKey: process.env.BETTER_AUTH_API_KEY,\n  activityTracking: {\n    enabled: true,\n    updateInterval: 300000, // 更新間隔 ms（既定: 5 分）\n  },\n}),\n```\n\n有効化後は DB マイグレーションの実行を忘れずに（追加されるスキーマ拡張は下記）。\n\n```ts\nuser: {\n  fields: {\n    lastActiveAt: {\n      type: \"date\",\n    },\n  },\n}\n```\n\n#### 自動イベントトラッキング\n\n`dash()` を入れるだけで、認証イベントが追加設定なしに記録される。捕捉されるイベントの全カタログは後述の [Audit Logs](#audit-logs--認証イベントの追跡と照会) を参照。ユーザー・セッション・アカウント・検証・組織（organization プラグイン使用時）の各カテゴリが自動で収集される。\n\n#### 管理ダッシュボード API エンドポイント\n\n`dash()` はダッシュボード用に多数の管理エンドポイントを登録する。ここに Infrastructure のエンタープライズ機能（SSO・SCIM ディレクトリ同期・ログドレイン）も API として現れる。\n\n**ユーザー管理**\n\n| Endpoint | Method | Description |\n|---|---|---|\n| `/dash/users` | GET | ユーザー一覧（ページング） |\n| `/dash/users/online-count` | GET | オンラインユーザー数 |\n| `/dash/user` | GET / POST / PATCH / DELETE | ユーザーの取得・作成・更新・削除 |\n| `/dash/user/ban` | POST | ユーザーを BAN |\n| `/dash/user/unban` | POST | BAN 解除 |\n| `/dash/user/password` | POST | パスワード設定 |\n| `/dash/user/impersonate` | POST | なりすまし（代理ログイン） |\n\n**セッション管理**\n\n| Endpoint | Method | Description |\n|---|---|---|\n| `/dash/sessions` | GET / DELETE | セッション一覧・削除 |\n| `/dash/session/revoke` | POST | 単一セッションを失効 |\n| `/dash/sessions/revoke-all` | POST | ユーザーの全セッションを失効 |\n\n**組織・チーム・招待管理**\n\n| Endpoint | Method | Description |\n|---|---|---|\n| `/dash/organizations` | GET | 組織一覧 |\n| `/dash/organization` | GET / POST / PATCH / DELETE | 組織の取得・作成・更新・削除 |\n| `/dash/organization/members` | GET | メンバー一覧 |\n| `/dash/organization/member` | POST / DELETE | メンバー追加・削除 |\n| `/dash/organization/member/role` | PATCH | メンバーのロール更新 |\n| `/dash/organization/teams` | GET | チーム一覧 |\n| `/dash/organization/team` | POST / PATCH / DELETE | チームの作成・更新・削除 |\n| `/dash/organization/team/member` | POST / DELETE | チームメンバー追加・削除 |\n| `/dash/organization/invitations` | GET | 招待一覧 |\n| `/dash/organization/invite` | POST | 招待送信 |\n| `/dash/organization/invite/cancel` | POST | 招待取り消し |\n| `/dash/organization/invite/resend` | POST | 招待再送 |\n\n**エンタープライズ（SSO・ディレクトリ同期・ログドレイン）**\n\n| Endpoint | Method | Description |\n|---|---|---|\n| `/dash/organization/sso-providers` | GET | SSO プロバイダ一覧 |\n| `/dash/organization/sso-provider` | POST / PATCH / DELETE | SSO プロバイダの作成・更新・削除 |\n| `/dash/organization/sso-provider/verify-domain` | POST | ドメイン検証 |\n| `/dash/organization/directories` | GET | ディレクトリ一覧（SCIM） |\n| `/dash/organization/directory` | POST / DELETE | ディレクトリの作成・削除 |\n| `/dash/organization/directory/token` | POST | トークン再生成 |\n| `/dash/organization/log-drains` | GET | ログドレイン一覧 |\n| `/dash/organization/log-drain` | POST / PATCH / DELETE | ログドレインの作成・更新・削除 |\n| `/dash/organization/log-drain/test` | POST | ログドレインのテスト |\n\n**イベント・分析・2FA**\n\n| Endpoint | Method | Description |\n|---|---|---|\n| `/events/list` | GET | ユーザーイベント取得 |\n| `/events/audit-logs` | GET | 監査ログ取得 |\n| `/events/types` | GET | イベント種別取得 |\n| `/dash/stats` | GET | ユーザー統計 |\n| `/dash/graph` | GET | グラフデータ |\n| `/dash/retention` | GET | リテンションデータ |\n| `/dash/map` | GET | 地理データ |\n| `/dash/user/2fa/enable` | POST | 2FA 有効化 |\n| `/dash/user/2fa/disable` | POST | 2FA 無効化 |\n| `/dash/user/2fa/totp-uri` | GET | TOTP URI 取得 |\n| `/dash/user/2fa/backup-codes` | GET | バックアップコード閲覧 |\n| `/dash/user/2fa/backup-codes/generate` | POST | バックアップコード再生成 |\n\n#### クライアント統合（dashClient）\n\nクライアントプラグインからは監査ログ照会 API が使える。ユーザー ID の解決ロジックは `resolveUserId` でカスタマイズできる。\n\n```ts\ndashClient({\n  resolveUserId: ({ userId, user, session }) =\u003e {\n    return userId || user?.id || session?.user?.id;\n  },\n}),\n```\n\n#### ベストプラクティス\n\n1. **API キーは必ず設定する** — ないと Infra API と通信できない。\n2. **アクティビティトラッキングの間隔は慎重に** — 更新間隔が DB 書き込み量を左右する。\n3. **監査ログの保持期間はプラン依存** — 自分のプラン上限を確認する。\n4. **エンドポイントを保護する** — ダッシュボードエンドポイントは認証必須。操作者に適切な権限を割り当てる。\n\n---\n\n### Security プラグイン `sentinel()`\n\n認証システムへの**包括的な不正対策**を提供するプラグイン（**Pro プラン以上**）。クレデンシャルスタッフィング・不可能移動（impossible travel）・無料トライアル悪用などの攻撃ベクトルを検知・防御する。\n\n```ts\nimport { betterAuth } from \"better-auth\";\nimport { sentinel } from \"@better-auth/infra\";\n\nexport const auth = betterAuth({\n  plugins: [\n    sentinel({\n      security: {\n        // ここに各種セキュリティ機能を設定\n      },\n    }),\n  ],\n});\n```\n\n#### 設定オプション（SentinelOptions）\n\n| Option | Type | Description |\n|---|---|---|\n| `apiUrl` | `string` | Infrastructure API の URL |\n| `kvUrl` | `string` | レート制限データ用 KV ストアの URL |\n| `apiKey` | `string` | 認証用 API キー |\n| `apiTimeout` | `number` | Infra API への HTTP タイムアウト（ms）。既定 `3000` |\n| `kvTimeout` | `number` | KV への HTTP タイムアウト（ms）。既定 `1000` |\n| `security` | `SecurityOptions` | セキュリティ機能の設定 |\n\n`security` の構造（各機能は個別に有効化できる）。アクションは `\"log\"`（記録のみ）・`\"challenge\"`（PoW チャレンジ）・`\"block\"`（遮断）の 3 段階。\n\n```ts\ninterface SecurityOptions {\n  unknownDeviceNotification?: boolean;\n  credentialStuffing?: CredentialStuffingConfig;\n  impossibleTravel?: ImpossibleTravelConfig;\n  geoBlocking?: GeoBlockingConfig;\n  botBlocking?: boolean | { action: SecurityAction };\n  suspiciousIpBlocking?: boolean | { action: SecurityAction };\n  velocity?: VelocityConfig;\n  freeTrialAbuse?: FreeTrialAbuseConfig;\n  compromisedPassword?: CompromisedPasswordConfig;\n  emailValidation?: EmailValidationConfig;\n  emailNormalization?: { enabled?: boolean };\n  staleUsers?: StaleUsersConfig;\n  challengeDifficulty?: number;\n}\n\ntype SecurityAction = \"log\" | \"challenge\" | \"block\";\n```\n\n#### クレデンシャルスタッフィング対策\n\nビジターごとにログイン失敗回数を追跡し、しきい値超過でチャレンジ→遮断する。\n\n```ts\nsentinel({\n  apiKey: process.env.BETTER_AUTH_API_KEY,\n  security: {\n    credentialStuffing: {\n      enabled: true,\n      thresholds: {\n        challenge: 3, // 3 回失敗で PoW チャレンジ\n        block: 5,     // 5 回失敗で遮断\n      },\n      windowSeconds: 3600,  // 1 時間ウィンドウ\n      cooldownSeconds: 900, // 遮断後 15 分のクールダウン\n    },\n  },\n}),\n```\n\n動作: ビジター ID ごとに失敗回数を追跡 → チャレンジしきい値で PoW を発行 → 遮断しきい値でビジターを遮断 → ログイン成功で失敗カウントを自動クリア。\n\n#### 不可能移動（impossible travel）検知\n\n地理的に離れた地点からの、物理的にあり得ない短時間でのログインを検知する。\n\n```ts\nsentinel({\n  apiKey: process.env.BETTER_AUTH_API_KEY,\n  security: {\n    impossibleTravel: {\n      enabled: true,\n      maxSpeedKmh: 1000,   // 現実的な最大移動速度\n      action: \"challenge\",\n    },\n  },\n}),\n```\n\n例: ニューヨークでログインした 30 分後に東京からログインすると、1000 km/h を超える移動が必要なため不可能移動としてフラグが立つ。\n\n#### 無料トライアル悪用防止\n\nデバイスフィンガープリントを使い、複数アカウント作成によるトライアル乱用を防ぐ。\n\n```ts\nsentinel({\n  apiKey: process.env.BETTER_AUTH_API_KEY,\n  security: {\n    freeTrialAbuse: {\n      enabled: true,\n      thresholds: { challenge: 2, block: 3 },\n      maxAccountsPerVisitor: 3,\n      action: \"block\",\n    },\n  },\n}),\n```\n\n#### 漏洩パスワード検知\n\nHaveIBeenPwned データベースと照合して漏洩済みパスワードを検知する。**k-匿名性**を用い、パスワードハッシュの先頭 5 文字のみを送信する（フルパスワードは送らない）。\n\n```ts\nsentinel({\n  apiKey: process.env.BETTER_AUTH_API_KEY,\n  security: {\n    compromisedPassword: {\n      enabled: true,\n      action: \"block\",\n      minBreachCount: 1, // 検知に必要な最小漏洩回数\n    },\n  },\n}),\n```\n\n#### 休眠アカウント監視\n\n長期休眠していたアカウントが突然アクティブ化したのを検知する（アカウント乗っ取りの兆候）。ユーザー・管理者へのメール通知を出せる（通知には時刻・場所・休眠日数・デバイス情報を含む）。\n\n```ts\nsentinel({\n  apiKey: process.env.BETTER_AUTH_API_KEY,\n  security: {\n    staleUsers: {\n      enabled: true,\n      staleDays: 90,\n      action: \"log\",\n      notifyUser: true,\n      notifyAdmin: true,\n      adminEmail: \"admin@yourapp.com\",\n    },\n  },\n}),\n```\n\n#### その他の検知機能\n\n- **ジオブロッキング** — `allowList`（許可国）または `denyList`（遮断国）で国単位の許可/遮断。ISO 3166-1 alpha-2 の国コードを使う。\n- **ボットブロッキング** — `botBlocking: true`、または `{ action: \"challenge\" }` 等で自動化トラフィックを検知・遮断。\n- **不審 IP 検知** — `suspiciousIpBlocking` で既知の悪性 IP からのリクエストを遮断。\n- **ベロシティ / レート制限** — `velocity` で各種操作の速度を制限（`maxSignupsPerVisitor` / `maxPasswordResetsPerIp` / `maxSignInsPerIp` / `windowSeconds` など）。\n- **メール検証** — `emailValidation` で使い捨てメールを遮断。`strictness` は `low`（既知の使い捨てドメインのみ）/ `medium`（MX レコード確認も）/ `high`（追加のヒューリスティック）。\n- **メール正規化** — `emailNormalization` で小文字化・プラスタグ除去（`user+tag@gmail.com` → `user@gmail.com`）・Gmail のドット除去・`googlemail.com` → `gmail.com` を行い、エイリアスによる重複アカウントを防ぐ。`emailValidation` と独立して制御できる。\n\n```ts\nsentinel({\n  apiKey: process.env.BETTER_AUTH_API_KEY,\n  security: {\n    velocity: {\n      enabled: true,\n      thresholds: { challenge: 10, block: 20 },\n      maxSignupsPerVisitor: 5,\n      maxPasswordResetsPerIp: 10,\n      maxSignInsPerIp: 50,\n      windowSeconds: 3600,\n      action: \"challenge\",\n    },\n    emailValidation: {\n      enabled: true,\n      strictness: \"medium\",\n      action: \"block\",\n    },\n  },\n}),\n```\n\n#### Proof-of-Work（PoW）チャレンジ\n\nアクションが `\"challenge\"` のとき、Sentinel はクライアントが解くべき PoW チャレンジを発行する。サーバーが暗号学的チャレンジを出し、クライアントが難易度条件を満たす解を探す。**計算は重いが検証は速い**ため、自動攻撃を抑えつつ正規ユーザーは通過できる。難易度は `challengeDifficulty`（既定 `18`）で調整し、高いほど攻撃者の計算コストが上がる。\n\n```ts\nsentinel({\n  apiKey: process.env.BETTER_AUTH_API_KEY,\n  security: {\n    challengeDifficulty: 18,\n  },\n}),\n```\n\n#### クライアント統合（sentinelClient）\n\nクライアントプラグインがデバイスフィンガープリントと PoW 自動解決を担う。`X-Visitor-Id` ヘッダでビジター ID を付与し（クレデンシャルスタッフィング検知・無料トライアル悪用防止・デバイス追跡に使用）、解いたチャレンジは `X-PoW-Solution` ヘッダで送る。\n\n| Option | Type | Default | Description |\n|---|---|---|---|\n| `autoSolveChallenge` | `boolean` | `true` | PoW チャレンジを自動で解く |\n| `kvTimeout` | `number` | `1000` | KV identify 等の HTTP タイムアウト（ms） |\n\nExpo / React Native では `@better-auth/infra/native` の `sentinelNativeClient` を使う。`onChallengeReceived` / `onChallengeSolved` / `onChallengeFailed` のコールバックや、永続的なビジター ID 用の `storage`（Async Storage 等）を指定できる。\n\n#### セキュリティイベント\n\nSentinel が検知すると、監査ログに以下の `security_*` イベントが記録され Security ダッシュボードに表示される。\n\n| Event Type | Description |\n|---|---|\n| `security_blocked` | リクエストを遮断 |\n| `security_allowed` | チャレンジ通過後に許可 |\n| `security_credential_stuffing` | クレデンシャルスタッフィング検知 |\n| `security_impossible_travel` | 不可能移動検知 |\n| `security_geo_blocked` | ジオブロッキング発動 |\n| `security_bot_blocked` | ボット検知・遮断 |\n| `security_suspicious_ip` | 不審 IP 検知 |\n| `security_velocity_exceeded` | レート制限超過 |\n| `security_free_trial_abuse` | 無料トライアル悪用検知 |\n| `security_compromised_password` | 漏洩パスワード検知 |\n| `security_stale_account` | 休眠アカウント再活性化 |\n\n#### ベストプラクティス\n\n1. **まず `log` から始める** — いきなり遮断せず、トラフィックパターンを把握する。\n2. **しきい値を調整する** — アプリごとに最適値は違う。誤検知を監視して調整する。\n3. **遮断より先にチャレンジ** — 正規ユーザーを通しつつ自動攻撃を止める。\n4. **クライアント自動解決を有効化** — `autoSolveChallenge: true` を使う。\n5. **セキュリティイベントを定期レビュー** — 攻撃パターンを把握する。\n6. **重大イベントは管理者通知** — 休眠アカウント再活性化などで `notifyAdmin` を有効化する。\n\n---\n\n### Audit Logs — 認証イベントの追跡と照会\n\n`dash()` を入れた時点で、認証イベントは**追加設定なしに自動収集**される。`dash()` が Better Auth インスタンスのフックに接続し、サインアップ・サインイン・パスワード変更などをイベント発生と同時に記録する。手動の計装は不要。\n\n#### 追跡されるイベント（全カタログ）\n\n**ユーザー / セッション / アカウント / 検証**\n\n| Event | Trigger |\n|---|---|\n| `user_signed_up` | 新規登録 |\n| `user_profile_updated` | プロフィール更新 |\n| `user_profile_image_updated` | アバター変更 |\n| `user_email_verified` | メール検証完了 |\n| `user_banned` / `user_unbanned` | BAN / BAN 解除 |\n| `user_deleted` | アカウント削除 |\n| `user_signed_in` / `user_signed_out` | サインイン / サインアウト |\n| `session_created` / `session_revoked` | セッション作成 / 単一失効 |\n| `sessions_revoked_all` | 全セッション失効 |\n| `user_impersonated` / `user_impersonation_stopped` | なりすまし開始 / 終了 |\n| `account_linked` / `account_unlinked` | ソーシャル連携 / 解除 |\n| `password_changed` | パスワード更新 |\n| `password_reset_requested` / `password_reset_completed` | リセット開始 / 完了 |\n| `email_verification_sent` | 検証メール送信 |\n\n**組織（organization プラグイン使用時）**\n\n| Event | Trigger |\n|---|---|\n| `organization_created` / `organization_updated` | 組織の作成 / 更新 |\n| `member_added` / `member_removed` | メンバー追加 / 削除 |\n| `member_role_updated` | ロール変更 |\n| `member_invited` | 招待送信 |\n| `invite_accepted` / `invite_rejected` / `invite_cancelled` | 招待の承諾 / 拒否 / 取消 |\n| `team_created` / `team_updated` / `team_deleted` | チームの作成 / 更新 / 削除 |\n| `team_member_added` / `team_member_removed` | チームメンバー追加 / 削除 |\n\n\u003e セキュリティイベント（`security_*`）は `sentinel()` 使用時に追加される（前掲の表）。\n\n#### クライアントからの照会\n\n`dashClient()` を追加すると 2 つの照会 API が使える。\n\n- **`getAuditLogs`** — **現在のユーザー**の監査イベントを返す（組織のメンバーとして `organizationId` を渡せば組織スコープに絞れる）。一般メンバーのアクティビティ表示向け。\n- **`getAllAuditLogs`** — 呼び出しユーザーが **admin / owner** 権限を持つ組織の全監査イベントを返す。ロール評価に [organization プラグイン](https://www.better-auth.com/docs/plugins/organization)が必須。管理者ダッシュボード向け。\n\n```ts\nconst session = await authClient.getSession();\n\nconst logs = await authClient.dash.getAuditLogs({\n  session: session.data,\n  limit: 50,\n  offset: 0,\n});\n\nlogs.data?.events; // 監査ログイベントの配列\nlogs.data?.total;  // 総件数\nlogs.data?.limit;  // ページサイズ\nlogs.data?.offset; // 現在のオフセット\n```\n\n主なクエリパラメータ。`limit` は最大 `100`・既定 `50`、`offset` 既定 `0`。`eventType` / `organizationId` / `userId` / `identifier`（メール等の一意値）で絞り込めて、組み合わせも可能。\n\n| Parameter | Type | Description |\n|---|---|---|\n| `limit` | `number` | 1 ページの件数（最大 100、既定 50） |\n| `offset` | `number` | ページングのオフセット（既定 0） |\n| `organizationId` | `string` | 組織で絞り込み |\n| `userId` | `string` | ユーザー ID で絞り込み |\n| `eventType` | `string` | イベント種別で絞り込み |\n| `identifier` | `string` | 識別子（メール等）で絞り込み |\n| `session` | `object` | user を含むセッションオブジェクト |\n\nイベント種別での絞り込み例。\n\n```ts\nconst signIns = await authClient.dash.getAuditLogs({\n  session: session.data,\n  eventType: \"user_signed_in\",\n});\n```\n\nページネーションは `limit` / `offset` のループで全件取得できる。\n\n```ts\nasync function fetchAllUserAuditLogEvents(session: unknown) {\n  const limit = 100;\n  let offset = 0;\n  const allEvents = [];\n\n  while (true) {\n    const result = await authClient.dash.getAuditLogs({\n      session: session.data,\n      limit,\n      offset,\n    });\n\n    const events = result.data?.events ?? [];\n    allEvents.push(...events);\n\n    if (events.length \u003c limit) break;\n    offset += limit;\n  }\n\n  return allEvents;\n}\n```\n\n\u003e 監査ログの**保持期間はプラン依存**。エンタープライズ層ではログドレイン（`/dash/organization/log-drain`）で SIEM へ転送し、長期保管・相関分析に回せる。\n\n---\n\n### Email Service — マネージドなトランザクションメール配信\n\n検証・リセット・招待などの認証メールを、メール基盤を自前で運用せずに送れるマネージドサービス。**プロ仕様の組み込みテンプレート**、複数プロバイダ対応（AWS SES / SendGrid / Resend）、型安全なテンプレート変数、配信最適化を提供する。\n\n#### 送信 API\n\n`@better-auth/infra` に同梱。単発送信の `sendEmail` と、設定を固定した再利用センダーを作る `createEmailSender` がある。\n\n```ts\nimport { sendEmail, createEmailSender } from \"@better-auth/infra\";\n\n// 単発送信\nawait sendEmail({\n  template: \"verify-email\",\n  to: \"user@example.com\",\n  variables: {\n    verificationUrl: \"https://yourapp.com/verify?token=abc123\",\n    userEmail: \"user@example.com\",\n    userName: \"John\",\n    appName: \"Your App\",\n  },\n});\n\n// 再利用センダー\nconst emailSender = createEmailSender({\n  apiKey: process.env.BETTER_AUTH_API_KEY,\n  apiUrl: process.env.BETTER_AUTH_API_URL,\n});\n\nawait emailSender.send({\n  template: \"reset-password\",\n  to: \"user@example.com\",\n  variables: {\n    resetLink: \"https://yourapp.com/reset?token=xyz\",\n    userEmail: \"user@example.com\",\n  },\n});\n```\n\nAPI キー・URL は環境変数（`BETTER_AUTH_API_KEY` / 任意で `BETTER_AUTH_API_URL`）から自動で読まれる。戻り値は `{ success, messageId?, error? }` の `SendEmailResult`。\n\n#### 利用可能なテンプレート\n\n| Template | 用途 |\n|---|---|\n| `verify-email` | 新規ユーザーへのメール検証リンク |\n| `reset-password` | パスワードリセットリンク |\n| `change-email` | メールアドレス変更の確認 |\n| `sign-in-otp` | パスワードレスサインイン用 OTP |\n| `verify-email-otp` | メール検証用 OTP コード |\n| `reset-password-otp` | パスワードリセット用 OTP コード |\n| `magic-link` | パスワードレス認証のマジックリンク |\n| `two-factor` | 二要素認証コード |\n| `invitation` | 組織への招待 |\n| `application-invite` | アプリ（プラットフォーム）への招待 |\n| `delete-account` | アカウント削除の確認 |\n| `stale-account-user` | 休眠アカウントへのアクセス通知（ユーザー向け） |\n| `stale-account-admin` | 休眠アカウント再活性化の通知（管理者向け） |\n\n各テンプレートは型安全な `variables` を受け取る。例えば `invitation` は招待リンク・招待者名/メール・組織名・ロール等を渡す。\n\n```ts\nawait sendEmail({\n  template: \"invitation\",\n  to: \"newmember@example.com\",\n  variables: {\n    inviteLink: \"https://yourapp.com/invite?token=abc\",\n    inviterName: \"John Smith\",\n    inviterEmail: \"john@company.com\",\n    organizationName: \"Acme Corp\",\n    role: \"Member\",\n    appName: \"Your App\",   // 任意\n    expirationDays: \"7\",   // 任意\n  },\n});\n```\n\n#### Better Auth の認証フローとの統合\n\nBetter Auth 側のコールバック（`sendResetPassword` / `sendVerificationEmail` / `organization` プラグインの `sendInvitationEmail`）から `sendEmail` を呼ぶだけで、認証フローに自然に組み込める。\n\n```ts\nimport { betterAuth } from \"better-auth\";\nimport { organization } from \"better-auth/plugins\";\nimport { sendEmail } from \"@better-auth/infra\";\n\nexport const auth = betterAuth({\n  emailAndPassword: {\n    enabled: true,\n    async sendResetPassword({ user, url }) {\n      await sendEmail({\n        template: \"reset-password\",\n        to: user.email,\n        variables: { resetLink: url, userEmail: user.email, userName: user.name, appName: \"Your App\" },\n      });\n    },\n  },\n  emailVerification: {\n    sendOnSignUp: true,\n    async sendVerificationEmail({ user, url }) {\n      await sendEmail({\n        template: \"verify-email\",\n        to: user.email,\n        variables: { verificationUrl: url, userEmail: user.email, userName: user.name, appName: \"Your App\" },\n      });\n    },\n  },\n  plugins: [\n    organization({\n      async sendInvitationEmail(data) {\n        const inviteLink = `https://yourapp.com/accept-invitation/${data.id}`;\n        await sendEmail({\n          template: \"invitation\",\n          to: data.email,\n          variables: {\n            inviteLink,\n            inviterName: data.inviter.user.name,\n            inviterEmail: data.inviter.user.email,\n            organizationName: data.organization.name,\n            role: data.role,\n            appName: \"Your App\",\n          },\n        });\n      },\n    }),\n  ],\n});\n```\n\n\u003e **本番では送信を `await` で待たない**ことが推奨される（タイミング攻撃の回避）。サーバーレスでは `waitUntil` 等を使い、レスポンスをブロックせずに送信を完了させる。トランザクションメールは **Pro プラン以上**で利用可能。\n\n---\n\n## ビジネスモデル — OSS コア + Infrastructure = Supabase 型\n\nBetter Auth の収益構造は **Supabase 型**だ。\n\n- **OSS コア（無料）で普及を取る** — `better-auth` 本体とプラグインは OSS。学習コストの低さと型安全・網羅性で開発者に広く使われ、エコシステムを育てる。\n- **Infrastructure（有料）で収益化する** — その上で「自前運用すると重い領域」（管理 GUI・不正検知・メール配信・SSO/SCIM・ログドレイン）をマネージドサービスとして売る。普及した OSS が**販売チャネル**そのものになる。\n\nこれは Auth0 / Clerk の「全部ホスト」モデルとは思想が違う。\n\n| 観点 | Auth0 / Clerk（全部ホスト） | Better Auth + Infrastructure |\n|---|---|---|\n| 認証コア | ベンダーがホスト | **自前ホスト（OSS・無料）** |\n| ユーザーデータ | ベンダー側 | **自前 DB に所有** |\n| 課金対象 | 認証そのもの（MAU 等） | 運用知能（分析・不正対策・配信） |\n| 採用の起点 | 営業・サインアップ | OSS の普及 |\n| ロックイン | 強い（移行が重い） | 弱い（コアは手元、有料層は着脱式） |\n\nポイントは「**コアは自前、運用知能だけ買う**」という分離だ。認証ロジックとユーザーデータの主権を手放さないまま、ダッシュボードや不正検知だけを Infra に委譲できる。\n\nただし利便性ゆえに**寄せすぎるとロックインの芽が生まれる**点には注意が必要だ（[§08 デメリット](08-cons.html) でも触れたとおり、有料層への依存はロックインの芽になる）。どこまでを有料層に委ねるかは設計段階で線引きし、「自前ホストだから自由」という当初の利点を保てるバランスを保つのがよい。\n\n---\n\n## 一次情報\n\n- Introduction: \u003chttps://www.better-auth.com/docs/infrastructure/introduction\u003e\n- Getting Started: \u003chttps://www.better-auth.com/docs/infrastructure/getting-started\u003e\n- Dashboard プラグイン（dash）: \u003chttps://www.better-auth.com/docs/infrastructure/plugins/dash\u003e\n- Security プラグイン（sentinel）: \u003chttps://www.better-auth.com/docs/infrastructure/plugins/sentinel\u003e\n- Audit Logs: \u003chttps://www.better-auth.com/docs/infrastructure/plugins/audit-logs\u003e\n- Email Service: \u003chttps://www.better-auth.com/docs/infrastructure/services/email\u003e\n\n\n\n---\n\n\n# AI Resources — AI が認証を書く / AI が認証する\n\n\u003e 本資料の **山場**。Better Auth は「AI と一緒に書く」ことを前提に設計された認証ライブラリであり、さらに「AI が認証主体になる」時代にも最初に手を打っている。本章は **AI が認証を書く（開発体験）** と **AI が認証する（エージェント認証）** の2軸で、Better Auth がなぜ「AI ネイティブな認証基盤」と呼べるのかを仕様レベルまで掘り下げる。後半は **Agent Auth Protocol（v1.0-draft）** と **WorkOS auth.md** をフロー図つきで詳説する。\n\u003e 締めの整理: **`llms.txt` がドキュメントを、`auth.md` が認証フローを、Agent Auth Protocol がエージェントの身元を、それぞれ AI に読める/扱える形へ変換する。**\n\n### 🎤 登壇メモ\n\n- **つかみ**: 「認証を *書く* AI と、認証 *される* AI — その両方に最初に手を打ったのが Better Auth」。\n- **強調（ここが山場）**: 軸②。エージェントを「誰かの identity の影」から固有の principal へ引き上げる話。版は **Agent Auth Protocol（v1.0-draft）**、auth.md の核は **ID-JAG**（IETF ドラフト `draft-ietf-oauth-identity-assertion-authz-grant`）、`agent-auth` は **Better Auth 公式プラグイン** — この3点は一次ソース確認済みなので事実として断言してよい。それ以外の細部（承認方式の網羅性など）は「資料参照」に留め、断定しすぎない。\n- **10分なら**: 軸②のフロー詳細（ID-JAG シーケンス図など）は概念だけ口頭で伝え、ASCII 図は「詳しくは資料」に逃がす。代わりに軸① CLI の **スキーマ自動生成** を実演1枚に絞ると刺さる。\n\n---\n\n## 0. この章の主張（2軸で読む）\n\n「AI と認証」と言うとき、向きが2つある。混同すると話がぼやけるので、最初に分けておく。\n\n| 軸 | 問い | 主役 | Better Auth の答え |\n|---|---|---|---|\n| 軸① AI が認証を書く | AI に認証コードを実装させられるか | 開発者 + コーディングAI | CLI / ドキュメント MCP / Skills / llms.txt / Ask AI |\n| 軸② AI が認証する | AI エージェント自身を認証できるか | AI エージェント | Agent Auth（公式プラグイン + プロトコル）/ auth.md |\n\n\u003e 一言で: **軸①は「実装の自動化」、軸②は「認証される主体の追加」。** クラウド認証 SaaS は軸①でブラックボックス化しがちで、軸②はまだこれから。Better Auth は **コードベース型 OSS** という性質を武器に、両軸を同時に押さえにいっている。\n\n---\n\n## 1. 軸①「AI が認証を書く」— AI ネイティブな開発体験\n\n### 1.1 なぜ「コードベース型」だと AI と相性がいいのか\n\nBetter Auth は自分のサーバー・自分の DB で動く **ライブラリ**であり、認証ロジックもスキーマも **すべて自分のリポジトリ内のコードとして存在する**。これは AI コーディングにとって決定的に有利だ。\n\n- **AI がコードを読める** — 設定（`auth.ts`）・スキーマ・呼び出し箇所がリポジトリ内にあるので、AI は実際の構成を読んで文脈に沿った実装ができる。\n- **AI がスキーマを生成できる** — 設定からテーブル定義を機械的に導出できる（後述の CLI）。\n- **AI が規約に沿える** — 公式が配布する Skills / ドキュメントを参照させれば、ライブラリの作法どおりに書かせられる。\n\n\u003e 主張: **クラウド認証 SaaS は管理画面とダッシュボードの「外」に実装の実体を持つため、AI に渡せる手掛かりが少ない。** Better Auth は逆で、認証が「AI に読ませ・書かせられるコード」として手元にある。これが AI ネイティブの本質。\n\nBetter Auth は公式に4つの AI 向けリソースを束ねて提供している（`/docs/ai-resources`）。\n\n| リソース | 何か | いつ使うか |\n|---|---|---|\n| Ask AI in docs | ドキュメント内で AI に直接質問する UI | 仕様をその場で確認したいとき |\n| llms.txt | ドキュメント全体を LLM 向けに構造化したテキスト | AI に文脈をまとめて渡したいとき |\n| ドキュメント MCP サーバー | ドキュメント検索・例・セットアップ補助を MCP で提供 | エディタ/エージェントから最新ドキュメントを引きたいとき |\n| Skills | 規約・安全なパターンを教えるエージェントスキル | AI に作法どおり実装させたいとき |\n\n### 1.2 CLI — 人間がスキーマを手書きしない\n\nBetter Auth は **初期からビルトイン CLI を持つ**。これが「AI ネイティブ」を支える土台で、認証テーブルを人間が手で書かないための仕組みだ。\n\n\u003e 関連: 基本概念とスキーマ生成の全体像は [§01 コンセプト](01-concepts.html) を参照。\n\n主要コマンド（`npx @better-auth/cli@latest \u003ccommand\u003e`）:\n\n| コマンド | 役割 |\n|---|---|\n| `generate` | 設定とプラグインから DB スキーマ（ORM 定義 / SQL）を生成する |\n| `migrate` | スキーマを DB に直接適用する（ビルトインの Kysely アダプタ向け） |\n| `init` | プロジェクトに Better Auth を初期セットアップする |\n| `secret` | アプリ用のシークレットキーを生成する |\n| `info` | 環境・設定の診断情報を集める |\n\n`generate` の出力先は使っている DB レイヤで変わる。\n\n- **Prisma** → `prisma/schema.prisma` に書き出す。\n- **Drizzle** → プロジェクトルートの `schema.ts` に書き出す。\n- **Kysely** → `schema.sql` として書き出す。\n\n主なフラグ:\n\n- `--output` — 生成スキーマの保存先を指定する。\n- `--config` — `auth.ts` の場所を指定する。デフォルトは `./`・`./utils`・`./lib`（および `src` 配下の同名ディレクトリ）を探索する。\n- `--yes` — 確認プロンプトを飛ばして直接生成する。\n\n最小の流れはこうなる。\n\n```ts\n// auth.ts — プラグインを足すだけ。テーブル定義は書かない\nimport { betterAuth } from \"better-auth\";\nimport { organization, twoFactor } from \"better-auth/plugins\";\n\nexport const auth = betterAuth({\n  database: /* adapter */,\n  emailAndPassword: { enabled: true },\n  plugins: [organization(), twoFactor()],\n});\n```\n\n```bash\n# 設定とプラグインからスキーマを生成 → DB に適用\nnpx @better-auth/cli@latest generate\nnpx @better-auth/cli@latest migrate\n```\n\n\u003e 肝: **プラグインを追加するたびに、必要なテーブル・カラムが自動で追従する。** `organization` を足せば組織/メンバー/招待のテーブルが、`twoFactor` を足せば 2FA 用のカラムが、`generate` の出力に現れる。人間（や AI）が認証スキーマを手書きする必要がない。Prisma/Drizzle 利用時は `generate` 後にそれぞれの migration ツールで適用する運用になる。\n\n### 1.3 ドキュメント MCP サーバー — AI に「最新の正解」を引かせる\n\nBetter Auth は **リモート MCP サーバー** をホストしており、ドキュメント検索・コード例・セットアップ補助を、任意の MCP 対応クライアント（Cursor / Claude Code / Open Code ほか）に公開している。\n\n- **エンドポイント**: `https://mcp.better-auth.com/mcp`\n- これは認証機能としての [MCP プラグイン](https://www.better-auth.com/docs/plugins/mcp)（自前で MCP サーバーに OAuth を付けるもの）とは **別物**。こちらは「ドキュメントを引くための MCP」。\n\nCLI から各クライアントへ一発で追加できる（フラグ無しなら対応ターゲット一覧を表示）。\n\n```bash\nnpx auth@latest mcp --cursor       # Cursor に追加\nnpx auth@latest mcp --claude-code  # Claude Code に追加\nnpx auth@latest mcp --open-code    # Open Code に追加\nnpx auth@latest mcp               # フラグ無し → 対応ターゲットを一覧表示\n```\n\n\u003e 補足: CLI 本体は `@better-auth/cli`。`npx auth@latest mcp --cursor` はその短縮エイリアス経由の呼び出しで、資料によっては `npx @better-auth/cli mcp --cursor` と表記される。狙いは同じ — **AI に古い記憶ではなく公式ドキュメントの最新を引かせる**こと。\n\n### 1.4 公式 Skills — AI に「作法」を守らせる\n\n[Agent skills](https://agentskills.io) は、コーディングエージェントにプロジェクトの規約・安全なパターン・「ドキュメントのどこを見るか」を教える、ポータブルな指示ファイル（例: `SKILL.md`）。Better Auth の **公式スキルパック**は [`better-auth/skills`](https://github.com/better-auth/skills) リポジトリにある。\n\n`skills` CLI で導入する（`npx` 経由なのでグローバルインストール不要）。\n\n```bash\nnpx skills add better-auth\n```\n\n\u003e 効果: AI が「それっぽいが間違っている」認証コードを書く事故を減らせる。**規約をプロンプトに毎回書く代わりに、スキルとして固定し、エージェントに常時参照させる。** 認証はミスがそのまま脆弱性になる領域なので、この「型を強制する」仕組みの価値は大きい。\n\n### 1.5 llms.txt — ドキュメントを丸ごと LLM に読ませる\n\nBetter Auth はドキュメント全体を LLM 向けの構造化テキストとして公開している。\n\n- 索引: \u003chttps://www.better-auth.com/llms.txt\u003e\n- 各ページの素のテキストは `/llms.txt/docs/\u003cpath\u003e.md` で取得できる（例: `/llms.txt/docs/ai-resources.md`）。\n\nこれにより、AI は HTML をスクレイピングせずに **ページ単位の Markdown を直接コンテキストへ流し込める**。「ドキュメントを AI が読める形で配る」という設計思想が、サイト構造そのものに組み込まれている。\n\n### 1.6 Ask AI in docs\n\nドキュメントサイト上で **AI に直接質問できる** UI を備える。仕様の確認や「この設定はどう書くか」を、ページを横断して探さずにその場で解決できる。軸①の中では最も軽量な入口。\n\n### 1.7 軸①のまとめ\n\n- **CLI** がスキーマ生成を自動化し、**MCP / llms.txt** が AI に最新ドキュメントを供給し、**Skills** が実装の作法を矯正し、**Ask AI** がその場の疑問を埋める。\n- これらは互いに補完的で、合わせると「**AI が、正しい文脈で、規約どおりに、認証コードを書ける**」状態が作れる。\n- 繰り返すが、これが成り立つ前提は **認証がコードとして手元にあること**。コードベース型 OSS の強みが、そのまま AI ネイティブの強みになっている。\n\n---\n\n## 2. 軸②「AI が認証する」— エージェント認証の最前線\n\nここからは向きが変わる。**「AI エージェント自身を、どう認証するか」** という、まさに今立ち上がりつつある領域。Better Auth はここでも先手を打っている。ここを仕様レベルまで掘る。\n\n### 2.1 出発点: 既存の認証は「人間 + 静的アプリ」しか想定していない\n\nAgent Auth の問題提起は鋭い。\n\n\u003e Web 向けに作られてきた認証モデル（OAuth・セッション・API キー）は、すべて **2種類のアクター**を前提にしている — **人間のユーザー**と、**事前定義されたスコープを持つ静的なアプリ**。エージェントはそのどちらでもない。\n\nエージェントは、\n\n- **一度きりの短命タスク**から、**常駐のバックグラウンドワーカー**、**多段の自律システム**まで幅がある。\n- **人間が常時介在しないまま**外部サービスを呼ぶ。\n- **ユーザーの代理**で動くこともあれば、**完全に自分の判断**で動くこともある。\n\nつまり、エージェントは「人間でも静的アプリでもない第3のアクター」であり、既存の認証モデルにそのまま当てはまらない。ここが軸②の根本。\n\n### 2.2 問題: Delegated agents（継承された identity）\n\nエージェントがユーザーの代理で動くとき、従来は **アプリかユーザーの identity をそのまま継承**してしまう。既存の資格情報の下で動くため、エージェントを独立した principal（主体）として識別できない。エージェントが「誰か別人の identity に溶け込んで」しまうのだ。これが3つの欠落を生む。\n\n- **可視性なし（No visibility）** — サーバーは、どのエージェントがリクエストしたのか判別できない。\n- **スコープなし（No scoping）** — エージェントごとに権限を絞れない。資格情報を共有する全エージェントが同じ権限を持つ。\n- **分離なし（No isolation）** — 1つのエージェントだけを失効できない。止めるなら全部を止めるしかない。\n\n\u003e つまり「ユーザーの鍵をそのままエージェントに渡している」状態。監査もできず、最小権限も効かず、事故時の封じ込めもできない。エージェントが本格的に外部サービスを操作し始めると、これは致命的になる。\n\n---\n\n### 2.3 Agent Auth Protocol（v1.0-draft）\n\n**Agent Auth** は、AI エージェントの認証・**capability ベースの認可**・サービス発見のための **オープンソース標準 + 実装**。サイト上の表記は **v1.0-draft**（仕様策定途上）。\n\n#### 2.3.1 何を与えるか — 独立した principal 化\n\nアプリやユーザーの identity を継承する代わりに、**各エージェントが固有の以下4点を持つ**。\n\n| 要素 | 内容 |\n|---|---|\n| identity | エージェント固有の身元。どのエージェントかをサーバーが識別できる |\n| 暗号鍵ペア | エージェント自身の鍵。リクエストへの署名に使う |\n| scoped capabilities | 付与された範囲の権限（能力）。最小権限で絞れる |\n| 独立したライフサイクル | そのエージェントだけを発行・更新・失効できる |\n\nこれにより 2.2 の3欠落が、それぞれ次のように解消される。\n\n| 従来（Delegated）の欠落 | Agent Auth による解消 |\n|---|---|\n| 可視性なし | 固有 identity で「どのエージェントか」を明確に帰属（clear attribution） |\n| スコープなし | エージェントごとに capability を付与（scoped permissions / least privilege） |\n| 分離なし | 独立したライフサイクルで、そのエージェントだけを失効できる |\n\n結果として、Claude / ChatGPT / Cursor のような AI アプリが、外部サービス（銀行・API・デプロイパイプライン・コミュニケーションツール）へ接続し、**clear attribution（誰がやったか明確）+ scoped permissions（最小権限）** でタスクを実行できる。\n\n#### 2.3.2 仕様がカバーする範囲\n\nフル仕様（`/specification`）は次を定義する。\n\n- **identity** — エージェントの身元\n- **registration** — サーバーへの登録\n- **authentication** — 認証\n- **capabilities** — 能力（スコープ付き権限）\n- **approval** — ユーザー承認\n- **discovery** — サービス/プロバイダの発見\n- **lifecycle** — 発行から失効までのライフサイクル\n\n概念は3つの役割に整理される。\n\n- **Servers** — 認可と capability 管理を行う側\n- **Client** — エージェントとサーバーをつなぐブリッジ\n- **Agents** — 実行時の AI アクター本体\n\n#### 2.3.3 フロー: discovery → registration → capability authorization\n\nBetter Auth の `agent-auth` プラグインが実装する標準フローは次の5段階。ユーザー承認は **`device_authorization`（ユーザーコードによるブラウザ承認）** か **`ciba`（バックチャネル承認）** で行う。\n\n```text\n[Agent]                              [Server / Provider]            [User]\n  |  1. GET /.well-known/agent-configuration  ───────▶                |\n  |     ◀── 提供している capabilities 一覧                             |\n  |                                                                    |\n  |  2. capabilities を見て「何が必要か」を判断                        |\n  |                                                                    |\n  |  3. register + capability grant をリクエスト ───▶                  |\n  |                                                                    |\n  |  4. 承認要求 (device_authorization / CIBA) ───────────────────▶  承認\n  |     ◀── capability grant 発行 ◀───────────────────────────────  |\n  |                                                                    |\n  |  5. 短命JWT(aud=呼び先URL)に署名し、付与された capability を       |\n  |     default_location（または capability 個別の location）で実行 ─▶ |\n```\n\n\u003e 発見ルートは **`/.well-known/agent-configuration`** に置く（Better Auth の base path が `/api/auth` でも、発見ルートはここ）。各 capability は共通の **`default_location`** か、capability 固有の **`location`** で呼び出す。\n\n#### 2.3.4 従来手法との違い（比較表）\n\nAgent Auth は OAuth の置き換えではない。**エージェントの identity・登録・capability・発見に特化した単一プロトコル**。\n\n| 観点 | OAuth | API キー | Delegated（継承） | Agent Auth |\n|---|---|---|---|---|\n| 主目的 | ユーザーが3rdパーティアプリに権限委譲 | アプリ単位の静的認証 | ユーザー/アプリの身元を流用 | エージェント固有の身元・認可・発見 |\n| エージェント識別 | 不可（アプリ単位） | 不可（キー単位） | 不可（誰かに溶け込む） | 可（principal ごと） |\n| 権限の粒度 | 事前定義スコープ | キーに紐づく固定 | 共有 = 同一権限 | capability で個別付与 |\n| 個別失効 | 困難 | キー失効で全停止 | 不可 | 可（独立ライフサイクル） |\n| ライフサイクル概念 | 弱い | なし | なし | あり（仕様の一部） |\n\n\u003e 公式 FAQ: **「OAuth の置き換えか?」→ No。** OAuth は「ユーザーが3rdパーティアプリにリソースアクセスを許可する」別問題を解く。Agent Auth だけを使うなら OAuth サーバーは不要だが、サーバーは「ユーザーがアプリを認可する」ために OAuth を併存させてもよい。\n\n#### 2.3.5 MCP との関係\n\n\u003e 公式 FAQ: **「MCP の auth を使えばいい?」→ No。** MCP は OAuth 2.1 を使うが、**per-agent identity・capability ベース認可・エージェントのライフサイクルという概念を持たない**。3つのエージェントが同じ MCP サーバーを OAuth 経由で使うと、サーバーには **3つのエージェントではなく1つのクライアント**にしか見えない。\n\n棲み分けは明快。**Agent Auth は MCP と併存できる** — サービスは capability を MCP ツールとして公開しつつ、**identity と認可のレイヤだけ Agent Auth に任せる**。MCP（ツール提供）と Agent Auth（誰が・何を許されているか）は層が違う。\n\n#### 2.3.6 エコシステムと立ち位置\n\n- **仕様/実装の保守は Better Auth チーム**。ただし **Better Auth には依存しない**。実装・利用に Better Auth は不要で、任意のプラットフォーム/プロバイダが独立に採用できるオープン標準。\n- **SDK** — 公式実装あり（`/docs/sdks`）。\n- **Directory** — 対応サーバーを登録・一覧できる（\u003chttps://agent-auth.directory\u003e）。\n- **Community** — Discord コミュニティあり。\n- **Demo** — 動作デモあり（`/demo`）。\n- ソース: \u003chttps://agentauthprotocol.com/\u003e / GitHub `better-auth/agent-auth-protocol`。\n\n#### 2.3.7 Better Auth の `agent-auth` プラグインが実装するもの\n\nプロトコルは Better Auth 非依存だが、**Better Auth 側には `agent-auth` 公式プラグインとして既に組み込まれている**。プラグインの守備範囲は「**エージェントの identity・registration・discovery・capability ベース認可**」。\n\n\u003e 関連: プラグイン体系の全体像は [§03 プラグイン大全](03-plugins.html) を参照。\n\n- **発見ルート** `/.well-known/agent-configuration` を生やす。\n- **capability** を定義し、共通 `default_location` または個別 `location` で実行させる。\n- 承認方式として **`device_authorization`** と **`ciba`** をサポート。\n- エージェントは **短命 JWT（`aud` が呼び先 URL に一致）** に署名して各 capability を呼ぶ。\n\n発見ルートの実装はこのくらい薄い（Next.js の例）。\n\n```ts\n// app/.well-known/agent-configuration/route.ts\nimport { auth } from \"@/lib/auth\";\nimport { NextResponse } from \"next/server\";\n\nexport async function GET() {\n  // プラグインが組み立てた agent-configuration を返すだけ\n  const config = await auth.api.getAgentConfiguration();\n  return NextResponse.json(config);\n}\n```\n\n\u003e ここで2軸が交差する: **「AI が認証を書く（軸①の CLI/プラグイン体験）」仕組みの上に、「AI が認証される（軸②の Agent Auth）」機能が、ひとつのプラグインとして乗る。** 同じライブラリ・同じワークフローで両方扱える点が Better Auth の構造的な強み。\n\n---\n\n### 2.4 auth.md（WorkOS）— ドメインに置く1枚の Markdown\n\n軸②のもう一つの潮流が、WorkOS が提案する **auth.md**。狙いは **「サインアップフォーム（人間の UI）なしで、エージェントがユーザーを登録する」** こと。GitHub の `workos/auth.md` は、これを **agentic registration（エージェントによる登録）の参照実装**と位置づけている。\n\n#### 2.4.1 ファイルの構造と置き場所\n\nauth.md は、アプリが自分のドメインに置く **小さな Markdown ファイル1枚**（典型的には `https://service.example.com/auth.md`）。記述するのは次の4点。\n\n- そのサービスが **どの登録フローに対応しているか**\n- 公開する **スコープ（権限）**\n- **どう登録するか**の手順\n- **登録後に何をするか**\n\n肝は **Markdown がプレーンテキストである**こと。同じ1ファイルが、\n\n- **人間の統合担当者向けドキュメント**であると同時に、\n- **エージェントが実行時に発見して読めるランタイム成果物（discoverable runtime artifact）**にもなる。\n\n\u003e 発想の転換: **「サインアップフォーム（人間の UI）」を用意する代わりに、「エージェントが読める登録の契約書」をドメインに置く。** 認証フローが、画面ではなく機械可読なテキストとして公開される。\n\n代表的な auth.md の形（illustrative。実フィールド名はサービス/仕様により異なる）:\n\n```md\n# auth.md — Notes App\n\nエージェントがユーザーの代理で登録するための手順を記述する。\n\n## Supported flows\n- agent-verified   # エージェントの IdP が保証する\n- user-claimed     # ユーザーがコードで確認する\n\n## Scopes\n- notes:read   ノートの閲覧\n- notes:write  ノートの作成・編集\n\n## Registration\n- discovery:        https://notes.example.com/.well-known/oauth-authorization-server\n- identity endpoint: POST /agent/identity\n- token endpoint:    POST /oauth2/token  (grant_type=jwt-bearer)\n\n## After registration\n- 発行された access_token を Authorization: Bearer で各 API に付与する\n- トークンは短命・失効可能。失効イベントを受けたら再登録する\n```\n\n#### 2.4.2 3つの役割と ID-JAG\n\nauth.md は3つの役割で動く。\n\n| 役割 | 担当 |\n|---|---|\n| Agent | ユーザーの代理で動くエージェント |\n| Agent Provider（IdP） | identity assertion（**ID-JAG**）を発行するエージェントの身元プロバイダ |\n| Service | その assertion を受理し、scoped なアクセスを発行するサービス |\n\n**ID-JAG** = Identity Assertion JWT Authorization Grant。IETF の OAuth ドラフト（`draft-ietf-oauth-identity-assertion-authz-grant`）に基づく、身元アサーションを認可グラントとして使う仕組み。\n\n#### 2.4.3 Agent verified flow（エージェント検証フロー）\n\nエージェントの IdP がユーザーを保証する **agent-attested** なフロー。人間がループに入らない。**このフローだけはエージェント側の統合実装が必要**。ID-JAG を使った流れは次のとおり（`workos/auth.md` のシーケンス図を ASCII 化）。\n\n```text\nUser      Agent                         Service                        Provider(IdP)\n  |   1. GET /api/resource ───────────────▶ |                               |\n  |      ◀── 401 WWW-Authenticate:                                          |\n  |          Bearer resource_metadata=\"...\" |                               |\n  |   2. GET /.well-known/oauth-protected-resource ─▶                       |\n  |      ◀── 200 PRM (authorization_servers)|                               |\n  |   3. GET /.well-known/oauth-authorization-server ─▶                     |\n  |      ◀── 200 AS metadata (agent_auth ブロック)                          |\n  | ◀─ 4. 「この audience に identity を主張してよい?」(consent)             |\n  | ─▶    consent granted                   |                               |\n  |   5. audience 固有の ID-JAG を要求 ───────────────────────────────────▶ |\n  |      ◀── 200 ID-JAG ◀──────────────────────────────────────────────── |\n  |   6. POST /agent/identity                |                              |\n  |      { type: identity_assertion, assertion: ID-JAG } ─▶                 |\n  |          7. Service ─▶ Provider: GET /.well-known/jwks.json             |\n  |             ◀── 200 JWKS（署名検証）                                    |\n  |      ◀── 200 identity_assertion          |                              |\n  |   8. POST /oauth2/token                  |                              |\n  |      grant_type=jwt-bearer&assertion=... ─▶                             |\n  |      ◀── 200 access_token (scoped / short-lived / revocable)           |\n```\n\n要点:\n\n- サービスは標準の **`.well-known/oauth-protected-resource` / `.well-known/oauth-authorization-server`** で発見可能。後者に **`agent_auth` ブロック**を載せる。\n- サービスは **Provider の JWKS** を取りに行き、ID-JAG の署名を検証する。\n- 最後は **`grant_type=jwt-bearer`** で access_token に交換する。既存の OAuth トークンエンドポイントを再利用できる。\n\n#### 2.4.4 User claimed flow（ユーザー確認フロー）\n\nIdP（プロバイダ）が不要なフロー。**エージェントがユーザーにコードを見せ、ユーザーがアプリにサインインして確認（claim）する**。アプリが auth.md に書いた情報だけで、**エージェントが自分で発見・自己ナビゲートできる**よう設計されている（=エージェント側の特別な統合が不要）。手順の骨子:\n\n1. エージェントが `auth.md` を取得し、user-claimed フローを選ぶ。\n2. エージェントがサービスに登録を要求し、**確認コード**を受け取る。\n3. エージェントがユーザーに **コード + サインイン URL** を提示する。\n4. ユーザーがアプリにサインインし、そのコードを **claim（確認）** する。\n5. 確認が取れたら、エージェントが **scoped access_token に交換**する。\n6. 以降はトークンで API を呼び、**失効（revoke）を受けたら再登録**する。\n\n#### 2.4.5 エージェントはどう発見・解析・実行するか\n\n`workos/auth.md` リポジトリは、**エージェントが読む手続きマニフェスト**として `AUTH.md`（skill manifest）を置いている。その手続きレシピはこの6段階。\n\n```text\ndiscover → register → claim → exchange → use → handle revoke\n（発見）   （登録）    （確認）  （トークン交換） （利用） （失効対応）\n```\n\n- **discover** — ドメインの `auth.md` と `.well-known/...` を取得して、対応フロー・スコープ・エンドポイントを把握する。\n- **register / claim** — 選んだフロー（verified or claimed）で登録・確認する。\n- **exchange** — assertion / 確認結果を **scoped access_token** に交換する。\n- **use** — トークンを Bearer で付けて API を呼ぶ。\n- **handle revoke** — 失効を受け取ったら停止/再登録する。\n\n#### 2.4.6 信頼 / セキュリティモデル\n\n- 発行される資格情報は、**ユーザーに紐づく scoped access token**。**短命かつ失効可能**で、**標準の OAuth** で発行される（既存の API 認証をそのまま再利用できる）。\n- verified フローでは、サービスが **Provider の JWKS で ID-JAG の署名を検証**する。アサーションは **audience（audience 固有）** に紐づくため、別サービスへ使い回せない。\n- **ユーザー consent** が明示的に挟まる（「この audience に identity を主張してよいか」）。\n- Provider は **失効イベント（revocation events）** を送れる。アプリ/エージェントはそれに従う。\n- **アプリがどのフローを受け付けるかを決める**。verified だけ、claimed だけ、両対応、いずれも選べる。発行する資格情報も含めてアプリ側が主導権を持つ。\n\n#### 2.4.7 `github.com/workos/auth.md` の位置づけ\n\n仕様本体 + **参照実装**。リポジトリ構成（Layout）は次のとおり。\n\n```text\n.\n├── AUTH.md            ← エージェントが読む skill manifest（手続きレシピ）\n├── agent-services/    ← サンプルの resource server + authorization server\n├── agent-providers/   ← ID-JAG を発行するサンプル agent IdP\n└── shared/            ← 共有ワークスペースパッケージ（ports, types）\n```\n\n読み手別の入口も用意されている。\n\n- **エージェント実装者 / テンプレートが欲しい人** → `AUTH.md`（discover → register → claim → exchange → use → handle revoke の手続きレシピ）\n- **サービス実装者** → `agent-services/README.md`（実装ガイド・シーケンス図・エラー表）\n- **IdP 実装者** → `agent-providers/README.md`（ID-JAG の発行、JWKS の公開、失効イベントの送信）\n\nauth.md は WorkOS 製だが **仕様はオープン**。整備の方向は「**apps 向け**（登録を有効化する）」「**agent providers 向け**（検証済み identity を付与する）」の2系統のガイドに分かれている。\n\n---\n\n### 2.5 Agent Auth と auth.md の関係（棲み分け）\n\n両者は競合というより、層が違う。\n\n| 観点 | Agent Auth（Better Auth/AAP） | auth.md（WorkOS） |\n|---|---|---|\n| 主な問い | エージェントに固有 identity をどう与えるか | エージェントにどう登録/発見させるか |\n| 焦点 | identity・capability・lifecycle | registration（サインアップ無しの登録） |\n| 形 | プロトコル + SDK + 公式プラグイン | ドメインに置く1枚の Markdown + 参照実装 |\n| 発見ルート | `/.well-known/agent-configuration` | `auth.md` + `/.well-known/oauth-*` |\n| 著者/保守 | Better Auth チーム | WorkOS |\n| 開放性 | オープン（Better Auth 非依存） | オープン（WorkOS 著） |\n| 資格情報 | 暗号鍵ペア + scoped capabilities | OAuth の scoped・短命・失効可能トークン |\n| 共通言語 | OAuth/JWT 系の標準に乗る | OAuth/JWT 系の標準に乗る（ID-JAG, JWKS, jwt-bearer） |\n\n\u003e どちらも共通して目指すのは、**エージェントを「誰かの identity の影」から、固有 identity を持つ独立した主体へ引き上げる**こと。アプローチは違えど方向は同じで、いずれも既存の OAuth/JWT/`.well-known` 標準の上に乗っているのが現実的な点。\n\n---\n\n## 3. まとめ — 認証は「人間の UI」から「機械が読む契約」へ\n\n- **軸①（AI が認証を書く）**: CLI のスキーマ自動生成、ドキュメント MCP、公式 Skills、llms.txt、Ask AI。**コードベース型だからこそ、AI がコードを読み・スキーマを生成し・規約に沿って実装できる。** クラウド SaaS のブラックボックスには出しにくい強み。\n- **軸②（AI が認証する）**: Agent Auth がエージェントに固有 identity と capability を与え、auth.md が登録フローを機械可読化する。**Better Auth はこの両輪を、同じライブラリ・同じワークフローの中に持つ。**\n- 三題噺でまとめる:\n\n| 何を | 何が | AI にとって |\n|---|---|---|\n| ドキュメント | `llms.txt` | 読める構造化テキストになる |\n| 認証フロー | `auth.md` | 発見・実行できるランタイム成果物になる |\n| エージェントの身元 | Agent Auth Protocol | 識別・認可・失効できる principal になる |\n\n\u003e 着地: **AI が認証し、AI が認証を書く。** 認証は「人間が操作する UI」から「**機械が読む契約（machine-readable contract）**」へと拡張されつつある。その最前線を、コードベース型 OSS という土台の上で同時に押さえているのが Better Auth。これが本資料で最も伝えたい一点。\n\n---\n\n## 付録: 一次情報リンク\n\n- Better Auth / AI Resources: \u003chttps://www.better-auth.com/docs/ai-resources\u003e\n- Better Auth / ドキュメント MCP: \u003chttps://www.better-auth.com/docs/ai-resources/mcp\u003e\n- Better Auth / Skills: \u003chttps://www.better-auth.com/docs/ai-resources/skills\u003e\n- Better Auth / CLI: \u003chttps://www.better-auth.com/docs/concepts/cli\u003e\n- Better Auth / agent-auth プラグイン: \u003chttps://www.better-auth.com/docs/plugins/agent-auth\u003e\n- Better Auth / llms.txt: \u003chttps://www.better-auth.com/llms.txt\u003e\n- Agent Auth Protocol（v1.0-draft）: \u003chttps://agentauthprotocol.com/\u003e\n- Agent Auth Protocol / Introduction: \u003chttps://agentauthprotocol.com/docs/introduction\u003e\n- Agent Auth Protocol / Specification: \u003chttps://agentauthprotocol.com/specification\u003e\n- Agent Auth Directory: \u003chttps://agent-auth.directory\u003e\n- WorkOS auth.md: \u003chttps://workos.com/auth-md\u003e\n- WorkOS auth.md / Docs: \u003chttps://workos.com/auth-md/docs\u003e\n- auth.md 仕様/参照実装（GitHub）: \u003chttps://github.com/workos/auth.md\u003e\n- ID-JAG（IETF draft）: \u003chttps://datatracker.ietf.org/doc/draft-ietf-oauth-identity-assertion-authz-grant/\u003e\n\n\n\n---\n\n\n# デメリット・注意点（正直ベース）\n\n\u003e Better Auth は強力だが万能ではない。弱点の多くは「新しい OSS であること」と「自前ホストであること」から来る。導入判断のために、ここでは欠点を誇張も矮小化もせず正直に並べる。\n\n### 🎤 登壇メモ\n\n- **つかみ**: 「いいことばかり並べる発表」は信用されない。だからこそ最後の章で正直に弱点へ踏み込む\n- **強調**: 正直さが信頼を生む——弱点を隠さず語ることが、むしろ技術選定全体の説得力になる\n- **10分なら**: デメリットは「歴史が浅い」と「自前ホストの運用責任」の2つに絞り、残りは口頭で軽く触れる\n\n技術選定は強みだけ見て決めると後で痛い。以下は本番採用前に必ず評価しておきたい論点を、影響の大きい順に並べたものだ。\n\n---\n\n## 主要な注意点\n\n### 1. 歴史が浅い\n\nv1 はリリースされたものの、Clerk や Auth0 と比べるとエンタープライズでの採用実績はまだ薄い。**SOC2** などのコンプライアンス認証や、有償サポート・SLA といった体制もこれから整っていく段階だ。金融・医療のような規制業界では、監査や調達の要件を満たせるかを早めに評価しておく必要がある。\n\n→ 競合との実績比較は [§00 比較](00-introduction.html) を参照。\n\n### 2. 破壊的変更リスク\n\n進化が速いぶん、本体やプラグインの API が予告なく動くことがある。本番運用では追従コストを織り込み、依存バージョンを固定する戦略（`package.json` でのピン留めや lockfile 厳守）が前提になる。アップデート時は CHANGELOG を読み、検証環境で先に試す運用フローを用意しておきたい。\n\n→ 成熟度の前提は [§00 比較](00-introduction.html) を参照。\n\n### 3. 自前ホスト = 運用責任は自分持ち\n\nメール配信・スケール・セキュリティパッチの適用は、すべて自分の責任範囲になる。「全部おまかせ」でインフラを意識せずに済む Clerk とは、そもそも別物だと理解しておく必要がある。ただしこれは裏返せば、**自由**と**データ所有**を手に入れているということでもある。\n\n→ 運用の重さを和らげる有料代替は [§06 Infrastructure](06-infrastructure.html) を参照。\n\n### 4. プラグイン追従の手間\n\nプラグインを追加するたびに、CLI の `generate` と `migrate` を再実行する必要がある。複数プラグインの組み合わせや読み込み**順序**でハマることがあり、エラーメッセージだけでは原因が見えにくいケースもある。導入時はプラグインを一つずつ足して、都度マイグレーションを確認するのが安全だ。\n\n→ プラグインの仕組みと追加手順は [§03 プラグイン](03-plugins.html) を参照。\n\n### 5. Infrastructure（有料）依存の芽\n\n運用の一部を有料層（マネージドな Infrastructure）に寄せていくと、そこにロックインの芽が生まれる。便利だからと寄せすぎると、「自前ホストだから自由」という当初の利点が薄れていく。**コアは自前**で持ちつつ、どこまでを有料に委ねるかのバランスを設計段階で決めておきたい。\n\n---\n\n## 小さめの注意点\n\n### 6. コミュニティプラグインの品質ばらつき\n\nエコシステムのプラグイン数は多いが、玉石混交なのが実情だ。本番に採用するものは、メンテ状況・実装の中身・依存関係を自分の目で確認してから入れるべきだ。\n\n### 7. TS/Node・RDB 前提が強い\n\n設計の中心が TypeScript / Node と RDB に置かれており、非 TS 環境や NoSQL は一級市民ではない。MongoDB アダプタなどの選択肢はあるが、スタックが大きく外れる場合は別の認証基盤も併せて比較したほうがよい。\n\n→ 対応 DB とアダプタの前提は [§05 データベース](05-database.html) を参照。\n\n---\n\n## 競合との位置づけ\n\n| 観点 | Better Auth | Clerk / Auth0 |\n|---|---|---|\n| データ所有 | 自前（強み） | ベンダー側 |\n| 運用責任 | 自分持ち（弱み） | おまかせ |\n| エンタープライズ実績 | これから | 豊富 |\n| 型安全・網羅性 | 強み | 限定的 |\n\n---\n\n\u003e 弱点の多くは「新しい OSS であること」と「自前ホストであること」の裏返しにすぎない。**データ所有**・**型安全**・**網羅性**・**AI ネイティブ**という強みが、これらのコストを上回るかどうか——その一点で判断すればよい。\n";</script>

      if (/^(\s*)([-*]|\d+\.)\s+/.test(line)) {
        var items = [];
        while (i < lines.length && /^(\s*)([-*]|\d+\.)\s+/.test(lines[i])) {
          var m = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
          items.push({ indent: m[1].length, ordered: /\d/.test(m[2]), num: parseInt(m[2], 10), text: m[3] });
          i++;
        }
        out.push(buildList(items));
        continue;
      }

      var pbuf = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) &&
             !/^(#{1,6})\s/.test(lines[i]) && !/^```/.test(lines[i]) &&
             !/^>\s?/.test(lines[i]) && !/^---+\s*$/.test(lines[i]) &&
             !/^(\s*)([-*]|\d+\.)\s+/.test(lines[i]) &&
             !(lines[i].indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1]))) {
        pbuf.push(lines[i]); i++;
      }
      out.push("<p>" + inline(esc(pbuf.join(" "))) + "</p>");
    }
    return out.join("\n");
  }

  function buildList(items) {
    var ordered = items[0].ordered;
    var tag = ordered ? "ol" : "ul";
    var start = ordered && items[0].num !== 1 ? ' start="' + items[0].num + '"' : "";
    var html = "<" + tag + start + ">";
    var n = 0;
    while (n < items.length) {
      var it = items[n];
      var li = "<li>" + inline(esc(it.text));
      var children = [];
      var k = n + 1;
      while (k < items.length && items[k].indent > it.indent) { children.push(items[k]); k++; }
      if (children.length) li += buildList(children);
      li += "</li>";
      html += li;
      n = k;
    }
    html += "</" + tag + ">";
    return html;
  }

  var viewRead = document.getElementById("view-read");
  if (viewRead) viewRead.innerHTML = render(src);
  var rawEl = document.getElementById("raw");
  if (rawEl) rawEl.textContent = src;

  var tabRead = document.getElementById("tab-read");
  var tabRaw = document.getElementById("tab-raw");
  var viewRaw = document.getElementById("view-raw");
  function select(which) {
    var read = which === "read";
    if (tabRead) tabRead.setAttribute("aria-selected", read ? "true" : "false");
    if (tabRaw) tabRaw.setAttribute("aria-selected", read ? "false" : "true");
    if (viewRead) viewRead.hidden = !read;
    if (viewRaw) viewRaw.hidden = read;
  }
  if (tabRead) tabRead.addEventListener("click", function () { select("read"); });
  if (tabRaw) tabRaw.addEventListener("click", function () { select("raw"); });

  var copyBtn = document.getElementById("copy");
  if (copyBtn) copyBtn.addEventListener("click", function () {
    var btn = this;
    navigator.clipboard.writeText(src).then(function () {
      var prev = btn.textContent;
      btn.textContent = "コピーしました ✓";
      setTimeout(function () { btn.textContent = prev; }, 1500);
    });
  });
})();
</script>
