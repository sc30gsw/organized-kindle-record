<script>var SRC="# Introduction — Better Auth とは / 比較 / Auth.js 合流\n\n\u003e Better Auth は「自分のサーバー・自分の DB で動く」TypeScript 製のオープンソース認証ライブラリ。本章ではその立ち位置を、丸ごとホスト型 SaaS との対比、競合との比較表、そして 2025 年の Auth.js 合流という業界ニュースから整理する。\n\n---\n\n### 🎤 登壇メモ\n\n- **つかみ**: 「あなたが今使っている NextAuth / Auth.js、その進化の主役はもう Better Auth に移りつつある」— ニュースから入る。\n- **強調**: 二択の本質は **「データを誰が持つか」**。SaaS（Clerk/Auth0）は預ける、Better Auth は **自分の DB に持つ**。\n- **10分なら**: 比較表は全部読まない。**Clerk（SaaS代表）と Auth.js（OSS前任）の2社だけ**を引き合いに出して先へ。\n- この章は導入。機能の網羅は（→ [§03 プラグイン大全](03-plugins.html)）、山場の AI は（→ [§07 AI Resources](07-ai-resources.html)）、弱点は（→ [§08 デメリット](08-cons.html)）で扱う。\n\n---\n\n## 二層構造で捉える: ホスト型 SaaS か、自前ライブラリか\n\n```text\n  ┌──────────────── 丸ごとホスト型 SaaS ────────────────┐\n  │  Clerk / Auth0 / Cognito / Firebase Auth            │\n  │  ・認証画面もユーザー DB も「相手のサーバー」         │\n  │  ・楽。が、データを預ける／ロックイン／従量課金       │\n  └─────────────────────────────────────────────────────┘\n                          vs\n  ┌──────────────── 自前ホスト型ライブラリ ──────────────┐\n  │  Better Auth / Auth.js / Lucia                       │\n  │  ・コードとして自分のアプリに同梱                     │\n  │  ・ユーザー & セッションは【自分の DB】               │\n  │  ・自由・低コスト・データ所有。運用責任は自分          │\n  └─────────────────────────────────────────────────────┘\n```\n\n\u003e 一言: **「運用知能を買う」か「コードを持つ」か。** Better Auth は後者で、必要なら運用層だけ別売り（→ [§06 Infrastructure](06-infrastructure.html)）で買い足せる。\n\n---\n\n## Better Auth とは何か\n\n**Better Auth** は、TypeScript 向けの **framework-agnostic（フレームワーク非依存）** な認証・認可フレームワークである。Next.js / React / Vue / SvelteKit / Nuxt / Astro / Hono など、特定のフレームワークに縛られず動作する。\n\n公式の定義はこうだ。\n\n\u003e Better Auth is a framework-agnostic, universal authentication and authorization framework for TypeScript. It provides a comprehensive set of features out of the box and includes a plugin ecosystem that simplifies adding advanced functionalities.\n\n要点を日本語で噛み砕くと:\n\n- **自前ホスト（self-hosted）**: 認証ロジックは自分のサーバー上で動き、ユーザー・セッションのデータは自分の DB（PostgreSQL / MySQL / SQLite など）に保存される。外部の認証 SaaS に依存しない。\n- **comprehensive な標準機能**: email & password、OAuth ソーシャルログイン、セッション管理などを箱から出してすぐ使える。\n- **plugin ecosystem**: 2FA、passkey（WebAuthn）、multi-tenancy（organization）、multi-session、SSO（SAML / OIDC）、自前 IDP 構築といった高度な機能をプラグインで追加できる。「車輪の再発明」をせずアプリ本体の開発に集中できる、という思想。\n- **MIT ライセンスの OSS**: 無料で、用途に制限がない。\n\n### 最小コード例\n\nサーバー側で `betterAuth({...})` を呼ぶだけで、認証のコア（ルートハンドラ・DB スキーマ・API）が立ち上がる。以下は email & password と GitHub ソーシャルログインを有効化した最小構成。\n\n```ts\nimport { betterAuth } from \"better-auth\";\nimport { drizzleAdapter } from \"better-auth/adapters/drizzle\";\nimport { db } from \"./db\";\n\nexport const auth = betterAuth({\n  database: drizzleAdapter(db, { provider: \"pg\" }),\n  emailAndPassword: { enabled: true },\n  socialProviders: {\n    github: {\n      clientId: process.env.GITHUB_CLIENT_ID,\n      clientSecret: process.env.GITHUB_CLIENT_SECRET,\n    },\n  },\n});\n```\n\nクライアント側は `createAuthClient()` を呼ぶだけで、型付きの `signIn` / `signUp` / `useSession` などが手に入る。サーバーの設定から型が推論されるため、エンドポイントとクライアント呼び出しが TypeScript で一気通貫に型安全になる。\n\n```ts\nimport { createAuthClient } from \"better-auth/react\";\n\nexport const authClient = createAuthClient();\n\n// 使い方の例\nawait authClient.signIn.email({ email, password });\nconst { data: session } = authClient.useSession();\n```\n\n\u003e ポイント: 設定は「ダッシュボードの GUI」ではなく **コード（auth.ts）** に集約される。Git で差分が追え、レビューでき、環境ごとに再現できる。これが SaaS 型との最大の体験差になる。\n\n---\n\n## 認証の2流派 — ホスト型 SaaS vs 自前ホスト型ライブラリ\n\n認証の実装方式は、大きく2つの流派に分けられる。どちらが「正解」ということはなく、**データ所有・自由・運用責任のトレードオフ**をどう取るかの選択である。\n\n### 1. 丸ごとホスト型 SaaS（Managed / Hosted）\n\n代表例: **Auth0**、**Clerk**、**Amazon Cognito**、**Firebase Authentication**、**Kinde**、**WorkOS**。\n\n- ユーザーレコード・セッションストア・署名鍵（signing keys）は **ベンダー側のインフラ**に置かれる。\n- プリビルトの UI、SDK、ダッシュボードが揃い、**立ち上げが速い**。\n- 運用（可用性・スケール・パッチ）はベンダー任せ。自分でサーバーを持たなくてよい。\n- 反面、**データを自分で持てない**、料金が MAU（月間アクティブユーザー）従量で青天井になりがち、そして **vendor lock-in**（移行困難）のリスクを負う。\n\n\u003e Clerk の評価として、ある比較記事はこう端的に述べている。「セットアップは最速だが、その代償としてセッションストア・ユーザーレコード・署名鍵を自分では所有できない（you do not own the session store, the user records, or the signing keys）」。\n\n### 2. 自前ホスト型ライブラリ（Self-hosted Library）\n\n代表例: **Better Auth**、**Auth.js（旧 NextAuth）**、**Lucia**。\n\n- 認証ロジックは自分のアプリ／サーバーで動き、データは **自分の DB** に入る。\n- **完全なデータ所有**と、認証フローの細部までの **full control** が得られる。セッションの即時失効（immediate revocation）も自分で制御できる。\n- 設定はコードに集約され、再現性・監査性が高い。\n- 反面、**運用責任は自分持ち**。「フルオーナーシップ、フルレスポンシビリティ（Full ownership, full responsibility）」というトレードオフになる。\n\nこの2流派の違いを一言でいえば、**「速さと無手間（SaaS）」を取るか、「所有と自由（ライブラリ）」を取るか**。Better Auth は後者に属しつつ、SaaS 並みの機能網羅と型安全性で「自前ホストの不便さ」を埋めにいくプロダクトだと位置づけられる。\n\n---\n\n## ニュース — Auth.js（旧 NextAuth）が Better Auth に合流\n\n2025 年、認証ライブラリ界に大きな動きがあった。**Auth.js（旧 NextAuth.js）が Better Auth に合流（join）した**というアナウンスである。\n\nBetter Auth 公式ブログ「Auth.js is now part of Better Auth」では、Auth.js のコアメンテナ陣（lead maintainer の Balázs Orbán、Thang Vu、Nico Domino、Lluis Agusti、Falco Winkler）への謝辞とともに、両プロジェクトが一つになってエコシステムを前進させる旨が語られている。\n\n\u003e Better Auth beginning was inspired by Auth.js, and now, together, the two projects can carry the ecosystem further. The end goal remains unchanged: you should own your auth!\n\n（Better Auth はそもそも Auth.js に着想を得て始まった。いま両者が一つになり、ゴールは変わらず「自分の認証は自分で所有すべき（you should own your auth）」だ、という主旨。）\n\nこの文脈で重要なのが **公式移行ガイド**の存在だ。Better Auth は、主要な認証サービス／ライブラリからの移行手順を公式ドキュメントとして提供している（いずれも実在する）。\n\n- **Auth0 → Better Auth**\n- **Clerk → Better Auth**\n- **Auth.js（next-auth）→ Better Auth**\n- **Supabase Auth → Better Auth**\n- **WorkOS → Better Auth**\n\nAuth.js からの移行ガイド冒頭は、過度な煽りをせず誠実な姿勢を示している。\n\n\u003e Since these projects have different design philosophies, the migration requires careful planning and work. If your current setup is working well, there's no urgent need to migrate. We continue to handle security patches and critical issues for Auth.js.\n\n（設計思想が異なるため移行には計画と作業が要る。いまの構成が問題なく動いているなら急いで移行する必要はない。Auth.js のセキュリティパッチと重大問題の対応は継続する、という内容。）\n\nつまり「NextAuth はもう終わり」という話ではなく、**新規プロジェクトの推奨先が Better Auth に移り、既存ユーザーには地続きの移行パスが用意された**、というのが実態である。実際、ある独立系の比較記事も「Auth.js v5 は既存コードベースの移行時にのみ妥当で、そのメンテナ自身が新規プロジェクトには Better Auth を勧めている」と要約している。\n\n---\n\n## 比較表 — Better Auth と主要プロダクト\n\n下表は 2026 年 6 月時点での、各プロダクトの大まかな性格づけ（snapshot）。記号は `◎`=非常に強い / `○`=対応十分 / `△`=限定的 / `—`=該当なし。料金・機能は各社の変更が早いため、最終確認は一次情報で行うこと。\n\n| プロダクト | 形態 | データ所有 | 型安全(TS) | 機能網羅 | UI提供 | 料金 | AI/エージェント対応 | エンプラ実績 |\n|---|---|---|---|---|---|---|---|---|\n| Better Auth | 自前ホスト型ライブラリ(OSS/MIT) | 完全(自分のDB) | ◎ 設計から型推論 | ◎ 2FA/passkey/SSO/organization等をplugin | なし(ヘッドレス、UIは自作/コミュニティ) | 無料(OSS) | ◎ Agent Auth plugin等で対応を明示 | 新興・2026年も機能拡張中 |\n| Clerk | ホスト型SaaS | ベンダー側 | ○ SDK経由 | ○〜◎ | ◎ プリビルトUI/コンポーネント | MAU従量(無料枠あり) | △ 部分的 | あり |\n| Kinde | ホスト型SaaS | ベンダー側 | ○ SDK経由 | ○ | ◎ ホスト型ログインUI | MAU従量(無料枠あり) | △ 限定的 | 中堅 |\n| Auth0 | ホスト型SaaS(Okta傘下) | ベンダー側 | ○ SDK経由 | ◎ | ◎ Universal Login | MAU従量(規模拡大で高額化) | △ 限定的 | 豊富(事実上の業界標準) |\n| Auth.js (NextAuth) | 自前ホスト型ライブラリ(OSS) | 完全 | △〜○ | △ コア中心で薄め | 最小限 | 無料 | — | 実績あり・新規はBetter Auth推奨 |\n| Lucia | (旧)ライブラリ→現在は学習リソース | 完全 | ○ | 最小(自前実装が前提) | なし | 無料 | — | — (v3は2025/3に非推奨化) |\n| Supabase Auth | BaaS付属(GoTrue/セルフホスト可) | 自Supabase内(セルフホスト可) | ○ SDK経由 | ○ | ○ Auth UIコンポーネント | Supabase従量(無料枠あり) | △ 限定的 | 成長中 |\n\n補足:\n\n- **Better Auth** は「ヘッドレス」設計で UI を同梱しない。ログイン画面などは自作するか、コミュニティ製の UI を組み合わせる。型安全・機能網羅・データ所有が強み。\n- **Auth.js（NextAuth）** は OSS・データ所有という点で Better Auth と同じ流派だが、機能はコアに寄っており拡張は薄め。上記の通り合流の流れにある。\n- **Lucia** は v3 が 2025 年 3 月に非推奨化され、現在は「DB とフレームワークで認証を自前実装するための **学習リソース**」へと方針転換した。ライブラリとして新規採用する対象ではない。\n- **Supabase Auth** は BaaS（Supabase）に付属する認証（GoTrue ベース）。Supabase を使うなら統合が楽で、セルフホストの選択肢もある。\n- 独立系の比較記事による意思決定の目安: 「データを自社インフラに置く必要があり、かつ認証インフラを運用できるなら **Better Auth**。50K MAU 未満の B2C で本番投入の速さ最優先なら **Clerk**。エンタープライズ SSO が要件なら **WorkOS**」。\n- 表の「新興・エンプラ実績」「機能拡張中（=破壊的変更の可能性）」は裏を返せばコストでもある。トレードオフの詳細は（→ [§08 デメリット・注意点](08-cons.html)）で正直に扱う。\n\n---\n\n## まとめ\n\n- **Better Auth** = TypeScript 製・OSS（MIT）の **自前ホスト型** 認証フレームワーク。`betterAuth({...})` だけでコアが立ち上がり、データは自分の DB に残る。\n- 認証には **ホスト型 SaaS** と **自前ホスト型ライブラリ** の2流派があり、トレードオフは「速さ／無手間」対「所有／自由／運用責任」。\n- 2025 年に **Auth.js が Better Auth へ合流**。公式移行ガイドが Auth0 / Clerk / Auth.js / Supabase Auth / WorkOS から提供され、自前ホスト陣営の事実上の標準になりつつある。\n- 比較では、Better Auth は **型安全・機能網羅・データ所有** で抜けつつ、UI 同梱なし（ヘッドレス）と運用責任が自分持ちという点が SaaS との分かれ目になる。\n\n---\n\n## 一次情報 URL\n\n- Better Auth 公式 Introduction — \u003chttps://www.better-auth.com/docs/introduction\u003e\n- Better Auth 公式 Comparison — \u003chttps://www.better-auth.com/docs/comparison\u003e\n- Auth.js（next-auth）からの移行ガイド — \u003chttps://www.better-auth.com/docs/guides/next-auth-migration-guide\u003e\n- Auth0 からの移行ガイド — \u003chttps://www.better-auth.com/docs/guides/auth0-migration-guide\u003e\n- Clerk からの移行ガイド — \u003chttps://www.better-auth.com/docs/guides/clerk-migration-guide\u003e\n- Supabase Auth からの移行ガイド — \u003chttps://www.better-auth.com/docs/guides/supabase-migration-guide\u003e\n- WorkOS からの移行ガイド — \u003chttps://www.better-auth.com/docs/guides/workos-migration-guide\u003e\n- ブログ「Auth.js is now part of Better Auth」 — \u003chttps://www.better-auth.com/blog/authjs-joins-better-auth\u003e\n- Auth.js チーム側のアナウンス（GitHub Discussion） — \u003chttps://github.com/nextauthjs/next-auth/discussions/13252\u003e\n- Better Auth GitHub リポジトリ（MIT ライセンス） — \u003chttps://github.com/better-auth/better-auth\u003e\n- Lucia 非推奨化アナウンス（学習リソースへ転換） — \u003chttps://github.com/lucia-auth/lucia/discussions/1714\u003e\n- 参考: 独立系比較記事「Best auth library for Next.js (2026)」(LogRocket) — \u003chttps://blog.logrocket.com/best-auth-library-nextjs-2026/\u003e\n\n\n\n---\n\n\n# コンセプト — コア構成要素\n\n\u003e Better Auth は「サーバーの `auth` インスタンス + クライアントの `authClient`」を中心に、API・CLI・Database アダプタ・Email・Plugins・OAuth・Cookies・Hooks・Session・Rate limit・User/Account・型推論という構成要素が噛み合って成り立つ。本章ではそれぞれを「何であるか／どう設定するか／どこにフックできるか」の観点で、コード例つきで詳細に解説する。\n\n---\n\n### 🎤 登壇メモ\n\n- **つかみ**: 「Better Auth は “薄いコア＋プラグイン” の二層。この地図さえ掴めば、後の章は全部ここに刺さる」。\n- **強調**: コアは常駐（session/cookie/user/account/rate limit）、機能はプラグインで足す——という**二層構造**が一番の勘所。\n- **10分なら**: 構成要素の表をさっと見せ、**Session と Plugin の2つだけ**口頭で補足して先へ。各論は深入りしない。\n- リンク先: 機能を足す仕組みは（→ [§03 プラグイン大全](03-plugins.html)）、ソーシャルログインは（→ [§02 認証](02-authentication.html)）、CLI/MCP は（→ [§07 AI Resources](07-ai-resources.html)）、DB アダプタは（→ [§05 Database](05-database.html)）。\n\n---\n\nすべての出発点は `betterAuth(options)` が返す **`auth` インスタンス**である。`auth` は以下を内包する。\n\n- `auth.handler` — `/api/auth/*` を処理する Web 標準の `(req: Request) =\u003e Promise\u003cResponse\u003e` ハンドラ。\n- `auth.api` — 全エンドポイントをサーバー側から型安全に呼ぶための関数群。\n- `auth.$Infer` — `Session` / `User` などの型を推論するための型専用名前空間。\n- `auth.options` — 正規化済みの設定。\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\n\nexport const auth = betterAuth({\n  emailAndPassword: { enabled: true },\n  socialProviders: {\n    google: {\n      clientId: process.env.GOOGLE_CLIENT_ID!,\n      clientSecret: process.env.GOOGLE_CLIENT_SECRET!,\n    },\n  },\n});\n```\n\n#### 全体像（コア＋プラグインの二層構造）\n\n```text\nServer: auth = betterAuth(options)\n┌────────────────────────────────────────────────────────────\n│ Plugins 層 (任意・着脱可)\n│   twoFactor / organization / genericOAuth / passkey / ...\n│   → endpoints・schema・hooks・rateLimit ルールを「足す」\n├────────────────────────────────────────────────────────────\n│ Core 層 (常に存在)\n│   emailAndPassword・socialProviders・session・cookies\n│   rateLimit・user / account・email\n├────────────────────────────────────────────────────────────\n│ Database アダプタ\n│   Kysely(組込) / Prisma / Drizzle / MongoDB\n└────────────────────────────────────────────────────────────\n        │  auth.handler を /api/auth/* にマウント\n        ▼\nClient: createAuthClient(better-auth/react | vue | svelte | solid | client)\n│   + 対のクライアントプラグイン (better-auth/client/plugins)\n│   → authClient.signIn / signUp / useSession / twoFactor.* ...\n└────────────────────────────────────────────────────────────\n```\n\n---\n\n### API\n\nBetter Auth の機能はすべて **エンドポイント** として公開される。エンドポイントは 2 つの経路から呼べる。\n\n1. **HTTP 経由**（クライアントやブラウザから）— `auth.handler` を `/api/auth/*` にマウントする。\n2. **サーバー内部から直接** — `auth.api.*` を関数として呼ぶ。HTTP を経由しないため高速で、サーバーコンポーネントや Server Function、別の API ルートから利用する。\n\n`auth.api` は「`auth` インスタンスに存在するすべてのエンドポイント」を関数として露出する。引数は `{ body, headers, query, params }` の形を取り、**戻り値は既定でパース済みのデータオブジェクト**（`Response` ではない）。\n\n```ts\n// サーバー側でセッションを取得する\nimport { auth } from \"~/auth\";\nimport { headers } from \"next/headers\";\n\nconst session = await auth.api.getSession({\n  headers: await headers(), // 一部のendpointはheadersを要求する\n});\n\n// サインアップも内部呼び出しできる\nconst res = await auth.api.signUpEmail({\n  body: { email: \"test@example.com\", password: \"password1234\", name: \"Taro\" },\n});\n```\n\n#### Response / Headers の取得\n\nデータではなく生の `Response` が欲しい場合は `asResponse: true`、`Set-Cookie` などのレスポンスヘッダが欲しい場合は `returnHeaders: true` を渡す。\n\n```ts\n// 生のResponseが欲しい(handlerに転送したい)場合\nconst response = await auth.api.signInEmail({\n  body: { email, password },\n  asResponse: true,\n});\n\n// セッションCookieを自前のResponseに載せ替えたい場合\nconst { headers, response } = await auth.api.signInEmail({\n  body: { email, password },\n  returnHeaders: true,\n});\nconst setCookie = headers.get(\"set-cookie\");\n```\n\n#### route handler への接続\n\nHTTP 経由で使う場合、各フレームワークのキャッチオールルートに `auth.handler` をマウントする。`basePath` の既定は `/api/auth`。\n\n```ts\n// Next.js App Router: app/api/auth/[...all]/route.ts\nimport { auth } from \"~/auth\";\nimport { toNextJsHandler } from \"better-auth/next-js\";\n\nexport const { GET, POST } = toNextJsHandler(auth.handler);\n```\n\n```ts\n// Node/Express など: toNodeHandler を使う\nimport { auth } from \"~/auth\";\nimport { toNodeHandler } from \"better-auth/node\";\n\napp.all(\"/api/auth/*\", toNodeHandler(auth));\n// 注意: Express では express.json() より前にマウントする(bodyを奪われないため)\n```\n\n\u003e エラーハンドリング: `auth.api.*` は失敗時に `APIError` を throw する。HTTP 経由（`authClient`）では throw せず `{ data, error }` を返す、という非対称性に注意。\n\n---\n\n### CLI\n\n`@better-auth/cli` はスキーマ生成・マイグレーション・初期化・診断を行う公式 CLI で、**プロジェクト初期から存在する**。設定ファイル（`auth.ts` など）を読み取り、登録済みプラグインも含めた必要スキーマを算出する。\n\n| コマンド | 役割 |\n|---|---|\n| `generate` | アダプタに応じたスキーマ/マイグレーションファイルを生成する |\n| `migrate` | スキーマを DB に直接適用する（**Kysely 組み込みアダプタ限定**） |\n| `init` | プロジェクトに Better Auth を初期セットアップする |\n| `secret` | `BETTER_AUTH_SECRET` 用のランダムキーを生成する |\n| `info` | 環境・設定の診断情報を出力する（issue 報告用） |\n| `mcp` | エディタ向けの MCP サーバー設定を書き出す |\n\n```bash\n# Prisma/Drizzle なら ORM スキーマ、Kysely なら SQL を生成\nnpx @better-auth/cli@latest generate\n\n# Kysely 組み込みアダプタの場合のみ DB に直接適用できる\nnpx @better-auth/cli@latest migrate\n\n# 初期化(npx auth@latest init でも可)\nnpx @better-auth/cli@latest init\n\n# 秘密鍵の生成\nnpx @better-auth/cli@latest secret\n```\n\n#### MCP セットアップ\n\nエディタの AI に Better Auth の文脈を渡すための MCP 設定を生成する。Cursor 向けは次のとおり。\n\n```bash\nnpx @better-auth/cli mcp --cursor\n```\n\n\u003e `generate` と `migrate` の違い: **Prisma / Drizzle / MongoDB など外部 ORM では `migrate` は使えない**。`generate` でスキーマを出力し、その ORM 自身のマイグレーションツール（`prisma migrate` など）で適用する。`migrate` が使えるのは内部 Kysely アダプタ（`pg` / `mysql2` / `better-sqlite3` 直結）のときだけ。\n\n#### 主なオプション\n\n- `--config` — 設定ファイルのパスを明示する（自動検出に失敗するとき）。\n- `--output` — 生成物の出力先を指定する。\n- `--yes` — 対話プロンプトをスキップする。\n\n---\n\n### Client\n\nBetter Auth はフロントエンド各種フレームワーク向けのクライアントライブラリを提供する。**インポートパスでフレームワークを切り替える**のがポイント。\n\n| import パス | 対象 |\n|---|---|\n| `better-auth/react` | React（`useSession` は hook） |\n| `better-auth/vue` | Vue（リアクティブな ref/store） |\n| `better-auth/svelte` | Svelte（store） |\n| `better-auth/solid` | Solid（signal） |\n| `better-auth/client` | フレームワーク非依存（vanilla） |\n\n```ts\n// lib/auth-client.ts (React)\nimport { createAuthClient } from \"better-auth/react\";\n\nexport const authClient = createAuthClient({\n  baseURL: \"http://localhost:3000\", // auth サーバーのベース URL\n});\n```\n\n#### 主要なクライアントメソッド\n\n```ts\n// サインアップ(email/password)。email と password と name が必須\nconst { data, error } = await authClient.signUp.email({\n  email: \"user@email.com\",\n  password: \"password\",\n  name: \"User\",\n});\n\n// サインイン(email/password)\nawait authClient.signIn.email({ email, password });\n\n// ソーシャルサインイン(OAuth リダイレクト開始)\nawait authClient.signIn.social({ provider: \"google\", callbackURL: \"/dashboard\" });\n\n// サインアウト\nawait authClient.signOut();\n```\n\nクライアント呼び出しは throw せず、`{ data, error }` を返す。`error.code` で分岐し、`getErrorMessage()` などで翻訳できる。\n\n#### セッションの参照\n\n```tsx\n// React: リアクティブに購読する hook\nimport { authClient } from \"~/lib/auth-client\";\n\nexport function UserButton() {\n  const { data: session, isPending, error } = authClient.useSession();\n  if (isPending) return \u003cspan\u003e...\u003c/span\u003e;\n  return \u003cspan\u003e{session?.user.name}\u003c/span\u003e;\n}\n```\n\n```ts\n// 一度だけ取得する(非リアクティブ)\nconst { data: session } = await authClient.getSession();\n```\n\n#### セッションの失効（複数デバイス管理）\n\n```ts\n// アクティブなセッション一覧\nconst { data: sessions } = await authClient.listSessions();\n\n// 特定のセッションを失効(token を指定)\nawait authClient.revokeSession({ token: sessions[0].token });\n\n// 現在のセッション以外をすべて失効(ログイン中端末の一括ログアウト)\nawait authClient.revokeOtherSessions();\n\n// すべてのセッションを失効\nawait authClient.revokeSessions();\n```\n\n\u003e `useSession` がリアクティブストア、`getSession` が単発フェッチ。React の場合 `useSession` は hook、Vue/Svelte/Solid ではそのフレームワークのリアクティブ・プリミティブを返す。\n\n---\n\n### Database\n\nBetter Auth は **アダプタ経由** で DB に接続する。ユーザー・セッション・アカウント・検証トークンなどを保存する。\n\n- **組み込み Kysely アダプタ** — `pg` / `mysql2` / `better-sqlite3` の接続インスタンス、または Kysely Dialect を `database` に渡すと、内部で Kysely を使って直接 SQL を発行する。`migrate` が使えるのはこのモードのみ。\n- **ORM アダプタ** — `prismaAdapter` / `drizzleAdapter` / `mongodbAdapter` など。ORM 側のクライアントを渡し、スキーマは `generate` で出力する。\n\n```ts\n// 組み込み Kysely(pg を直接渡す)\nimport { betterAuth } from \"better-auth\";\nimport { Pool } from \"pg\";\n\nexport const auth = betterAuth({\n  database: new Pool({ connectionString: process.env.DATABASE_URL }),\n});\n```\n\n```ts\n// Prisma アダプタ\nimport { betterAuth } from \"better-auth\";\nimport { prismaAdapter } from \"better-auth/adapters/prisma\";\nimport { PrismaClient } from \"@prisma/client\";\n\nconst prisma = new PrismaClient();\nexport const auth = betterAuth({\n  database: prismaAdapter(prisma, { provider: \"postgresql\" }),\n});\n```\n\n#### コアスキーマ\n\n既定で `user` / `session` / `account` / `verification` の 4 モデルを使う。プラグインは独自モデルを追加する（例: `twoFactor` は `twoFactor` テーブル）。\n\n#### `modelName` はテーブル名ではなく「アダプタのモデル名」\n\n重要な落とし穴: `modelName` / `fields` で名前をカスタマイズできるが、**`modelName` はアダプタが解決する「モデル名」であってテーブル名そのものではない**。Prisma のような ORM では `modelName` は Prisma モデル名にマッピングされ、実テーブル名は ORM 側の `@@map` などが決める。Kysely 直結のときは実テーブル名と一致する。\n\n```ts\nexport const auth = betterAuth({\n  user: {\n    modelName: \"users\", // アダプタのモデル名(ORM ではモデル名に解決)\n    fields: {\n      name: \"full_name\", // カラム名のリネーム\n      email: \"email_address\",\n    },\n  },\n  session: {\n    modelName: \"user_sessions\",\n    fields: { userId: \"user_id\" },\n  },\n});\n```\n\n---\n\n### Email / Mail\n\nEmail は認証方式を問わず Better Auth の中核要素。メール送信ロジックは**ユーザーが実装する**（送信手段は任意の SMTP/SaaS）。Better Auth は「いつ・どんな URL/トークンで送るか」を組み立てて渡す。\n\n#### メール検証（email verification）\n\n```ts\nexport const auth = betterAuth({\n  emailVerification: {\n    sendOnSignUp: true,          // サインアップ時に検証メールを送る\n    autoSignInAfterVerification: true, // 検証完了後に自動サインイン\n    sendVerificationEmail: async ({ user, url, token }, request) =\u003e {\n      await sendMail({\n        to: user.email,\n        subject: \"メールアドレスの確認\",\n        body: `次のリンクで確認してください: ${url}`,\n      });\n    },\n    afterEmailVerification: async (user, request) =\u003e {\n      // 検証成功後の副作用(プレミアム付与など)\n      console.log(`${user.email} verified`);\n    },\n  },\n});\n```\n\n- `sendVerificationEmail({ user, url, token }, request)` — 検証メール送信の実体。`url` をそのまま踏ませれば検証が完了する。\n- `sendOnSignUp: true` — サインアップ直後に検証メールを送る。\n- `sendOnSignIn: true` — 未検証ユーザーが email/password でサインインを試みたときに送る（`sendVerificationEmail` 実装が前提）。\n- `autoSignInAfterVerification: true` — 検証リンク踏破後に自動でセッションを張る。\n\n#### パスワードリセット\n\nリセットは `emailAndPassword` 側の `sendResetPassword` で送る。\n\n```ts\nexport const auth = betterAuth({\n  emailAndPassword: {\n    enabled: true,\n    revokeSessionsOnPasswordReset: true, // リセット時に既存セッションを失効\n    sendResetPassword: async ({ user, url, token }, request) =\u003e {\n      await sendMail({\n        to: user.email,\n        subject: \"パスワード再設定\",\n        body: `次のリンクから再設定してください: ${url}`,\n      });\n    },\n  },\n});\n```\n\n\u003e 検証メールは `emailVerification.sendVerificationEmail`、リセットメールは `emailAndPassword.sendResetPassword` と**設定の置き場所が異なる**点に注意。\n\n---\n\n### Plugins\n\nPlugins は Better Auth を拡張する中核機構。新しい認証方式・機能・振る舞いの上書きを差し込める。プラグインは **サーバー側プラグインとクライアント側プラグインのペア** で構成され、片方だけのものもある。\n\n- サーバー側 — `betterAuth({ plugins: [...] })` に登録。エンドポイント・スキーマ・hooks・rate limit ルールなどを追加する。\n- クライアント側 — `createAuthClient({ plugins: [...] })` に登録。対応するアクション・ストアを `authClient` に生やす。\n\n**専用インポートパスでツリーシェイク**: サーバー側プラグインは `better-auth/plugins` から、クライアント側プラグインは `better-auth/client/plugins` から import する。サーバー／クライアントでエントリポイントが分かれており、各エントリもツリーシェイク可能なので、実際に使うプラグインのコードだけがバンドルに含まれる（一部プラグインは `better-auth/plugins/\u003cname\u003e` 形式の深いサブパスも公開する。例: `better-auth/plugins/mcp/client`）。\n\n```ts\n// auth.ts (サーバー)\nimport { betterAuth } from \"better-auth\";\nimport { twoFactor } from \"better-auth/plugins\";\n\nexport const auth = betterAuth({\n  plugins: [twoFactor()],\n});\n```\n\n```ts\n// auth-client.ts (クライアント) — 対のプラグインを登録\nimport { createAuthClient } from \"better-auth/react\";\nimport { twoFactorClient } from \"better-auth/client/plugins\";\n\nexport const authClient = createAuthClient({\n  plugins: [twoFactorClient()],\n});\n// → authClient.twoFactor.* が型安全に生える\n```\n\n\u003e サーバーにプラグインを足したら、対応するクライアントプラグインも登録する。これによりクライアント側のメソッドと型が自動的に揃う。\n\n---\n\n### OAuth\n\nBetter Auth は OAuth 2.0 / OpenID Connect を組み込みでサポートする。経路は 2 つ。\n\n#### 1. socialProviders（組み込みプロバイダ）\n\nGoogle・GitHub・Facebook など主要プロバイダは `socialProviders` に `clientId` / `clientSecret` を渡すだけで使える。\n\n```ts\nexport const auth = betterAuth({\n  socialProviders: {\n    google: {\n      clientId: process.env.GOOGLE_CLIENT_ID!,\n      clientSecret: process.env.GOOGLE_CLIENT_SECRET!,\n      scope: [\"openid\", \"email\", \"profile\"],\n      mapProfileToUser: (profile) =\u003e ({ name: profile.name }),\n    },\n  },\n});\n```\n\n```ts\n// クライアントからサインイン開始(プロバイダへリダイレクト)\nawait authClient.signIn.social({ provider: \"google\", callbackURL: \"/dashboard\" });\n```\n\n#### 2. Generic OAuth（汎用プロバイダ）\n\n組み込みにないプロバイダは `genericOAuth` プラグインで OIDC/OAuth2 エンドポイントを手動指定して接続する。\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\nimport { genericOAuth } from \"better-auth/plugins\";\n\nexport const auth = betterAuth({\n  plugins: [\n    genericOAuth({\n      config: [\n        {\n          providerId: \"custom\",\n          clientId: process.env.CUSTOM_CLIENT_ID!,\n          clientSecret: process.env.CUSTOM_CLIENT_SECRET!,\n          discoveryUrl: \"https://example.com/.well-known/openid-configuration\",\n          scopes: [\"openid\", \"email\"],\n        },\n      ],\n    }),\n  ],\n});\n```\n\n```ts\n// auth-client.ts\nimport { genericOAuthClient } from \"better-auth/client/plugins\";\n// createAuthClient({ plugins: [genericOAuthClient()] })\n// → authClient.signIn.oauth2({ providerId: \"custom\" })\n```\n\n\u003e アカウント連携（同一ユーザーに複数プロバイダを紐付ける）の挙動は後述の **User + Account** の `accountLinking` で制御する。\n\n---\n\n### Cookies\n\nCookie はセッショントークン・セッションデータ・OAuth state などの格納に使われる。**すべての Cookie は `secret`（または `BETTER_AUTH_SECRET`）で署名される**。\n\n#### セッション Cookie とキャッシュ戦略\n\nセッション Cookie には毎リクエストで送られるトークンが入る。`session.cookieCache` を有効にすると、セッションデータを暗号化して Cookie 側にキャッシュし、毎回の DB アクセスを減らせる。`strategy` で表現方式を選ぶ。\n\n| strategy | 内容 |\n|---|---|\n| `compact` | 既定。コンパクトな署名付き表現 |\n| `jwt` | JWT 形式 |\n| `jwe` | 暗号化された JWE 形式 |\n\n```ts\nexport const auth = betterAuth({\n  session: {\n    cookieCache: {\n      enabled: true,\n      maxAge: 5 * 60,      // 5分間キャッシュ\n      strategy: \"compact\", // \"jwt\" / \"jwe\" も選べる\n    },\n  },\n});\n```\n\n#### セキュア Cookie とドメイン共有\n\n```ts\nexport const auth = betterAuth({\n  advanced: {\n    useSecureCookies: true, // Secure 属性を強制(本番では既定で有効)\n    crossSubDomainCookies: {\n      enabled: true,\n      domain: \"example.com\", // app.example.com と auth.example.com で共有\n    },\n    cookiePrefix: \"my-app\", // Cookie 名のプレフィックスをカスタム\n  },\n});\n```\n\n- `useSecureCookies` — `Secure` 属性を付けて HTTPS 限定にする。本番では既定で有効。\n- `crossSubDomainCookies` — サブドメイン間でセッション Cookie を共有する（`domain` 指定）。\n- `cookiePrefix` / `advanced.cookies` — Cookie 名や個別属性（`sameSite` など）をカスタマイズする。\n\n---\n\n### Hooks\n\nHooks は「フルプラグインを書かずに振る舞いを差し込む」ための仕組み。**2 種類**ある。\n\n#### 1. エンドポイント hooks（`hooks.before` / `hooks.after`）\n\nリクエスト処理の前後に割り込む。`before` / `after` はそれぞれ **1 つの `createAuthMiddleware`** を受け取り、その中で `ctx.path` を条件分岐して複数エンドポイントを扱う。\n\n```ts\nimport { betterAuth } from \"better-auth\";\nimport { createAuthMiddleware, APIError } from \"better-auth/api\";\n\nexport const auth = betterAuth({\n  hooks: {\n    // before: リクエストボディの書き換え・バリデーション・中断\n    before: createAuthMiddleware(async (ctx) =\u003e {\n      if (ctx.path === \"/sign-up/email\") {\n        if (!ctx.body?.email.endsWith(\"@example.com\")) {\n          throw new APIError(\"BAD_REQUEST\", { message: \"社内メールのみ許可\" });\n        }\n        return { context: { ...ctx, body: { ...ctx.body, name: \"Default\" } } };\n      }\n    }),\n    // after: レスポンス後の副作用。ctx.context.returned で結果を参照\n    after: createAuthMiddleware(async (ctx) =\u003e {\n      if (ctx.path.startsWith(\"/sign-in\")) {\n        const session = ctx.context.returned; // 返却済みの値\n        // 監査ログ送信などの background 処理\n      }\n    }),\n  },\n});\n```\n\n- `ctx.path` — エンドポイントのパス（`/sign-up/email` など）で分岐する。\n- `ctx.body` / `ctx.headers` / `ctx.query` — 入力。`before` で書き換えると後段に伝播する。\n- `ctx.context.returned` — `after` で参照できる「返却された値」。\n- `ctx.context.session` — 現在のセッション。\n- `throw new APIError(...)` — 任意の地点で処理を中断しエラーを返す。\n\n#### 2. データベース hooks（`databaseHooks`）\n\n`user` / `session` / `account` の各モデルに対し、DB レコードの `create` / `update` の `before` / `after` をフックする。\n\n```ts\nimport { betterAuth } from \"better-auth\";\nimport { APIError } from \"better-auth/api\";\n\nexport const auth = betterAuth({\n  databaseHooks: {\n    user: {\n      create: {\n        before: async (user, ctx) =\u003e {\n          if (user.isAgreedToTerms === false) {\n            throw new APIError(\"BAD_REQUEST\", { message: \"規約同意が必要です\" });\n          }\n          return { data: { ...user, role: \"user\" } }; // payload を差し替え\n        },\n        after: async (user, ctx) =\u003e {\n          // 作成後の副作用(ウェルカムメール等)\n        },\n      },\n    },\n  },\n});\n```\n\n\u003e `before` が `false` を返すと操作を中断、データオブジェクト（`{ data }`）を返すと元のペイロードを置き換える。`after` は作成/更新の成功後に呼ばれる。\n\n---\n\n### Session\n\nBetter Auth は**伝統的な Cookie ベースのセッション管理**を採る。セッションは Cookie に保存され、毎リクエストでサーバーへ送られる。\n\n#### 有効期限と更新\n\n- 既定で **7 日（`expiresIn`）** で失効する。\n- セッションが使われ、かつ `updateAge`（既定 1 日）に達すると、失効時刻が「現在 + `expiresIn`」へ更新される（ローリング有効期限）。\n\n```ts\nexport const auth = betterAuth({\n  session: {\n    expiresIn: 60 * 60 * 24 * 7, // 7 日\n    updateAge: 60 * 60 * 24,     // 1 日ごとに延長\n  },\n});\n```\n\n#### Secondary storage（Redis / KV）\n\nセッションやレート制限カウンタを Redis などの KV に逃がす。`get` / `set` / `delete` の 3 関数を実装する。\n\n```ts\nexport const auth = betterAuth({\n  secondaryStorage: {\n    get: async (key) =\u003e await redis.get(key),\n    set: async (key, value, ttl) =\u003e await redis.set(key, value, \"EX\", ttl),\n    delete: async (key) =\u003e await redis.del(key),\n  },\n});\n```\n\n- `session.storeSessionInDatabase` — secondary storage を使う場合でも、セッションを併せて主 DB にも保存するか。\n- `cookieCache` — 前述のとおりセッションデータを Cookie にキャッシュし、毎回の読み出しを省く（実質ステートレス運用にもできる）。\n\n```ts\n// 主 DB を持たず Redis + 短命 Cookie キャッシュで運用する例\nexport const auth = betterAuth({\n  secondaryStorage: { get: redisGet, set: redisSet, delete: redisDelete },\n  session: {\n    cookieCache: { maxAge: 5 * 60, refreshCache: false },\n  },\n});\n```\n\n#### セッション保存先の分岐\n\n```text\nセッションをどこに保存する?\n│\n├─ secondaryStorage を定義した?\n│   ├─ Yes → セッションは secondaryStorage (Redis / KV) に保存\n│   │         └─ storeSessionInDatabase: true なら 主DB にも併存させる\n│   └─ No  → セッションは 主データベース (session テーブル) に保存\n│\n└─ session.cookieCache を有効化した?\n    ├─ Yes → セッションデータを署名/暗号化して Cookie にキャッシュ\n    │         (毎リクエストの保存先参照を省略 = ほぼ stateless)\n    │         strategy: compact(既定) / jwt / jwe\n    └─ No  → 毎回 保存先 (主DB or secondaryStorage) を参照\n```\n\n\u003e ステートレス志向の構成では `cookieCache` を中心に据え、`secondaryStorage` で失効・revoke の整合を取る。完全ステートレスにすると即時 revoke が効きにくくなるトレードオフがある。\n\n---\n\n### Rate limit\n\nBetter Auth は組み込みのレートリミッタを持ち、**本番モードでは既定で有効**。\n\n- 既定: **window 60 秒 / max 100 リクエスト**。\n- ストレージは既定でメモリ。サーバーレスや複数インスタンスではメモリは不向きなので、DB か secondary storage に逃がす。\n\n```ts\nexport const auth = betterAuth({\n  rateLimit: {\n    enabled: true,\n    window: 60,  // 秒\n    max: 100,    // window 内の最大リクエスト数\n    storage: \"secondary-storage\", // \"memory\" | \"database\" | \"secondary-storage\"\n    customRules: {\n      \"/sign-in/email\": { window: 10, max: 3 }, // 厳しめの個別ルール\n      \"/two-factor/*\": async (request) =\u003e ({ window: 10, max: 3 }),\n    },\n  },\n});\n```\n\n- `storage` — `\"memory\"`（既定）/ `\"database\"` / `\"secondary-storage\"`。\n- `customRules` — パス単位で `{ window, max }` を上書き。関数を渡して動的算出も可能。\n- プラグインも独自ルールを定義する（例: `twoFactor` は `/two-factor/*` に専用のレート制限を持つ）。\n\n\u003e サーバーレス／水平スケール環境では `\"memory\"` だとインスタンスごとにカウンタが分裂する。`\"database\"` か `\"secondary-storage\"` を選ぶこと。\n\n---\n\n### User + Account\n\n認証だけでなくユーザー/アカウント管理 API も提供する。**1 人の `user` に複数の `account`（= 認証方式・プロバイダ）が紐付く**モデル。email/password 登録には **`email` と `name` が必須**。\n\n#### user の設定\n\n```ts\nexport const auth = betterAuth({\n  user: {\n    modelName: \"users\",                    // アダプタのモデル名\n    fields: { name: \"full_name\" },         // カラム名リネーム\n    additionalFields: {                    // スキーマ拡張\n      role: {\n        type: [\"user\", \"admin\"],\n        required: false,\n        defaultValue: \"user\",\n        input: false, // サインアップ時にユーザー入力を許可しない\n      },\n      lang: { type: \"string\", required: false, defaultValue: \"en\" },\n    },\n    changeEmail: {\n      enabled: true, // 既定は無効。有効化してメール変更を許可\n      sendChangeEmailVerification: async ({ user, newEmail, url, token }, request) =\u003e {\n        await sendMail({ to: user.email, subject: \"メール変更の確認\", body: url });\n      },\n    },\n    deleteUser: {\n      enabled: true,\n      sendDeleteAccountVerification: async ({ user, url, token }, request) =\u003e {\n        await sendMail({ to: user.email, subject: \"退会の確認\", body: url });\n      },\n    },\n  },\n});\n```\n\n- `additionalFields` — `type` / `required` / `defaultValue` / `input` を持つフィールド定義でスキーマを拡張する。`input: false` は「登録時にクライアントから渡させない」フィールド（`role` 等）に使う。\n- `changeEmail` — 既定で無効。`enabled: true` とし、検証メールを `sendChangeEmailVerification` で送る。\n- `deleteUser` — 退会フロー。検証付きで `sendDeleteAccountVerification` を送り、`authClient.deleteUser({ token })` で確定する。\n\n#### account の連携（accountLinking）\n\nアカウント連携は**既定で有効**で、プロバイダが email を verified として返せば、既存ユーザーに別のソーシャル/OAuth を紐付けられる。\n\n```ts\nexport const auth = betterAuth({\n  account: {\n    accountLinking: {\n      enabled: true,\n      trustedProviders: [\"google\", \"github\"], // 自動連携を信頼するプロバイダ\n      allowDifferentEmails: true,              // 異なる email でも連携を許可\n    },\n  },\n});\n```\n\n\u003e `trustedProviders` に含まれるプロバイダは email verified を信頼して自動連携する。`allowDifferentEmails: true` は「既存アカウントと別の email を返すプロバイダ」も連携対象にする（乗っ取りリスクとのトレードオフ）。\n\n---\n\n### 型安全（Type safety）\n\nBetter Auth はサーバー・クライアントとも TypeScript 製で、設定から型を推論する。`tsconfig.json` の `strict: true` を前提に最良の推論が効く。\n\n#### サーバー側: `$Infer`\n\n`auth.$Infer` から `Session`（`session` + `user`）などの型を取り出せる。`additionalFields` を足すと、その型にも自動で反映される。\n\n```ts\nimport { auth } from \"~/auth\";\n\ntype Session = typeof auth.$Infer.Session;\n// Session[\"user\"][\"role\"] のような追加フィールドも型に乗る\n```\n\n#### クライアント側: サーバー型をブリッジする\n\nクライアントに `additionalFields` を認識させるには、サーバーの `auth` 型を **`inferAdditionalFields\u003ctypeof auth\u003e()` プラグイン** 経由で渡す。これが「サーバー型（`typeof auth`）をクライアントへ橋渡しする」正攻法。\n\n```ts\n// auth-client.ts\nimport { createAuthClient } from \"better-auth/client\";\nimport { inferAdditionalFields } from \"better-auth/client/plugins\";\nimport type { auth } from \"~/auth\";\n\nexport const authClient = createAuthClient({\n  plugins: [inferAdditionalFields\u003ctypeof auth\u003e()],\n});\n// → authClient.useSession() の user に role / lang などが型付きで現れる\n```\n\n\u003e サーバーとクライアントが同一リポジトリなら `typeof auth` を直接渡せる。別リポジトリで `auth` 型を import できない場合は、`inferAdditionalFields({ user: { ... } })` のようにフィールド定義を手で渡す代替手段がある。プラグインのアクション/型も、クライアントに対応プラグインを登録することで自動的に推論される。\n\n---\n\n## 一次情報（参照元）\n\n- API — \u003chttps://www.better-auth.com/docs/concepts/api\u003e\n- CLI — \u003chttps://www.better-auth.com/docs/concepts/cli\u003e\n- Client — \u003chttps://www.better-auth.com/docs/concepts/client\u003e\n- Database — \u003chttps://www.better-auth.com/docs/concepts/database\u003e\n- Email — \u003chttps://www.better-auth.com/docs/concepts/email\u003e\n- Plugins — \u003chttps://www.better-auth.com/docs/concepts/plugins\u003e\n- OAuth — \u003chttps://www.better-auth.com/docs/concepts/oauth\u003e\n- Cookies — \u003chttps://www.better-auth.com/docs/concepts/cookies\u003e\n- Hooks — \u003chttps://www.better-auth.com/docs/concepts/hooks\u003e\n- Session Management — \u003chttps://www.better-auth.com/docs/concepts/session-management\u003e\n- Rate Limit — \u003chttps://www.better-auth.com/docs/concepts/rate-limit\u003e\n- User & Accounts — \u003chttps://www.better-auth.com/docs/concepts/users-accounts\u003e\n- TypeScript — \u003chttps://www.better-auth.com/docs/concepts/typescript\u003e\n\n\n\n---\n\n\n# 認証 — Email & Password と OAuth\n\n\u003e Better Auth の中核となる 2 つの認証方式を解説する。前半は **Email & Password**（有効化・メール検証・パスワードリセット・パスワードポリシー・ハッシュ方式のカスタム）、後半は **OAuth / ソーシャルログイン**（`socialProviders` 設定、対応プロバイダ一覧、そして任意の OAuth2/OIDC に接続できる **Generic OAuth プラグイン**）を扱う。コード例は `auth.ts`（サーバー）と `auth-client.ts`（クライアント）の 2 ファイル構成を前提とする。\n\n### 🎤 登壇メモ\n\n- **つかみ**: 「ログイン機能、毎回ゼロから作っていませんか？」— Email & Password と Google / LINE ログインが、設定ファイル数行で立ち上がる体験を冒頭に見せる。\n- **強調**: ① クライアント API が例外を投げず `{ data, error }` を返す設計、② メール列挙攻撃（user enumeration）対策がデフォルトで効く点、③ 組み込みに無いプロバイダでも Generic OAuth で「OAuth2 / OIDC なら何でも繋がる」拡張性。\n- **10分なら**: Email & Password の有効化 → `signIn.social` で LINE ログイン → Generic OAuth の `signIn.oauth2` の 3 点に絞る。メール検証・ハッシュ方式カスタム・全オプション表はスキップし「詳細はリファレンス参照」と口頭で誘導する。\n\n---\n\n## Email & Password\n\nメールアドレスとパスワードによる認証は最も一般的な方式であり、Better Auth は組み込みのオーセンティケータを提供する。データベースアダプタさえ設定されていれば、`emailAndPassword` を有効化するだけで使い始められる。\n\n### 有効化\n\nサーバー側 `auth.ts` の `betterAuth()` に `emailAndPassword: { enabled: true }` を渡す。これだけで `signUp.email` / `signIn.email` などのエンドポイントが有効になる。\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\n\nexport const auth = betterAuth({\n  emailAndPassword: {\n    enabled: true,\n  },\n});\n```\n\nクライアントは `createAuthClient` で生成する。以降のサインアップ・サインインはこの `authClient` 経由で呼び出す。\n\n```ts\n// auth-client.ts\nimport { createAuthClient } from \"better-auth/client\";\n\nexport const authClient = createAuthClient({\n  baseURL: \"http://localhost:3000\",\n});\n```\n\n### サインアップ / サインインのコード例\n\nサインアップは `authClient.signUp.email` を使う。`name` `email` `password` は必須で、`image` と `callbackURL` は任意。\n\n```ts\nconst { data, error } = await authClient.signUp.email({\n  name: \"John Doe\",\n  email: \"john.doe@example.com\",\n  password: \"password1234\",\n  image: \"https://example.com/image.png\", // 任意\n  callbackURL: \"https://example.com/callback\", // 任意（メール検証後のリダイレクト先）\n});\n```\n\nサインインは `authClient.signIn.email`。`rememberMe` を `false` にすると、ブラウザを閉じた時点でセッションを失効させられる。\n\n```ts\nconst { data, error } = await authClient.signIn.email({\n  email: \"john.doe@example.com\",\n  password: \"password1234\",\n  rememberMe: true, // 任意（既定: true）\n  callbackURL: \"/dashboard\", // 任意\n});\n```\n\n\u003e Better Auth のクライアント API は例外を投げず、`{ data, error }` のタプルを返す。`error` が `null` でなければ失敗として扱うこと。本プロジェクトの方針（`Result` ベース）とも親和性が高く、`error` を握りつぶさず分岐させる。\n\n### 主な設定オプション\n\n`emailAndPassword` に渡せる代表的なオプションは以下のとおり。\n\n| オプション | 型 | 既定値 | 説明 |\n|---|---|---|---|\n| `enabled` | `boolean` | `false` | Email & Password 認証を有効化する。 |\n| `disableSignUp` | `boolean` | `false` | サインアップのみを無効化する（招待制などで利用）。 |\n| `minPasswordLength` | `number` | `8` | パスワードの最小文字数。 |\n| `maxPasswordLength` | `number` | `128` | パスワードの最大文字数。 |\n| `requireEmailVerification` | `boolean` | `false` | メール未検証ユーザーのサインインをブロックする。 |\n| `autoSignIn` | `boolean` | `true` | サインアップ成功後に自動でサインインさせる。 |\n| `sendResetPassword` | `function` | `undefined` | パスワードリセットメールを送信する関数。 |\n| `onPasswordReset` | `function` | `undefined` | リセット成功後に実行されるコールバック。 |\n| `resetPasswordTokenExpiresIn` | `number` | `3600` | リセットトークンの有効期間（秒）。既定は 1 時間。 |\n| `revokeSessionsOnPasswordReset` | `boolean` | `false` | パスワードリセット時に全セッションを失効させる。 |\n| `password` | `object` | — | `hash` / `verify` を差し替えてハッシュ方式をカスタムする。 |\n\n### メール検証\n\nメール検証は `emailVerification.sendVerificationEmail` で送信処理を実装し、`emailAndPassword.requireEmailVerification: true` で未検証ユーザーのサインインを禁止する。送信処理はメール送信ライブラリ（Resend / Nodemailer など）に委譲する。\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\nimport { sendEmail } from \"~/lib/email\";\n\nexport const auth = betterAuth({\n  emailVerification: {\n    sendVerificationEmail: async ({ user, url, token }) =\u003e {\n      void sendEmail({\n        to: user.email,\n        subject: \"メールアドレスを確認してください\",\n        text: `次のリンクをクリックして確認を完了してください: ${url}`,\n      });\n    },\n    sendOnSignUp: true, // サインアップ時に自動送信\n    // sendOnSignIn: true, // 未検証ユーザーのサインイン試行時にも送信\n  },\n  emailAndPassword: {\n    enabled: true,\n    requireEmailVerification: true, // 未検証ではサインイン不可\n  },\n});\n```\n\nクライアントから検証メールを再送する場合は `sendVerificationEmail` を呼ぶ。`callbackURL` は検証完了後のリダイレクト先。\n\n```ts\nawait authClient.sendVerificationEmail({\n  email: \"user@email.com\",\n  callbackURL: \"/\", // 検証後のリダイレクト先\n});\n```\n\nメール内リンクのトークンを使って明示的に検証する場合は `verifyEmail` を使う。\n\n```ts\nawait authClient.verifyEmail({\n  query: { token: \"...\" },\n});\n```\n\n\u003e **列挙攻撃（user enumeration）対策**: `requireEmailVerification` が有効、または `autoSignIn: false` のとき、サインアップエンドポイントは「メールが既に登録済みか否か」に関わらず同一の `200` を返す。これは [OWASP の認証ベストプラクティス](https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html#authentication-and-error-messages) に沿った挙動で、攻撃者が登録済みアドレスを推測できないようにするためのもの。既存ユーザーの再サインアップを検知したい場合は `onExistingUserSignUp` コールバックを使う。\n\n### パスワードリセット\n\nリセットは 3 ステップのフローになる。\n\n1. **送信処理を実装**: サーバー側 `emailAndPassword.sendResetPassword` にリセットメール送信関数を渡す。引数は `{ user, url, token }` と `request`。\n2. **リセット要求**: クライアントで `authClient.requestPasswordReset({ email, redirectTo })` を呼ぶ。ユーザーが存在すれば `sendResetPassword` が発火する。\n3. **新パスワード設定**: メールのリンク先（`redirectTo` にトークン付きで遷移）で `authClient.resetPassword({ newPassword, token })` を呼ぶ。\n\nサーバー設定。`onPasswordReset` でリセット完了後の監査ログなどを実行でき、`revokeSessionsOnPasswordReset` で既存セッションを一括失効させられる。\n\n```ts\n// auth.ts\nexport const auth = betterAuth({\n  emailAndPassword: {\n    enabled: true,\n    revokeSessionsOnPasswordReset: true, // リセット時に全セッション失効\n    sendResetPassword: async ({ user, url, token }, request) =\u003e {\n      void sendEmail({\n        to: user.email,\n        subject: \"パスワードの再設定\",\n        text: `次のリンクからパスワードを再設定してください: ${url}`,\n      });\n    },\n    onPasswordReset: async ({ user }, request) =\u003e {\n      // リセット完了後の処理（監査ログ・通知など）\n    },\n  },\n});\n```\n\nクライアント側。リセット要求と新パスワード設定。\n\n```ts\n// 1. リセットメールの送信を要求\nconst { data, error } = await authClient.requestPasswordReset({\n  email: \"john.doe@example.com\",\n  redirectTo: \"https://example.com/reset-password\", // 任意。リンク先 URL\n});\n\n// 2. リンク先ページでトークンと新パスワードを送信\nconst { data: reset, error: resetError } = await authClient.resetPassword({\n  newPassword: \"password1234\",\n  token, // URL のクエリパラメータから取得\n});\n```\n\n\u003e 旧バージョンでは `requestPasswordReset` が `forgetPassword` という名前だった。新規コードでは `requestPasswordReset` を使う。\n\n### パスワードポリシー\n\n最小・最大文字数は `minPasswordLength`（既定 8）と `maxPasswordLength`（既定 128）で設定する。\n\n```ts\nexport const auth = betterAuth({\n  emailAndPassword: {\n    enabled: true,\n    minPasswordLength: 12,\n    maxPasswordLength: 256,\n  },\n});\n```\n\n文字種の必須化（記号・数字を含むなど）といった複雑なポリシーはコアには含まれない。サインアップの境界で Valibot などを使って入力検証するか、`before` フックでチェックを挟む。本プロジェクトでは境界バリデーションを Valibot で行う方針に合わせるとよい。\n\n### ハッシュ方式のカスタム\n\nBetter Auth は既定で **scrypt** を使う。scrypt は計算コストとメモリコストが高くブルートフォースに強い方式で、OWASP が `argon2id` を使えない場合の推奨として挙げている（Node.js にネイティブ実装があるため Better Auth は scrypt を既定採用）。\n\n要件に応じて `emailAndPassword.password.hash` と `password.verify` を差し替えれば、任意のアルゴリズム（例: Argon2id）に変更できる。以下は `@node-rs/argon2` を使う例。\n\n```ts\n// password.ts\nimport { hash, type Options, verify } from \"@node-rs/argon2\";\n\nconst opts: Options = {\n  memoryCost: 65536, // 64 MiB\n  timeCost: 3, // 3 回反復\n  parallelism: 4, // 4 レーン\n  outputLen: 32, // 32 バイト\n  algorithm: 2, // Argon2id\n};\n\nexport async function hashPassword(password: string) {\n  const result = await hash(password, opts);\n  return result;\n}\n\nexport async function verifyPassword(data: { password: string; hash: string }) {\n  const { password, hash } = data;\n  const result = await verify(hash, password, opts);\n  return result;\n}\n```\n\n```ts\n// auth.ts\nimport { hashPassword, verifyPassword } from \"~/password\";\n\nexport const auth = betterAuth({\n  emailAndPassword: {\n    enabled: true,\n    password: {\n      hash: hashPassword,\n      verify: verifyPassword,\n    },\n  },\n});\n```\n\n\u003e `verify` 関数は `{ password, hash }` を受け取り `boolean` を返す。引数の形が `hash` 関数と異なる点に注意。\n\n---\n\n## OAuth / ソーシャルログイン\n\nGoogle や LINE などのソーシャルプロバイダは `socialProviders` に `clientId` / `clientSecret` を設定するだけで使える。Better Auth はコールバック URL（`/api/auth/callback/\u003cprovider\u003e`）や ID トークン検証を内部で処理する。\n\n\u003e OAuth フロー全体や Cookie ベースのセッション管理といった前提概念は [§01 基礎概念](01-concepts.html) を参照。本章はプロバイダ設定とサインイン呼び出しに集中する。\n\n### 設定例（Google / LINE）\n\n```ts\n// auth.ts\nexport const auth = betterAuth({\n  socialProviders: {\n    google: {\n      clientId: process.env.GOOGLE_CLIENT_ID as string,\n      clientSecret: process.env.GOOGLE_CLIENT_SECRET as string,\n      prompt: \"select_account\", // 任意。毎回アカウント選択を表示\n      // scope: [\"email\", \"profile\"], // 任意。既定スコープに追加\n    },\n    line: {\n      clientId: process.env.LINE_CLIENT_ID as string,\n      clientSecret: process.env.LINE_CLIENT_SECRET as string,\n      // redirectURI: \"https://your.app/api/auth/callback/line\", // 任意。カスタム redirect URI\n      // scope: [\"custom\"], // 任意。スコープを追加\n      // disableDefaultScope: true, // 既定スコープ [openid, profile, email] を置き換える\n    },\n  },\n});\n```\n\nLINE を使うには **LINE Developers Console** での事前設定が必要。\n\n1. LINE Developers Console でチャネルを作成する。\n2. **Channel ID**（`client_id`）と **Channel secret**（`client_secret`）を控える。\n3. チャネル設定に Redirect URI を追加する。ローカルなら `http://localhost:3000/api/auth/callback/line`。\n4. 必要なスコープを有効化する（最低限 `openid`。名前・アバター・メールが必要なら `profile` `email` を追加）。\n\nGoogle は [Google Cloud Console](https://console.cloud.google.com/apis/dashboard) の「認証情報」で OAuth クライアント ID を作成し、承認済みリダイレクト URI に `http://localhost:3000/api/auth/callback/google` を登録する。\n\nクライアントからのサインインは `signIn.social` に `provider`（providerId）を渡す。\n\n```ts\nawait authClient.signIn.social({\n  provider: \"line\", // \"google\" / \"line\" など\n  callbackURL: \"/dashboard\", // 任意。成功後のリダイレクト先\n  errorCallbackURL: \"/error\", // 任意\n  newUserCallbackURL: \"/welcome\", // 任意。新規ユーザーのみ\n});\n```\n\n\u003e **ID トークンによるサインイン**: Google・Apple・Microsoft Entra・Facebook・Cognito のように `aud`（audience）でトークンを検証するプロバイダでは、`clientId` に配列を渡して複数のクライアント ID を受け入れられる。Web / iOS / Android で別々のクライアント ID を持つネイティブ SDK のトークンを、単一のバックエンド設定でクロスプラットフォームに受理できる。\n\n### 対応プロバイダ一覧\n\nBetter Auth は組み込みで多数のソーシャルプロバイダをサポートする（`socialProviders.\u003cid\u003e` で設定）。カテゴリ別の代表例は以下のとおり。\n\n| カテゴリ | プロバイダ（providerId） |\n|---|---|\n| 主要 ID 基盤 | Google (`google`), Apple (`apple`), Microsoft (`microsoft`), Facebook (`facebook`) |\n| 日本・アジア向け | **LINE (`line`)**, **Kakao (`kakao`)**, **Naver (`naver`)**, VK (`vk`) |\n| 開発者 / コード | GitHub (`github`), GitLab (`gitlab`), Hugging Face (`huggingface`) |\n| チャット / コミュニティ | Discord (`discord`), Slack (`slack`), Twitch (`twitch`), Reddit (`reddit`), Kick (`kick`) |\n| 生産性 / SaaS | Notion (`notion`), Atlassian (`atlassian`), Linear (`linear`), Figma (`figma`), Dropbox (`dropbox`), Salesforce (`salesforce`), Vercel (`vercel`), Zoom (`zoom`), LinkedIn (`linkedin`) |\n| メディア / ソーシャル | Twitter/X (`twitter`), TikTok (`tiktok`), Spotify (`spotify`), Roblox (`roblox`) |\n| クラウド ID | Amazon Cognito (`cognito`) |\n\n\u003e **日本向けの実務メモ**: 国内サービスでは **LINE** が事実上の標準ログインになりやすい。韓国市場を視野に入れるなら **Kakao** と **Naver** が必須級。いずれも組み込みプロバイダとして提供されるため、`clientId` / `clientSecret` の設定だけで導入できる。後述の Generic OAuth が必要なプロバイダと異なり、これらはプロフィールマッピングまで Better Auth が面倒を見てくれる。\n\n---\n\n## Generic OAuth プラグイン\n\n組み込みプロバイダに無いサービスでも、**OAuth 2.0 または OpenID Connect (OIDC) に準拠していれば** `genericOAuth` プラグインで接続できる。社内 IdP、Auth0 / Keycloak / Okta などの ID 基盤、あるいは Instagram・Coinbase のような独自 OAuth もこれで扱う。\n\n\u003e プラグイン機構そのもの（登録方法・ライフサイクル・他プラグインとの組み合わせ）の詳細は [§03 プラグイン](03-plugins.html) を参照。本節は Generic OAuth の設定とサインインに絞る。\n\n### セットアップ（サーバー + クライアント）\n\nサーバー側は `genericOAuth` を `plugins` に追加し、`config` 配列に各プロバイダを定義する。\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\nimport { genericOAuth } from \"better-auth/plugins\";\n\nexport const auth = betterAuth({\n  plugins: [\n    genericOAuth({\n      config: [\n        {\n          providerId: \"custom-oauth\",\n          clientId: process.env.CUSTOM_CLIENT_ID as string,\n          clientSecret: process.env.CUSTOM_CLIENT_SECRET as string,\n          authorizationUrl: \"https://auth.example.com/authorize\",\n          tokenUrl: \"https://auth.example.com/token\",\n          issuer: \"https://auth.example.com\", // 期待する issuer を明示\n          scopes: [\"openid\", \"profile\", \"email\"],\n        },\n      ],\n    }),\n  ],\n});\n```\n\nクライアント側は `genericOAuthClient` を `plugins` に追加する。\n\n```ts\n// auth-client.ts\nimport { createAuthClient } from \"better-auth/client\";\nimport { genericOAuthClient } from \"better-auth/client/plugins\";\n\nexport const authClient = createAuthClient({\n  plugins: [genericOAuthClient()],\n});\n```\n\nサインインは `signIn.oauth2` に `providerId` を渡す。組み込み用の `provider` ではなく `providerId` を使う点に注意。\n\n```ts\nconst { data, error } = await authClient.signIn.oauth2({\n  providerId: \"custom-oauth\",\n  callbackURL: \"/dashboard\", // 任意\n  errorCallbackURL: \"/error-page\", // 任意\n  newUserCallbackURL: \"/welcome\", // 任意\n  // disableRedirect, // 任意\n  // scopes, // 任意\n  // requestSignUp, // 任意\n});\n```\n\n### プリセットヘルパー\n\n主要な ID 基盤にはプリセットヘルパー関数が用意されており、エンドポイント URL を手書きせずに `clientId` / `clientSecret` だけで設定できる。\n\n- **Auth0** — `auth0(options)`\n- **Keycloak** — `keycloak(options)`\n- **Okta** — `okta(options)`\n- **Microsoft Entra ID (Azure AD)** — `microsoftEntraId(options)`\n- **Slack** — `slack(options)`\n- **HubSpot** — `hubspot(options)`\n- **LINE** — `line(options)`\n- **Patreon** — `patreon(options)`\n\nヘルパーを使った例（Slack）。`config` 配列の要素としてヘルパーの戻り値を渡す。\n\n```ts\n// auth.ts\nimport { genericOAuth, slack } from \"better-auth/plugins\";\n\nexport const auth = betterAuth({\n  plugins: [\n    genericOAuth({\n      config: [\n        slack({\n          clientId: process.env.SLACK_CLIENT_ID as string,\n          clientSecret: process.env.SLACK_CLIENT_SECRET as string,\n        }),\n      ],\n    }),\n  ],\n});\n```\n\nクライアントのサインインは providerId をヘルパー名に合わせる。\n\n```ts\n// sign-in.ts\nconst response = await authClient.signIn.oauth2({\n  providerId: \"slack\",\n  callbackURL: \"/dashboard\",\n});\n```\n\n### 手動設定（Instagram / Coinbase）\n\nヘルパーが無いプロバイダは、エンドポイント URL とスコープを直接指定する。\n\nInstagram の例。\n\n```ts\nexport const auth = betterAuth({\n  plugins: [\n    genericOAuth({\n      config: [\n        {\n          providerId: \"instagram\",\n          clientId: process.env.INSTAGRAM_CLIENT_ID as string,\n          clientSecret: process.env.INSTAGRAM_CLIENT_SECRET as string,\n          authorizationUrl: \"https://api.instagram.com/oauth/authorize\",\n          tokenUrl: \"https://api.instagram.com/oauth/access_token\",\n          scopes: [\"user_profile\", \"user_media\"],\n        },\n      ],\n    }),\n  ],\n});\n```\n\nCoinbase の例。\n\n```ts\nexport const auth = betterAuth({\n  plugins: [\n    genericOAuth({\n      config: [\n        {\n          providerId: \"coinbase\",\n          clientId: process.env.COINBASE_CLIENT_ID as string,\n          clientSecret: process.env.COINBASE_CLIENT_SECRET as string,\n          authorizationUrl: \"https://www.coinbase.com/oauth/authorize\",\n          tokenUrl: \"https://api.coinbase.com/oauth/token\",\n          scopes: [\"wallet:user:read\"], // 必要に応じて追加\n        },\n      ],\n    }),\n  ],\n});\n```\n\n### OIDC を discoveryUrl で自動設定\n\nOpenID Connect 準拠のプロバイダなら、`discoveryUrl`（`.well-known/openid-configuration`）を渡すだけで `authorizationUrl` / `tokenUrl` / `userInfoUrl` などを自動取得できる。`issuer` も discovery ドキュメントから補完される。\n\n```ts\ngenericOAuth({\n  config: [\n    {\n      providerId: \"my-provider\",\n      discoveryUrl: \"https://auth.example.com/.well-known/openid-configuration\",\n      clientId: \"...\",\n      clientSecret: \"...\",\n      // issuer は discovery ドキュメントから自動取得される\n    },\n  ],\n});\n```\n\n### 設定オプション（GenericOAuthConfig）\n\n`config` 配列の各要素が取れる主なフィールドは以下のとおり。\n\n| フィールド | 型 | 説明 |\n|---|---|---|\n| `providerId` | `string` | プロバイダ識別子（必須）。`signIn.oauth2` の `providerId` と一致させる。 |\n| `clientId` | `string` | OAuth クライアント ID（必須）。 |\n| `clientSecret` | `string` | OAuth クライアントシークレット（必須）。 |\n| `discoveryUrl` | `string` | OIDC/OAuth 設定の自動取得 URL。指定すると各エンドポイントを補完。 |\n| `issuer` | `string` | 期待する issuer。discoveryUrl 未使用時に手動指定。 |\n| `requireIssuerValidation` | `boolean` | issuer の厳密検証を要求するか。 |\n| `authorizationUrl` | `string` | 認可エンドポイント。discoveryUrl 未使用時に必要。 |\n| `tokenUrl` | `string` | トークンエンドポイント。discoveryUrl 未使用時に必要。 |\n| `userInfoUrl` | `string` | ユーザー情報エンドポイント。 |\n| `scopes` | `string[]` | 要求するスコープ。 |\n| `redirectURI` | `string` | カスタムリダイレクト URI。 |\n| `responseType` | `string` | OAuth レスポンスタイプ。既定は認可コードフローの `\"code\"`。 |\n| `prompt` | `string` | 認可画面の挙動（例: `select_account`）。 |\n| `pkce` | `boolean` | PKCE を有効化するか。 |\n| `accessType` | `string` | アクセスタイプ（Google の `offline` など）。 |\n| `accessTokenExpiresIn` | `number` | アクセストークンの有効期間（秒）。 |\n| `getUserInfo` | `function` | トークンからユーザー情報を取得する独自関数。 |\n\n---\n\n## 一次情報（出典）\n\n- Email & Password: \u003chttps://www.better-auth.com/docs/authentication/email-password\u003e\n- Google: \u003chttps://www.better-auth.com/docs/authentication/google\u003e\n- LINE: \u003chttps://www.better-auth.com/docs/authentication/line\u003e\n- Other Social Providers: \u003chttps://www.better-auth.com/docs/authentication/other-social-providers\u003e\n- Generic OAuth プラグイン: \u003chttps://www.better-auth.com/docs/plugins/generic-oauth\u003e\n\n\n\n---\n\n\n# プラグイン大全\n\n\u003e Better Auth は「コアは最小・機能はプラグインで足す」設計。本章は公式プラグインをグループ別に表で俯瞰し、主要なものは `auth.ts` / `auth-client.ts` の設定コード例まで示す網羅リファレンス。決済・エンタープライズ・AI エージェント向けまで含む。\n\n---\n\n### 🎤 登壇メモ\n\n- **つかみ**: 「Better Auth は本体が薄い。認証の“付加機能”は全部プラグイン。`plugins: []` に足すだけで 2FA も組織管理も決済も生える」。コア最小・プラグインで盛る思想を最初に共有する。\n- **強調**: ① 専用パス import（`better-auth/plugins` / `better-auth/client/plugins`）でツリーシェイク、② **追加のたび CLI generate/migrate**（忘れるとスキーマ不整合で落ちる）、③ サーバとクライアントは必ずペアで足す。\n- **10分なら**: 全部は紹介しない。代表数個に絞る — 2FA・Passkey（認証の今）、Organization（マルチテナント RBAC）、Agent Auth（AI 時代の目玉）、Stripe/Polar（決済は「MoR か直接 PSP か」だけ触れる）。残りは「グループ表で俯瞰できる」と早見表・選び方表に逃がす。\n\n---\n\n### 共通の注意（全プラグイン必読）\n\n導入手順はどのプラグインも基本的に同じ。「**サーバ側**（`betterAuth({ plugins: [...] })`）に追加」→「**クライアント側**（`createAuthClient({ plugins: [...] })`）に対応プラグインを追加」→「**スキーマ再生成・マイグレーション**」の 3 ステップ。\n\n\u003e **専用パスから import する（ツリーシェイク）**。バレル import ではなく機能ごとの専用パスから読み込むことで、使わないプラグインのコードがバンドルに混入しない。\n\n- サーバ側の多くは `better-auth/plugins`、クライアント側は `better-auth/client/plugins` から import する。\n- ここで言う「専用パス」は `better-auth/plugins` / `better-auth/client/plugins` という名前付き export の入口のこと。`better-auth/plugins/two-factor` のようなプラグイン個別サブパスは**存在しない**（アクセス制御ヘルパーの `better-auth/plugins/access` だけは例外的サブパス）。\n- 一部は**独立パッケージ**で、別経路から import する（下表）。\n\n| プラグイン | サーバ import | クライアント import |\n|---|---|---|\n| 標準（2FA, username, organization, admin, apiKey, jwt, bearer 等） | `better-auth/plugins` | `better-auth/client/plugins` |\n| Passkey | `@better-auth/passkey` | `@better-auth/passkey/client` |\n| Stripe | `@better-auth/stripe` | `@better-auth/stripe/client` |\n| SSO | `@better-auth/sso` | `@better-auth/sso/client` |\n| Polar | `@polar-sh/better-auth` | （Polar SDK 経由） |\n| Dub | `@dub/better-auth` | `@dub/better-auth` |\n\n\u003e **プラグインを追加・変更するたびに CLI で generate / migrate を再実行する**。プラグインは独自テーブルやカラム（2FA のシークレット、passkey の公開鍵、organization のメンバー表など）を要求するため、これを忘れると実行時にスキーマ不整合で落ちる。\n\n```bash\n# スキーマ定義を再生成（Drizzle/Prisma などのアダプタに反映）\nnpx @better-auth/cli generate\n\n# 実 DB にマイグレーション適用（Kysely/組み込みアダプタ利用時）\nnpx @better-auth/cli migrate\n```\n\n---\n\n### 認証系\n\nログイン手段・本人確認手段を増やすプラグイン群。`emailAndPassword` や `socialProviders` といったコア機能に対し、これらを足して認証 UX を組み立てる。\n\n| プラグイン | 役割 | 主な設定・API | 備考 |\n|---|---|---|---|\n| **Two-Factor (2FA)** | 二要素認証。TOTP・OTP・バックアップコード・信頼済みデバイス | `twoFactor()` / `twoFactorClient()` | ログイン後に第二要素検証フローを挿入 |\n| **Username** | メールに加えユーザー名でログイン | `username({ minUsernameLength })` | email+password の軽量拡張 |\n| **Anonymous** | PII なしで認証済み体験。後から本アカウントへリンク | `anonymous({ onLinkAccount, emailDomainName })` | ゲスト→本登録の移行に最適 |\n| **Phone Number** | 電話番号 + SMS OTP でサインイン/アップ | `phoneNumber({ sendOTP, signUpOnVerification })` | SMS 送信は自前実装 |\n| **Magic Link** | パスワードレス。メールのリンクをクリックで認証 | `magicLink({ sendMagicLink })` / `signIn.magicLink()` | リンク送信は自前実装 |\n| **Email OTP** | メールに届く OTP でサインイン/検証/パスワードリセット | `emailOTP({ sendVerificationOTP, otpLength, expiresIn })` | `type` で用途切替 |\n| **Passkey** | WebAuthn/FIDO2 のパスキー。生体・PIN・セキュリティキー | `passkey({ rpID, rpName, origin })` | フィッシング耐性。独立パッケージ |\n| **Generic OAuth** | 任意の OAuth2 / OIDC プロバイダを追加 | `genericOAuth({ config: [...] })` | コア未対応プロバイダ用の汎用口 |\n| **One Tap** | Google One Tap のワンタップログイン | `oneTap()` / `oneTapClient({ clientId })` | Google アカウント前提 |\n| **SIWE** | Sign-In with Ethereum（ERC-4361）。ウォレット署名で認証 | `siwe({ domain, getNonce, verifyMessage, ensLookup })` | nonce/署名検証は自前実装 |\n\n#### Two-Factor (2FA)\n\nTOTP（認証アプリ）、メール/SMS の OTP、バックアップコード、信頼済みデバイスをまとめて提供。クライアントでは第二要素が必要なときのリダイレクト先を制御する。\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\nimport { twoFactor } from \"better-auth/plugins\";\n\nexport const auth = betterAuth({\n  plugins: [\n    twoFactor({\n      issuer: \"MyApp\", // 認証アプリ上の表示名\n      otpOptions: {\n        async sendOTP({ user, otp }) {\n          // メール/SMS で otp を送信\n        },\n      },\n    }),\n  ],\n});\n```\n\n```ts\n// auth-client.ts\nimport { createAuthClient } from \"better-auth/client\";\nimport { twoFactorClient } from \"better-auth/client/plugins\";\n\nexport const authClient = createAuthClient({\n  plugins: [\n    twoFactorClient({\n      onTwoFactorRedirect() {\n        // 第二要素検証ページへプログラム的に遷移（フルリロード回避）\n      },\n    }),\n  ],\n});\n```\n\n#### Email OTP\n\nメールに届くワンタイムコードで、サインイン・メール検証・パスワードリセットを 1 つの仕組みで賄う。`type` で用途を切り替える。\n\n```ts\n// auth.ts\nimport { emailOTP } from \"better-auth/plugins\";\n\nexport const auth = betterAuth({\n  plugins: [\n    emailOTP({\n      otpLength: 6,\n      expiresIn: 300, // 秒\n      async sendVerificationOTP({ email, otp, type }) {\n        // type は \"sign-in\" | \"email-verification\" | \"forget-password\"\n        // email 宛に otp を送信\n      },\n    }),\n  ],\n});\n```\n\n```ts\n// クライアントから OTP 送信\nawait authClient.emailOtp.sendVerificationOtp({\n  email: \"user@example.com\",\n  type: \"sign-in\",\n});\n```\n\n#### Passkey\n\nWebAuthn/FIDO2 ベースのパスワードレス認証。`rpID`（リライング・パーティ ID）は認証サーバのオリジン由来で、ローカル開発では `localhost` でよい。独立パッケージ `@better-auth/passkey` から import する。\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\nimport { passkey } from \"@better-auth/passkey\";\n\nexport const auth = betterAuth({\n  plugins: [\n    passkey({\n      rpID: \"example.com\",\n      rpName: \"My App\",\n      origin: \"https://example.com\",\n    }),\n  ],\n});\n```\n\n```ts\n// クライアントでパスキー登録\nawait authClient.passkey.addPasskey({ name: \"Primary passkey\" });\n```\n\n#### Generic OAuth\n\nコアの `socialProviders` に無いプロバイダを、エンドポイント URL を直接指定して追加する汎用プラグイン。OAuth 2.0 と OIDC の両方に対応。\n\n```ts\n// auth.ts\nimport { genericOAuth } from \"better-auth/plugins\";\n\nexport const auth = betterAuth({\n  plugins: [\n    genericOAuth({\n      config: [\n        {\n          providerId: \"custom-oauth\",\n          clientId: process.env.CUSTOM_CLIENT_ID as string,\n          clientSecret: process.env.CUSTOM_CLIENT_SECRET as string,\n          authorizationUrl: \"https://auth.example.com/authorize\",\n          tokenUrl: \"https://auth.example.com/token\",\n          issuer: \"https://auth.example.com\", // OIDC の期待 issuer\n          scopes: [\"openid\", \"profile\", \"email\"],\n        },\n      ],\n    }),\n  ],\n});\n```\n\n#### SIWE（Sign-In with Ethereum）\n\nEthereum ウォレット署名で認証する ERC-4361 準拠プラグイン。nonce 生成と署名検証は自前実装（`viem` 推奨）。`verifyMessage` は署名復元のみを返せばよく、nonce・ドメイン・Chain ID・有効期限の検証はプラグインが行う。\n\n```ts\n// auth.ts\nimport { siwe } from \"better-auth/plugins\";\n\nexport const auth = betterAuth({\n  plugins: [\n    siwe({\n      domain: \"myapp.com\",\n      anonymous: false, // false ならメール紐付けユーザーを作成\n      getNonce: async () =\u003e generateSecureNonce(),\n      verifyMessage: async ({ message, signature, address }) =\u003e {\n        // viem の verifyMessage 等で署名を検証し boolean を返す\n        return await verifySignature({ message, signature, address });\n      },\n    }),\n  ],\n});\n```\n\n---\n\n### 認可・承認系\n\n「誰が・何を・どこまでできるか」を制御するプラグイン群。管理機能、API 認証、組織/RBAC、AI エージェント認可など。\n\n| プラグイン | 役割 | 主な設定・API | 備考 |\n|---|---|---|---|\n| **Admin** | ユーザー管理・ロール付与・BAN・なりすまし（impersonate） | `admin({ adminRoles, adminUserIds, impersonationSessionDuration })` | 管理ダッシュボードの土台 |\n| **Agent Auth** | AI エージェント固有 identity・登録・ディスカバリ・能力ベース認可 | `agentAuth({ capabilities, onExecute })` | 標準策定中で API は流動的 |\n| **API Key** | API キーの発行・管理・検証。レート制限・有効期限・メタデータ | `apiKey()` / `auth.api.verifyApiKey()` | サーバ間/プログラム認証向け |\n| **MCP** | 自アプリを MCP クライアント向け OAuth プロバイダ化 | `mcp({ loginPage, oidcConfig })` / `withMcpAuth` | OAuth Provider へ移行予定 |\n| **Organization** | 組織・メンバー・招待・チーム・RBAC・動的アクセス制御 | `organization({ ac, teams, dynamicAccessControl })` | マルチテナント SaaS の中核 |\n\n#### Admin\n\nユーザーの作成・一覧・ロール変更・BAN/解除に加え、**impersonate（なりすまし）**で対象ユーザーのセッションを再現できる（既定 1 時間、`impersonationSessionDuration` で変更）。`adminRoles` か `adminUserIds` で管理者を指定。\n\n```ts\n// auth.ts\nimport { admin } from \"better-auth/plugins\";\n\nexport const auth = betterAuth({\n  plugins: [\n    admin({\n      adminRoles: [\"admin\", \"superadmin\"],\n      adminUserIds: [\"user_id_1\"], // ここに含まれるユーザーは全管理操作が可能\n      impersonationSessionDuration: 60 * 60, // 秒（既定 1 時間）\n      defaultBanReason: \"規約違反\",\n    }),\n  ],\n});\n```\n\n```ts\n// クライアントでなりすまし・BAN\nawait authClient.admin.impersonateUser({ userId: \"user-id\" });\nawait authClient.admin.banUser({ userId: \"user-id\", banReason: \"spam\" });\n```\n\n#### Agent Auth\n\nAI エージェントに**固有の identity** を与え、**登録（registration）・ディスカバリ・能力（capability）ベースの認可**を行うプラグイン。エージェントはディスカバリで得た実行 URL（既定 `default_location`）を叩き、プラグインが `onExecute` を実行する。capability に `location` を指定すると既存 REST ルートへ向け、その場合 `onExecute` は使わず自前ハンドラで解決する。\n\n\u003e このプラグインは策定中の標準の実装で、まだ安定版ではなく API が変わりうる（`better-auth` 公式 org の実験的プラグイン）。本番採用は慎重に。\n\nAI エージェント向けの全体像・関連リソースは [§07 AI リソース](07-ai-resources.html) を参照。\n\n```ts\n// auth.ts（イメージ）\nimport { agentAuth } from \"@better-auth/agent-auth\";\n\nexport const auth = betterAuth({\n  plugins: [\n    agentAuth({\n      capabilities: {\n        // エージェントに許可する能力を宣言\n      },\n      onExecute: async (ctx) =\u003e {\n        // default_location 経由の実行を処理\n      },\n    }),\n  ],\n});\n```\n\n#### API Key\n\nAPI キーの発行・管理・検証を提供。**ビルトインのレート制限**、カスタム有効期限、残回数制限、メタデータ、パーミッションに対応。サーバ間連携やプログラムアクセスの認証に使う。\n\n```ts\n// auth.ts\nimport { apiKey } from \"better-auth/plugins\";\n\nexport const auth = betterAuth({\n  plugins: [\n    apiKey({\n      rateLimit: { enabled: true, maxRequests: 100 },\n      enableMetadata: true,\n    }),\n  ],\n});\n```\n\n```ts\n// キー検証（権限チェック付き）\nconst { valid } = await auth.api.verifyApiKey({\n  body: { key: \"the_api_key\", permissions: { files: [\"read\"] } },\n});\n```\n\n#### MCP\n\n自アプリを **MCP（Model Context Protocol）クライアント向けの OAuth プロバイダ**にする。アクセストークンの発行・管理を担い、`withMcpAuth` で MCP サーバを保護する。MCP サーバが別プロセス/別言語なら、Bearer トークンをリモート検証する軽量な **MCP Client** も使える。\n\n\u003e 本プラグインは近く **OAuth Provider プラグイン**へ統合・置き換え予定（スキーマは OIDC Provider と共通）。新規実装では移行先も意識する。\n\n```ts\n// auth.ts\nimport { mcp } from \"better-auth/plugins\";\n\nexport const auth = betterAuth({\n  plugins: [\n    mcp({\n      loginPage: \"/sign-in\", // 未認証クライアントのログイン誘導先\n    }),\n  ],\n});\n```\n\n#### Organization\n\n組織・メンバー・**招待**・**チーム**・**RBAC**を提供するマルチテナントの中核。`ac`（アクセスコントローラ）と `dynamicAccessControl` を有効化すると、実行時に組織ごとのカスタムロールを生成できる。サーバ・クライアント双方に `teams` を渡してチーム機能を有効化する。\n\n```ts\n// auth.ts\nimport { organization } from \"better-auth/plugins\";\nimport { ac } from \"@/auth/permissions\";\n\nexport const auth = betterAuth({\n  plugins: [\n    organization({\n      ac, // 動的アクセス制御に必須\n      teams: { enabled: true },\n      dynamicAccessControl: {\n        enabled: true,\n        maximumRolesPerOrganization: 10,\n      },\n    }),\n  ],\n});\n```\n\n```ts\n// auth-client.ts\nimport { organizationClient } from \"better-auth/client/plugins\";\n\nexport const authClient = createAuthClient({\n  plugins: [organizationClient({ teams: { enabled: true } })],\n});\n```\n\n---\n\n### 企業（エンタープライズ）\n\n自社を ID プロバイダ化したり、企業顧客の SSO / プロビジョニング要件に応える層。OIDC Provider と MCP は将来 **OAuth Provider** へ統合される。\n\n| プラグイン | 役割 | 主な設定・API | 備考 |\n|---|---|---|---|\n| **OIDC Provider** | 自前の OpenID Connect プロバイダを構築 | `oidcProvider({ loginPage, consentPage })` | OAuth Provider へ移行予定 |\n| **OAuth Provider** | OIDC Provider と MCP を束ねる後継プラグイン | （統合 API） | 上記 2 つの移行先 |\n| **SSO** | SAML 2.0 / OIDC / OAuth2 プロバイダを「消費」して SSO ログイン | `sso({ organizationProvisioning })` / `registerSSOProvider` | 顧客の自己設定 SSO はエンタープライズ |\n| **SCIM** | クロスドメイン ID プロビジョニング（SCIM サーバを公開） | `scim()` / `auth.api.getSCIMResourceType()` | ディレクトリ同期・自動ユーザー管理 |\n\n#### OIDC Provider\n\n自社を **OIDC プロバイダ**にして、サードパーティアプリにログインを提供する。ログイン/同意画面を差し替えたり、`getAdditionalUserInfoClaim` で UserInfo に独自クレームを足せる。\n\n```ts\n// auth.ts\nimport { oidcProvider } from \"better-auth/plugins\";\n\nexport const auth = betterAuth({\n  plugins: [\n    oidcProvider({\n      loginPage: \"/sign-in\",\n      consentPage: \"/oauth/consent\",\n      getAdditionalUserInfoClaim: async (user, scopes, client) =\u003e {\n        return { role: user.role };\n      },\n    }),\n  ],\n});\n```\n\n\u003e OIDC Provider と MCP はともに **OAuth Provider プラグイン**へ統合される予定。両者はスキーマを共有しており、将来的には OAuth Provider が単一の窓口になる。\n\n#### SSO\n\n外部の **SAML 2.0 / OIDC / OAuth2 プロバイダを消費**して、ユーザーが 1 組の資格情報で複数アプリにログインできるようにする。独立パッケージ `@better-auth/sso`。組織プロビジョニングと組み合わせると、ドメイン→組織のマッピングやロール自動付与ができる。\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\nimport { sso } from \"@better-auth/sso\";\n\nexport const auth = betterAuth({\n  plugins: [\n    sso({\n      organizationProvisioning: {\n        disabled: false,\n        defaultRole: \"member\",\n      },\n    }),\n  ],\n});\n```\n\n```ts\n// プロバイダを登録（SAML 例）\nawait auth.api.registerSSOProvider({\n  body: {\n    providerId: \"acme-corp\",\n    issuer: \"https://acme.okta.com\",\n    domain: \"acmecorp.com\",\n    organizationId: \"org_acme_id\",\n    samlConfig: {\n      /* メタデータ・証明書など */\n    },\n  },\n  headers,\n});\n```\n\n#### SCIM\n\n**SCIM サーバ**を公開し、外部 IdP（Okta・Entra ID 等）からのユーザー/グループの自動プロビジョニング（作成・更新・無効化）を受け付ける。属性は既定でコアフィールドへ自動マッピングされ、カスタマイズも可能。エンタープライズのディレクトリ同期要件で使う。\n\n---\n\n### ユーティリティ\n\nトークン発行、ボット対策、API ドキュメント、セッション運用などの補助プラグイン群。\n\n| プラグイン | 役割 | 主な設定 | 備考 |\n|---|---|---|---|\n| **Bearer Token** | Cookie の代わりに Bearer トークンで API 認証 | `bearer({ requireSignature })` | 利用は慎重に（Cookie 推奨が基本） |\n| **Device Authorization** | OAuth 2.0 デバイス認可グラント（RFC 8628） | `deviceAuthorization({ expiresIn, interval })` | CLI・スマート TV・IoT 向け |\n| **Captcha** | サインアップ/イン/リセットにボット対策 | `captcha({ provider, secretKey, endpoints })` | Turnstile / reCAPTCHA / hCaptcha / CaptchaFox |\n| **Have I Been Pwned** | 漏洩済みパスワードの利用を拒否 | `haveIBeenPwned()` | HIBP API で k-匿名性チェック |\n| **i18n** | 認証エラーメッセージ等の多言語化 | （ロケール設定） | コミュニティ系。文言ローカライズ |\n| **Last Login Method** | 最後に使った認証手段を記録・表示 | `lastLoginMethod({ cookieName, maxAge })` | 「前回は Google でログイン」表示 |\n| **Multi-Session** | 同一ブラウザで複数アカウントの同時セッション | `multiSession({ maximumSessions })` | アカウント切替 UX |\n| **OAuth Proxy** | OAuth リクエストをプロキシ（プレビュー環境向け） | `oAuthProxy({ productionURL, secret })` | redirect URL が事前に確定しない開発時 |\n| **One-Time Token** | 単回使用トークンの生成・検証 | `oneTimeToken()` | クロスドメイン認証の受け渡し |\n| **OpenAPI** | 全エンドポイントの OpenAPI 3.1.1 リファレンス（Scalar UI） | `openAPI({ path, theme })` | 開発初期段階。動作確認 UI 付き |\n| **JWT** | JWT 発行 + JWKS 検証エンドポイント | `jwt({ jwks, jwt })` | セッションの代替ではない |\n| **Test utilities** | 認証フローのテスト用ヘルパー | （テストインスタンス生成） | E2E/結合テストの足場 |\n\n#### Captcha\n\n`sign-up` / `sign-in` / `request-password-reset` などのエンドポイントにボット対策を挿入。`endpoints` で保護対象を上書きでき、reCAPTCHA v3 は `minScore`、hCaptcha/CaptchaFox は `siteKey` を追加指定する。\n\n```ts\n// auth.ts\nimport { captcha } from \"better-auth/plugins\";\n\nexport const auth = betterAuth({\n  plugins: [\n    captcha({\n      provider: \"cloudflare-turnstile\", // google-recaptcha | hcaptcha | captchafox\n      secretKey: process.env.TURNSTILE_SECRET_KEY!,\n    }),\n  ],\n});\n```\n\n#### JWT\n\nJWT トークンの取得エンドポイントと、検証用の **JWKS エンドポイント**を提供する。セッションの置き換えではなく、JWT を要求する外部サービス連携向け。鍵アルゴリズムは既定 `EdDSA`（ほか `ES256`・`RSA256`・`PS256` 等に変更可）。JWT・Bearer・セッションの基礎概念は [§01 コンセプト](01-concepts.html) にまとめている。\n\n```ts\n// auth.ts\nimport { jwt } from \"better-auth/plugins\";\n\nexport const auth = betterAuth({\n  plugins: [\n    jwt({\n      jwks: {\n        keyPairConfig: { alg: \"EdDSA\" },\n      },\n    }),\n  ],\n});\n```\n\n#### OpenAPI\n\nコア＋全プラグインのエンドポイントを **OpenAPI 3.1.1** 仕様で出力し、Scalar 製 UI でブラウズ・実行テストできる。クライアント生成やドキュメント化に使う。\n\n```ts\n// auth.ts\nimport { openAPI } from \"better-auth/plugins\";\n\nexport const auth = betterAuth({\n  plugins: [\n    openAPI({\n      path: \"/reference\", // リファレンス UI の公開パス\n    }),\n  ],\n});\n```\n\n---\n\n### Payment（決済・課金）\n\n認証とユーザーは密結合（誰が何を契約しているか）なので、Better Auth は決済プロバイダを「ユーザー/組織に紐づく顧客・サブスク・使用量」として扱うプラグインを多数用意する。**Stripe と Polar は Better Auth 公式保守**、Autumn・Dodo・Creem・Chargebee・Commet は各ベンダー保守だが、いずれも公式ドキュメントにプラグインページを持つ。選定の軸は「直接 PSP か / MoR か / Stripe の上のビリング層か」「従量課金の要否」「グローバル税の丸投げ可否」「エンプラ要件」。\n\n#### 位置づけ早見\n\n| プラグイン | 課金モデル種別 | 主なターゲット | 税/VAT・コンプラの所在 | 保守 |\n|---|---|---|---|---|\n| **Stripe** | 直接 PSP | あらゆる規模・最大の柔軟性 | 自社（Stripe Tax は計算補助のみ） | 公式 |\n| **Polar** | MoR（Stripe の上） | インディー・OSS・デジタル製品/SaaS | Polar が代行 | 公式（Polar） |\n| **Autumn** | Stripe の上のビリング層（MoR でない） | AI/SaaS の従量・クレジット課金 | 自社（Stripe 側） | ベンダー |\n| **Dodo Payments** | グローバル MoR | AI/SaaS・150+ カ国のグローバル販売 | Dodo が代行 | ベンダー |\n| **Creem** | MoR | SaaS・インディーのグローバル販売 | Creem が代行 | ベンダー |\n| **Chargebee** | サブスク/レベニュー管理層（PSP の上） | 複雑請求のエンタープライズ | 自社（税計算機能は内蔵） | ベンダー |\n| **Commet** | MoR | AI/API・SaaS の従量課金 | Commet が代行 | ベンダー |\n\n\u003e **MoR（Merchant of Record）**とは、決済の法的な「販売者」を肩代わりして売上税/VAT の登録・計算・申告・納税とコンプライアンスを丸ごと引き受けるモデル。Polar / Dodo / Creem / Commet はこのタイプで、グローバル課税・インボイス・不正対策の実装負担を消す代わりに手数料が乗る。対して **Stripe は直接 PSP**（販売者は自社）、**Autumn は Stripe の上の課金レイヤー**、**Chargebee は PSP の上のサブスク管理層**で、いずれも税の最終責任は自社に残る。\n\n#### Stripe\n\n決済の世界標準にして最も汎用的な PSP。サブスクと決済を Better Auth のユーザーへ紐づける公式プラグイン。\n\n- **位置づけ**: 直接決済の事実上の標準。エコシステムと API が最も広い。\n- **課金モデル**: 直接 PSP（販売者は自社）。\n- **主なターゲット**: スタートアップ〜大企業まで、細かい制御を自前で握りたいチーム全般。\n- **際立つ特徴**: Billing・Connect（マーケットプレイス分配）・Invoicing・Checkout、巨大な API/SDK と連携先。\n- **税/VAT・コンプラ**: 自社が販売者。Stripe Tax で税率計算は補助できるが、登録・申告・納税の責任は自社に残る。\n- **いつ選ぶか**: 既存 Stripe 資産がある／きめ細かい制御が要る／税処理を自前か Stripe Tax で回せる。**不向き**: 各国 VAT 申告を丸ごと外注したい個人/小規模。\n- **Better Auth でできること**: `createCustomerOnSignUp` で顧客自動作成、`subscription`（静的/動的 plans・`freeTrial`・`limits`・`subscription.upgrade` で差額のみ課金）、Webhook 自動処理（`checkout.session.completed` / `customer.subscription.created`・`updated`・`deleted`）、`onEvent` で任意イベント、`authorizeReference` で操作権限チェック。\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\nimport { stripe } from \"@better-auth/stripe\";\nimport Stripe from \"stripe\";\n\nconst stripeClient = new Stripe(process.env.STRIPE_SECRET_KEY!);\n\nexport const auth = betterAuth({\n  plugins: [\n    stripe({\n      stripeClient,\n      stripeWebhookSecret: process.env.STRIPE_WEBHOOK_SECRET!,\n      createCustomerOnSignUp: true,\n      subscription: {\n        enabled: true,\n        plans: [\n          { name: \"basic\", priceId: \"price_123\", limits: { projects: 5 } },\n          { name: \"pro\", priceId: \"price_456\", freeTrial: { days: 14 } },\n        ],\n      },\n    }),\n  ],\n});\n```\n\n```ts\n// クライアントでプラン変更（差額のみ課金）\nawait authClient.subscription.upgrade({\n  plan: \"pro\",\n  successUrl: \"/dashboard\",\n  cancelUrl: \"/pricing\",\n  subscriptionId: \"sub_123\",\n});\n```\n\n#### Polar\n\n開発者ファーストの MoR 決済インフラ。Stripe の上に構築され、プロダクト自体も OSS。公式（Polar チーム）保守プラグイン。\n\n- **位置づけ**: 「コードで売る」開発者向け MoR。デジタル製品の販売を最短距離で。\n- **課金モデル**: MoR（Polar が販売者・売上税/VAT を代行）。内部的に Stripe の上に乗る。\n- **主なターゲット**: インディー開発者・OSS メンテナ・SaaS・ライセンス/デジタル製品販売。\n- **際立つ特徴**: GitHub 連携、**ベネフィット自動付与**（Discord/GitHub アクセス権、ライセンスキー発行、ファイル/ダウンロード配布）、Customer State、組織サポート。\n- **税/VAT・コンプラ**: Polar が販売者として代行。\n- **いつ選ぶか**: 税処理を丸投げしたい開発者、デジタル製品/ライセンス販売、購入特典の自動配布。**不向き**: 物理商品や複雑なエンプラ請求。\n- **Better Auth でできること**: `createCustomerOnSignUp` と合成サブプラグイン `checkout` / `portal`（注文・サブスク・付与ベネフィットの管理）/ `usage`（メーター一覧・イベント取込で従量課金）/ `webhooks`。\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\nimport { polar, checkout, portal, usage, webhooks } from \"@polar-sh/better-auth\";\nimport { Polar } from \"@polar-sh/sdk\";\n\nconst polarClient = new Polar({ accessToken: process.env.POLAR_ACCESS_TOKEN! });\n\nexport const auth = betterAuth({\n  plugins: [\n    polar({\n      client: polarClient,\n      createCustomerOnSignUp: true,\n      use: [checkout({}), portal(), usage(), webhooks({})],\n    }),\n  ],\n});\n```\n\n#### Autumn\n\nSaaS のプライシングを動かす OSS 課金インフラ。アプリと Stripe の「間」に座り、サブスク状態の system of record になる。\n\n- **位置づけ**: Stripe をラップする宣言的なプライシング/課金レイヤー。\n- **課金モデル**: **Stripe の上のビリング層（MoR ではない）**。サブスク状態・使用量・クレジット・エンタイトルメントのデータベース。\n- **主なターゲット**: AI/SaaS スタートアップ、従量・クレジット課金。\n- **際立つ特徴**: feature flags + usage tracking + entitlements を宣言的に定義し、小さな API（`attach` / `check` / `track`）で操作。残高・使用量をリアルタイム参照でき、AI のトークン従量・クレジット残高表示と好相性。\n- **税/VAT・コンプラ**: 下回りの **Stripe 側＝自社責任**。Autumn は税を肩代わりしない。\n- **いつ選ぶか**: Stripe は残したまま、AI/SaaS の従量・クレジット・feature gating を宣言的に組みたい。**不向き**: 税丸投げ（MoR）が主目的のとき。\n- **Better Auth でできること**: `autumn-js/better-auth` のサーバプラグイン＋クライアント（`autumn-js/react` の `useCustomer` 等）で、`attach`（プラン付与/チェックアウト）・`check`（エンタイトルメント確認＝機能ゲート）・`track`（使用量計測）を提供。\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\nimport { autumn } from \"autumn-js/better-auth\";\n\nexport const auth = betterAuth({\n  plugins: [autumn()], // attach / check / track を提供（下回りは Stripe）\n});\n```\n\n#### Dodo Payments\n\nAI-first 企業を狙うグローバル MoR（新興）。単一 API で世界展開を数分に縮める。\n\n- **位置づけ**: 150+ カ国へ売るためのグローバル MoR。\n- **課金モデル**: MoR。\n- **主なターゲット**: AI/SaaS/デジタル製品、グローバル販売・新興市場。\n- **際立つ特徴**: 単一 API で checkout / billing / payouts。クレジットベース課金・使用量メータリング・サブスク・グローバル決済を内蔵し、税/不正/コンプラに触れず展開できる。\n- **税/VAT・コンプラ**: Dodo が販売者として代行。\n- **いつ選ぶか**: グローバル販売を最速で立ち上げたい、税/コンプラを丸投げしたい AI/SaaS。**不向き**: 国内のみ・既存 Stripe で足りるとき。\n- **Better Auth でできること**: `@dodopayments/better-auth`。`client` と `createCustomerOnSignUp`、合成サブプラグイン `use: [checkout, portal, webhooks]`。\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\nimport { dodopayments, checkout, portal, webhooks } from \"@dodopayments/better-auth\";\nimport DodoPayments from \"dodopayments\";\n\nconst client = new DodoPayments({ bearerToken: process.env.DODO_API_KEY! });\n\nexport const auth = betterAuth({\n  plugins: [\n    dodopayments({\n      client,\n      createCustomerOnSignUp: true,\n      use: [checkout(), portal(), webhooks()],\n    }),\n  ],\n});\n```\n\n#### Creem\n\nソフトウェアをグローバル販売する「財務 OS」。税・コンプラ込みで Stripe の代替を狙う SaaS/インディー向け MoR。\n\n- **位置づけ**: 税コンプラの頭痛なくグローバル販売する MoR。\n- **課金モデル**: MoR。\n- **主なターゲット**: SaaS・インディー、グローバル販売、共同制作のレベニュー分配。\n- **際立つ特徴**: 決済・税・コンプラに加え**レベニュースプリット**（収益分配）を内蔵。Stripe より少ない手間で開始でき、`onCheckoutCompleted` などのイベントコールバックで購入/サブスクを処理。\n- **税/VAT・コンプラ**: Creem が代行。\n- **いつ選ぶか**: 税込みで手軽に売りたいインディー/SaaS、収益分配が要る。**不向き**: 複雑なエンタープライズ請求。\n- **Better Auth でできること**: `@creem_io/better-auth`。`apiKey` / `webhookSecret`、`onCheckoutCompleted` 等のコールバックで権限付与・状態更新。\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\nimport { creem } from \"@creem_io/better-auth\";\n\nexport const auth = betterAuth({\n  plugins: [\n    creem({\n      apiKey: process.env.CREEM_API_KEY!,\n      webhookSecret: process.env.CREEM_WEBHOOK_SECRET!,\n      onCheckoutCompleted: async ({ customer, product, order }) =\u003e {\n        // 購入完了時の処理（権限付与・一回払い商品の引き渡しなど）\n      },\n    }),\n  ],\n});\n```\n\n#### Chargebee\n\nサブスクリプション/レベニュー管理の老舗。PSP ではなく、Stripe など PSP の上に乗る請求オーケストレーション層。\n\n- **位置づけ**: 複雑な請求と収益認識を捌くエンタープライズ向けビリング基盤。\n- **課金モデル**: **PSP の上のサブスク/レベニュー管理層**（MoR ではない）。\n- **主なターゲット**: 複雑なプラン・多通貨・監査要件を抱えるエンタープライズ。\n- **際立つ特徴**: プロレーション、多通貨、**レベニュー認識（RevRec）**、**ダニング（dunning）**、見積〜請求の自動化、複数 PSP の束ね。\n- **税/VAT・コンプラ**: 税計算・管理機能は内蔵するが**販売者は自社**（MoR ではない）。\n- **いつ選ぶか**: 複雑なプラン/プロレーション・複数 PSP・収益認識やコンプラ要件のあるエンタープライズ。**不向き**: 個人/小規模のシンプル課金（オーバースペック）。\n- **Better Auth でできること**: `@chargebee/better-auth`（＋ `chargebee` クライアント）。`chargebeeClient`（`apiKey`・`site`）、`createCustomerOnSignUp`、Webhook の Basic 認証用 `webhookUsername` / `webhookPassword`。\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\nimport { chargebee } from \"@chargebee/better-auth\";\nimport Chargebee from \"chargebee\";\n\nconst chargebeeClient = new Chargebee({\n  apiKey: process.env.CHARGEBEE_API_KEY!,\n  site: process.env.CHARGEBEE_SITE!,\n});\n\nexport const auth = betterAuth({\n  plugins: [\n    chargebee({\n      chargebeeClient,\n      createCustomerOnSignUp: true,\n      webhookUsername: process.env.CHARGEBEE_WEBHOOK_USERNAME,\n      webhookPassword: process.env.CHARGEBEE_WEBHOOK_PASSWORD,\n    }),\n  ],\n});\n```\n\n#### Commet\n\nサブスク・従量課金・feature gating・税・グローバル決済をまとめる MoR。composable なサブプラグインで構成する。\n\n- **位置づけ**: AI/API 課金を一気通貫で扱う MoR。\n- **課金モデル**: MoR。\n- **主なターゲット**: AI/API・SaaS の使用量ベース課金。\n- **際立つ特徴**: 合成サブプラグイン `portal` / `subscriptions` / `features`（feature gating）/ `usage`（使用量メータリング）/ `seats`（席課金）で、課金と機能アクセス制御を一体化。\n- **税/VAT・コンプラ**: Commet が代行（MoR）。\n- **いつ選ぶか**: AI/API の従量課金に feature gating と seat 課金を足し、税まで MoR で一括したい。**不向き**: 単純な定額のみ。\n- **Better Auth でできること**: `@commet/better-auth`（＋ `@commet/node`）。`commet({ client, use: [portal, subscriptions, features, usage, seats] })` で認証層と請求/機能アクセスを接続。\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\nimport { commet, portal, subscriptions, features, usage, seats } from \"@commet/better-auth\";\nimport { Commet } from \"@commet/node\";\n\nconst client = new Commet({ apiKey: process.env.COMMET_API_KEY! });\n\nexport const auth = betterAuth({\n  plugins: [\n    commet({\n      client,\n      use: [portal(), subscriptions(), features(), usage(), seats()],\n    }),\n  ],\n});\n```\n\n#### 選び方早見表\n\n| 要件・状況 | 推奨 | 一言 |\n|---|---|---|\n| 税/VAT を丸投げ（MoR）したい | Polar / Dodo / Creem / Commet | 販売者を肩代わり。手数料と引き換えに税・コンプラ消滅 |\n| 直接 PSP で最大の柔軟性が欲しい | Stripe | 標準・広範 API。税は自社（Stripe Tax で補助） |\n| Stripe は残し AI/SaaS の従量・クレジットを組む | Autumn | 宣言的な entitlements＋使用量。MoR ではない |\n| グローバル販売（150+ カ国）を最速で | Dodo Payments | 単一 API・新興市場対応の MoR |\n| インディー/OSS でデジタル製品＋特典配布 | Polar | ライセンスキー・GitHub/Discord 付与が自動 |\n| 収益分配（レベニュースプリット）込みで手軽に | Creem | 税込み MoR＋共同制作向け分配 |\n| エンタープライズの複雑サブスク・収益認識 | Chargebee | プロレーション・RevRec・ダニング・多 PSP |\n| AI/API の従量＋feature gating＋seat を MoR で | Commet | サブプラグインで課金と機能ゲートを一体化 |\n\n#### 一次情報（決済プラグイン）\n\n- Stripe プラグイン: \u003chttps://www.better-auth.com/docs/plugins/stripe\u003e（公式: \u003chttps://stripe.com\u003e）\n- Polar プラグイン: \u003chttps://www.better-auth.com/docs/plugins/polar\u003e（公式: \u003chttps://polar.sh\u003e）\n- Autumn プラグイン: \u003chttps://www.better-auth.com/docs/plugins/autumn\u003e（公式: \u003chttps://useautumn.com\u003e）\n- Dodo Payments プラグイン: \u003chttps://www.better-auth.com/docs/plugins/dodopayments\u003e（公式: \u003chttps://dodopayments.com\u003e）\n- Creem プラグイン: \u003chttps://www.better-auth.com/docs/plugins/creem\u003e（公式: \u003chttps://creem.io\u003e）\n- Chargebee プラグイン: \u003chttps://www.better-auth.com/docs/plugins/chargebee\u003e（公式: \u003chttps://www.chargebee.com\u003e）\n- Commet プラグイン: \u003chttps://www.better-auth.com/docs/plugins/commet\u003e（公式: \u003chttps://commet.co\u003e）\n\n---\n\n### その他\n\n決済ではないビジネス連携、そして自作・コミュニティ製による拡張。\n\n| 項目 | 役割 | 主な設定 | 備考 |\n|---|---|---|---|\n| **Dub** | Dub リンク経由のサインアップで**リードトラッキング** | `dubAnalytics({ dubClient })` | 決済ではない。OAuth リンキングも追加 |\n| **自作プラグイン** | 独自エンドポイント・スキーマ・フックを定義 | `satisfies BetterAuthPlugin` | サーバ/クライアント両対応 |\n| **コミュニティプラグイン** | 公式以外の多数の拡張 | 各パッケージ参照 | 用途特化の選択肢が豊富 |\n\n#### Dub（リードトラッキング）\n\n[Dub](https://dub.co/) のリンク経由のサインアップを計測してリードを追跡する。決済ではなくグロース/アナリティクス用途。OAuth リンキングのサポートも追加する。\n\n```ts\n// auth.ts\nimport { betterAuth } from \"better-auth\";\nimport { dubAnalytics } from \"@dub/better-auth\";\nimport { Dub } from \"dub\";\n\nexport const auth = betterAuth({\n  plugins: [\n    dubAnalytics({\n      dubClient: new Dub(),\n    }),\n  ],\n});\n```\n\n#### 自作プラグイン\n\n`BetterAuthPlugin` を `satisfies` で満たすオブジェクトを返す関数として実装する。`createAuthEndpoint` で独自エンドポイントを追加し、`sessionMiddleware` や `requireResourceOwnership`（所有者検証ミドルウェア）などのヘルパーを組み合わせられる。独自テーブルが必要なら `schema` を宣言し、追加後に CLI で generate/migrate する。\n\n```ts\n// plugin.ts\nimport type { BetterAuthPlugin } from \"better-auth\";\nimport { createAuthEndpoint, sessionMiddleware } from \"better-auth/api\";\nimport * as z from \"zod\";\n\nexport const myPlugin = () =\u003e\n  ({\n    id: \"my-plugin\",\n    endpoints: {\n      hello: createAuthEndpoint(\n        \"/my-plugin/hello\",\n        { method: \"POST\", body: z.object({ name: z.string() }), use: [sessionMiddleware] },\n        async (ctx) =\u003e ctx.json({ message: `hi ${ctx.body.name}` }),\n      ),\n    },\n  }) satisfies BetterAuthPlugin;\n```\n\n#### コミュニティプラグイン\n\n公式が保守するプラグイン以外に、コミュニティ製の拡張が多数公開されている。用途特化（特定プロバイダ・特定フレームワーク連携・特殊な認証フロー等）の選択肢を探すときは公式の一覧を参照する。自作したものを一覧に追加することもできる。\n\n---\n\n### 一次情報（公式ドキュメント）\n\n- プラグイン総覧・自作ガイド: \u003chttps://www.better-auth.com/docs/concepts/plugins\u003e\n- Two-Factor (2FA): \u003chttps://www.better-auth.com/docs/plugins/2fa\u003e\n- Username: \u003chttps://www.better-auth.com/docs/plugins/username\u003e\n- Anonymous: \u003chttps://www.better-auth.com/docs/plugins/anonymous\u003e\n- Phone Number: \u003chttps://www.better-auth.com/docs/plugins/phone-number\u003e\n- Magic Link: \u003chttps://www.better-auth.com/docs/plugins/magic-link\u003e\n- Email OTP: \u003chttps://www.better-auth.com/docs/plugins/email-otp\u003e\n- Passkey: \u003chttps://www.better-auth.com/docs/plugins/passkey\u003e\n- Generic OAuth: \u003chttps://www.better-auth.com/docs/plugins/generic-oauth\u003e\n- One Tap: \u003chttps://www.better-auth.com/docs/plugins/one-tap\u003e\n- SIWE: \u003chttps://www.better-auth.com/docs/plugins/siwe\u003e\n- Admin: \u003chttps://www.better-auth.com/docs/plugins/admin\u003e\n- Agent Auth: \u003chttps://www.better-auth.com/docs/plugins/agent-auth\u003e\n- API Key: \u003chttps://www.better-auth.com/docs/plugins/api-key\u003e\n- MCP: \u003chttps://www.better-auth.com/docs/plugins/mcp\u003e\n- Organization: \u003chttps://www.better-auth.com/docs/plugins/organization\u003e\n- OIDC Provider: \u003chttps://www.better-auth.com/docs/plugins/oidc-provider\u003e\n- OAuth Provider: \
