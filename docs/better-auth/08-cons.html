<script>var SRC="# デメリット・注意点（正直ベース）\n\n\u003e Better Auth は強力だが万能ではない。弱点の多くは「新しい OSS であること」と「自前ホストであること」から来る。導入判断のために、ここでは欠点を誇張も矮小化もせず正直に並べる。\n\n### 🎤 登壇メモ\n\n- **つかみ**: 「いいことばかり並べる発表」は信用されない。だからこそ最後の章で正直に弱点へ踏み込む\n- **強調**: 正直さが信頼を生む——弱点を隠さず語ることが、むしろ技術選定全体の説得力になる\n- **10分なら**: デメリットは「歴史が浅い」と「自前ホストの運用責任」の2つに絞り、残りは口頭で軽く触れる\n\n技術選定は強みだけ見て決めると後で痛い。以下は本番採用前に必ず評価しておきたい論点を、影響の大きい順に並べたものだ。\n\n---\n\n## 主要な注意点\n\n### 1. 歴史が浅い\n\nv1 はリリースされたものの、Clerk や Auth0 と比べるとエンタープライズでの採用実績はまだ薄い。**SOC2** などのコンプライアンス認証や、有償サポート・SLA といった体制もこれから整っていく段階だ。金融・医療のような規制業界では、監査や調達の要件を満たせるかを早めに評価しておく必要がある。\n\n→ 競合との実績比較は [§00 比較](00-introduction.html) を参照。\n\n### 2. 破壊的変更リスク\n\n進化が速いぶん、本体やプラグインの API が予告なく動くことがある。本番運用では追従コストを織り込み、依存バージョンを固定する戦略（`package.json` でのピン留めや lockfile 厳守）が前提になる。アップデート時は CHANGELOG を読み、検証環境で先に試す運用フローを用意しておきたい。\n\n→ 成熟度の前提は [§00 比較](00-introduction.html) を参照。\n\n### 3. 自前ホスト = 運用責任は自分持ち\n\nメール配信・スケール・セキュリティパッチの適用は、すべて自分の責任範囲になる。「全部おまかせ」でインフラを意識せずに済む Clerk とは、そもそも別物だと理解しておく必要がある。ただしこれは裏返せば、**自由**と**データ所有**を手に入れているということでもある。\n\n→ 運用の重さを和らげる有料代替は [§06 Infrastructure](06-infrastructure.html) を参照。\n\n### 4. プラグイン追従の手間\n\nプラグインを追加するたびに、CLI の `generate` と `migrate` を再実行する必要がある。複数プラグインの組み合わせや読み込み**順序**でハマることがあり、エラーメッセージだけでは原因が見えにくいケースもある。導入時はプラグインを一つずつ足して、都度マイグレーションを確認するのが安全だ。\n\n→ プラグインの仕組みと追加手順は [§03 プラグイン](03-plugins.html) を参照。\n\n### 5. Infrastructure（有料）依存の芽\n\n運用の一部を有料層（マネージドな Infrastructure）に寄せていくと、そこにロックインの芽が生まれる。便利だからと寄せすぎると、「自前ホストだから自由」という当初の利点が薄れていく。**コアは自前**で持ちつつ、どこまでを有料に委ねるかのバランスを設計段階で決めておきたい。\n\n---\n\n## 小さめの注意点\n\n### 6. コミュニティプラグインの品質ばらつき\n\nエコシステムのプラグイン数は多いが、玉石混交なのが実情だ。本番に採用するものは、メンテ状況・実装の中身・依存関係を自分の目で確認してから入れるべきだ。\n\n### 7. TS/Node・RDB 前提が強い\n\n設計の中心が TypeScript / Node と RDB に置かれており、非 TS 環境や NoSQL は一級市民ではない。MongoDB アダプタなどの選択肢はあるが、スタックが大きく外れる場合は別の認証基盤も併せて比較したほうがよい。\n\n→ 対応 DB とアダプタの前提は [§05 データベース](05-database.html) を参照。\n\n---\n\n## 競合との位置づけ\n\n| 観点 | Better Auth | Clerk / Auth0 |\n|---|---|---|\n| データ所有 | 自前（強み） | ベンダー側 |\n| 運用責任 | 自分持ち（弱み） | おまかせ |\n| エンタープライズ実績 | これから | 豊富 |\n| 型安全・網羅性 | 強み | 限定的 |\n\n---\n\n\u003e 弱点の多くは「新しい OSS であること」と「自前ホストであること」の裏返しにすぎない。**データ所有**・**型安全**・**網羅性**・**AI ネイティブ**という強みが、これらのコストを上回るかどうか——その一点で判断すればよい。\n";</script>
<script>(function () {
  "use strict";
  var src = (typeof SRC === "string") ? SRC : "";

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // inline formatting. input is already HTML-escaped.
  function inline(s) {
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (_, c) {
      codes.push(c);
      return "@@CODE" + (codes.length - 1) + "@@";
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/&lt;(https?:\/\/[^\s&]+)&gt;/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/@@CODE(\d+)@@/g, function (_, i) {
      return "<code>" + codes[+i] + "</code>";
    });
    return s;
  }

  function isTableSep(line) {
    return /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(line) && line.indexOf("-") !== -1;
  }
  function splitRow(line) {
    var t = line.trim().replace(/^\|/, "").replace(/\|$/, "");
    return t.split("|").map(function (c) { return c.trim(); });
  }

  function render(md) {
    var lines = md.replace(/\r\n/g, "\n").split("\n");
    var out = [];
    var i = 0;
    while (i < lines.length) {
      var line = lines[i];

      var fence = line.match(/^```(\w*)\s*$/);
      if (fence) {
        var buf = [];
        i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
        continue;
      }

      if (/^\s*$/.test(line)) { i++; continue; }

      if (/^---+\s*$/.test(line)) { out.push("<hr>"); i++; continue; }

      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        var lv = h[1].length;
        out.push("<h" + lv + ">" + inline(esc(h[2])) + "</h" + lv + ">");
        i++; continue;
      }

      if (line.indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var header = splitRow(line);
        i += 2;
        var rows = [];
        while (i < lines.length && lines[i].indexOf("|") !== -1 && !/^\s*$/.test(lines[i])) {
          rows.push(splitRow(lines[i])); i++;
        }
        var t = "<table><thead><tr>";
        header.forEach(function (c) { t += "<th>" + inline(esc(c)) + "</th>"; });
        t += "</tr></thead><tbody>";
        rows.forEach(function (r) {
          t += "<tr>";
          r.forEach(function (c) { t += "<td>" + inline(esc(c)) + "</td>"; });
          t += "</tr>";
        });
        t += "</tbody></table>";
        out.push(t);
        continue;
      }

      if (/^>\s?/.test(line)) {
        var qbuf = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          qbuf.push(lines[i].replace(/^>\s?/, "")); i++;
        }
        out.push("<blockquote>" + render(qbuf.join("\n")) + "</blockquote>");
        continue;
      }

      if (/^(\s*)([-*]|\d+\.)\s+/.test(line)) {
        var items = [];
        while (i < lines.length && /^(\s*)([-*]|\d+\.)\s+/.test(lines[i])) {
          var m = lines[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
          items.push({ indent: m[1].length, ordered: /\d/.test(m[2]), num: parseInt(m[2], 10), text: m[3] });
          i++;
        }
        out.push(buildList(items));
        continue;
      }

      var pbuf = [];
      while (i < lines.length && !/^\s*$/.test(lines[i]) &&
             !/^(#{1,6})\s/.test(lines[i]) && !/^```/.test(lines[i]) &&
             !/^>\s?/.test(lines[i]) && !/^---+\s*$/.test(lines[i]) &&
             !/^(\s*)([-*]|\d+\.)\s+/.test(lines[i]) &&
             !(lines[i].indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1]))) {
        pbuf.push(lines[i]); i++;
      }
      out.push("<p>" + inline(esc(pbuf.join(" "))) + "</p>");
    }
    return out.join("\n");
  }

  function buildList(items) {
    var ordered = items[0].ordered;
    var tag = ordered ? "ol" : "ul";
    var start = ordered && items[0].num !== 1 ? ' start="' + items[0].num + '"' : "";
    var html = "<" + tag + start + ">";
    var n = 0;
    while (n < items.length) {
      var it = items[n];
      var li = "<li>" + inline(esc(it.text));
      var children = [];
      var k = n + 1;
      while (k < items.length && items[k].indent > it.indent) { children.push(items[k]); k++; }
      if (children.length) li += buildList(children);
      li += "</li>";
      html += li;
      n = k;
    }
    html += "</" + tag + ">";
    return html;
  }

  var viewRead = document.getElementById("view-read");
  if (viewRead) viewRead.innerHTML = render(src);
  var rawEl = document.getElementById("raw");
  if (rawEl) rawEl.textContent = src;

  var tabRead = document.getElementById("tab-read");
  var tabRaw = document.getElementById("tab-raw");
  var viewRaw = document.getElementById("view-raw");
  function select(which) {
    var read = which === "read";
    if (tabRead) tabRead.setAttribute("aria-selected", read ? "true" : "false");
    if (tabRaw) tabRaw.setAttribute("aria-selected", read ? "false" : "true");
    if (viewRead) viewRead.hidden = !read;
    if (viewRaw) viewRaw.hidden = read;
  }
  if (tabRead) tabRead.addEventListener("click", function () { select("read"); });
  if (tabRaw) tabRaw.addEventListener("click", function () { select("raw"); });

  var copyBtn = document.getElementById("copy");
  if (copyBtn) copyBtn.addEventListener("click", function () {
    var btn = this;
    navigator.clipboard.writeText(src).then(function () {
      var prev = btn.textContent;
      btn.textContent = "コピーしました ✓";
      setTimeout(function () { btn.textContent = prev; }, 1500);
    });
  });
})();
</script>
